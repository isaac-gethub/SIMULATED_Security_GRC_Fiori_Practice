ers and due dates, and remediation plans are tracked.<br><b>Sign-off:</b> Managers certify by subprocess and organization, based on the results.<br><b>Report:</b> I report the completion rate, issue aging and overdue items to management and audit."}], "why": "That automation reduces manual testing effort and gives earlier warning of control failures.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Process Control: automated controls and continuous monitoring?", "t": "mcq", "o": ["Plain definition with an example", "Offshore restrictions", "Pick suitable controls"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Process Control: automated controls and continuous monitoring?", "t": "mcq", "o": ["Remove first", "Data source and rule", "Check actual use"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Process Control: assessments, certification and issue remediation?", "t": "mcq", "o": ["Integration with IPS", "Maintain for custom Z transactions", "Planner and assignments"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Process Control: assessments, certification and issue remediation?", "t": "mcq", "o": ["Executive reporting", "Scheduled synchronization jobs", "Self-assessment and testing"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Process Control: automated controls and continuous monitoring", "prompt": "How do you set up automated control monitoring in SAP Process Control?", "model": "I select controls suited to automation, such as configuration checks and transaction rules with clear logic. I define the data source in the backend system, such as a table query or a standard report. I define the rule and the thresholds that decide pass or fail, and link it to the control. The rule runs on a schedule. Failures create deficiencies for the owner to investigate and resolve. I review the rules after system changes, since a changed table or process can break a rule silently.", "pts": ["Pick suitable controls", "Data source and rule", "Thresholds", "Scheduled run, deficiencies", "Maintain after changes"]}, {"title": "Process Control: assessments, certification and issue remediation", "prompt": "How do you run a control assessment and certification cycle in Process Control?", "model": "I define scope, timing and assignments in the planner for each organization and process. Control owners complete self-assessments and testers perform test plans on samples, attaching evidence. Failures create issues with owners and due dates, and remediation plans are tracked. Managers certify by subprocess and organization, based on the results. I report the completion rate, issue aging and overdue items to management and audit.", "pts": ["Planner and assignments", "Self-assessment and testing", "Issues with owners", "Sign-off", "Completion and aging reports"]}], "quiz": [{"q": "Which is a key point for: Process Control: automated controls and continuous monitoring?", "o": ["Risk = functions = actions and permissions", "Pick suitable controls", "Task-based design, small roles"], "a": 1, "e": "Correct key point: Pick suitable controls."}, {"q": "Which is a key point for: Process Control: automated controls and continuous monitoring?", "o": ["Choose control families", "Data source and rule", "Options compared"], "a": 1, "e": "Correct key point: Data source and rule."}, {"q": "Which is a key point for: Process Control: automated controls and continuous monitoring?", "o": ["Thresholds", "S_SERVICE and backend objects", "One page, decisions needed"], "a": 0, "e": "Correct key point: Thresholds."}, {"q": "Which is a key point for: Process Control: assessments, certification and issue remediation?", "o": ["Reconcile and monitor", "Remove or mitigate with evidence", "Planner and assignments"], "a": 2, "e": "Correct key point: Planner and assignments."}, {"q": "Which is a key point for: Process Control: assessments, certification and issue remediation?", "o": ["Self-assessment and testing", "Restrict cross-border support", "Gives real objects: S_TCODE, F_BKPF_BUK"], "a": 0, "e": "Correct key point: Self-assessment and testing."}, {"q": "Which is a key point for: Process Control: assessments, certification and issue remediation?", "o": ["Clean-up of temporary access", "Split by task, derive for org values", "Issues with owners"], "a": 2, "e": "Correct key point: Issues with owners."}], "scr": "PC rule, issue list", "qs": [35, 36]}, {"id": "6.6", "wk": "Week 6: Audit, Process Control and Risk", "title": "Risk Management and linking to controls", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What is SAP Risk Management, and how does it differ from the risk analysis done in Access Control?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can separate the two: enterprise risk versus access risk.<br><b>Hiring manager:</b> That you understand enterprise risk management as a process: identify, assess, respond, monitor, with link to controls.<br><b>Supervisor:</b> Mechanics: risk catalog, assessment scales for impact and likelihood, responses, key risk indicators and reporting."}, {"h": "The best answer", "p": "<b>Difference:</b> Access Control risk analysis finds segregation of duties conflicts in user access. Risk Management covers business and enterprise risks such as supply failure or fraud.<br><b>Process:</b> Risks are identified in a catalog, assessed by impact and likelihood, and given a response: accept, reduce, transfer or avoid.<br><b>Monitoring:</b> Key risk indicators track the risk over time and trigger alerts above thresholds.<br><b>Link:</b> Risks link to controls in Process Control, so the response is a real, tested control.<br><b>Reporting:</b> Heat maps and reports go to risk owners and management."}, {"h": "The interview question", "p": "<i>How do you connect enterprise risks to controls so the risk picture is credible?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you see how risks and controls connect.<br><b>Hiring manager:</b> That each key risk has controls that are tested, so reported risk levels have evidence behind them.<br><b>Supervisor:</b> Detail: risk catalog, links to control objectives, KRIs, risk response and reporting."}, {"h": "The best answer", "p": "<b>Link:</b> I link each key risk to the controls that reduce it, so the risk response is real.<br><b>Assess:</b> I assess inherent risk, then residual risk after considering the controls and their test results.<br><b>KRIs:</b> I add key risk indicators with thresholds that warn before a loss happens.<br><b>Test results:</b> A failed control raises the residual risk and triggers a review.<br><b>Report:</b> Heat maps, top risks and trends go to risk owners and executives."}], "why": "That you understand enterprise risk management as a process: identify, assess, respond, monitor, with link to controls.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Risk Management: register, assessment and response?", "t": "mcq", "o": ["Enterprise risk versus access risk", "Provisioning, removal, review, privileged, SoD", "MSMP routing"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Risk Management: register, assessment and response?", "t": "mcq", "o": ["Risk analysis before go-live", "Identify, assess, respond, monitor", "Monitoring reports"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Risk Management: risk analysis and linking to Process Control?", "t": "mcq", "o": ["Simplification list review", "Risks linked to controls", "Separate for divestiture"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Risk Management: risk analysis and linking to Process Control?", "t": "mcq", "o": ["Cost and effort", "Inherent versus residual", "Builder is not approver or importer"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Risk Management: register, assessment and response", "prompt": "What is SAP Risk Management, and how does it differ from the risk analysis done in Access Control?", "model": "Access Control risk analysis finds segregation of duties conflicts in user access. Risk Management covers business and enterprise risks such as supply failure or fraud. Risks are identified in a catalog, assessed by impact and likelihood, and given a response: accept, reduce, transfer or avoid. Key risk indicators track the risk over time and trigger alerts above thresholds. Risks link to controls in Process Control, so the response is a real, tested control. Heat maps and reports go to risk owners and management.", "pts": ["Enterprise risk versus access risk", "Identify, assess, respond, monitor", "Impact and likelihood", "KRIs", "Links to controls"]}, {"title": "Risk Management: risk analysis and linking to Process Control", "prompt": "How do you connect enterprise risks to controls so the risk picture is credible?", "model": "I link each key risk to the controls that reduce it, so the risk response is real. I assess inherent risk, then residual risk after considering the controls and their test results. I add key risk indicators with thresholds that warn before a loss happens. A failed control raises the residual risk and triggers a review. Heat maps, top risks and trends go to risk owners and executives.", "pts": ["Risks linked to controls", "Inherent versus residual", "KRIs", "Failed controls raise risk", "Executive reporting"]}], "quiz": [{"q": "Which is a key point for: Risk Management: register, assessment and response?", "o": ["Light change process", "Generic IDs treated as high risk", "Enterprise risk versus access risk"], "a": 2, "e": "Correct key point: Enterprise risk versus access risk."}, {"q": "Which is a key point for: Risk Management: register, assessment and response?", "o": ["Outcome and lesson", "Identify, assess, respond, monitor", "Issues and remediation"], "a": 1, "e": "Correct key point: Identify, assess, respond, monitor."}, {"q": "Which is a key point for: Risk Management: register, assessment and response?", "o": ["Review change logs", "Restrict cross-border support", "Impact and likelihood"], "a": 2, "e": "Correct key point: Impact and likelihood."}, {"q": "Which is a key point for: Risk Management: risk analysis and linking to Process Control?", "o": ["Logging and frequent review", "Risks linked to controls", "Completion and aging reports"], "a": 1, "e": "Correct key point: Risks linked to controls."}, {"q": "Which is a key point for: Risk Management: risk analysis and linking to Process Control?", "o": ["Offered alternatives", "Completion and aging reports", "Inherent versus residual"], "a": 2, "e": "Correct key point: Inherent versus residual."}, {"q": "Which is a key point for: Risk Management: risk analysis and linking to Process Control?", "o": ["Restrictions by value", "Written follow-up", "KRIs"], "a": 2, "e": "Correct key point: KRIs."}], "scr": "RM heat map, KRI", "qs": [22, 37]}, {"id": "7.1", "wk": "Week 7: Government and regulated", "title": "Clearance-restricted administration", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>In a government or defence-related SAP environment, some roles require cleared or nationality-restricted staff. How do you handle security administration in that setting?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you understand why this matters and can work within the constraints, including clearance eligibility.<br><b>Hiring manager:</b> That you can design access and support models that respect clearance, location and need-to-know rules.<br><b>Supervisor:</b> Detail: restricting privileged roles to cleared staff, offshore restrictions, named administrators, logging, and separation of environments."}, {"h": "The best answer", "p": "<b>Constraint:</b> Some systems hold controlled or classified information, so only people with the required clearance, citizenship or location may administer them.<br><b>Access design:</b> Privileged roles and firefighter IDs are limited to approved, named, cleared staff, tracked in a register that is checked at each request.<br><b>Support model:</b> Offshore or contractor support is blocked from these systems or limited to non-sensitive tasks, per contract rules.<br><b>Controls:</b> Strict logging, frequent review of administrators, and separate accounts for admin work.<br><b>Compliance:</b> I map the setup to the applicable framework and keep evidence for the audits that follow."}], "why": "That you can design access and support models that respect clearance, location and need-to-know rules.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Clearance-restricted staff and access segregation?", "t": "mcq", "o": ["Clearance and need-to-know", "Process improvement", "Worked example"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Clearance-restricted staff and access segregation?", "t": "mcq", "o": ["Role mining and anomaly detection", "Risk = functions = actions and permissions", "Cleared named administrators"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Clearance-restricted staff and access segregation", "prompt": "In a government or defence-related SAP environment, some roles require cleared or nationality-restricted staff. How do you handle security administration in that setting?", "model": "Some systems hold controlled or classified information, so only people with the required clearance, citizenship or location may administer them. Privileged roles and firefighter IDs are limited to approved, named, cleared staff, tracked in a register that is checked at each request. Offshore or contractor support is blocked from these systems or limited to non-sensitive tasks, per contract rules. Strict logging, frequent review of administrators, and separate accounts for admin work. I map the setup to the applicable framework and keep evidence for the audits that follow.", "pts": ["Clearance and need-to-know", "Cleared named administrators", "Offshore restrictions", "Logging and frequent review", "Evidence for audits"]}], "quiz": [{"q": "Which is a key point for: Clearance-restricted staff and access segregation?", "o": ["IAS authenticates; IPS provisions", "Clearance and need-to-know", "Map to roles, log, authentication"], "a": 1, "e": "Correct key point: Clearance and need-to-know."}, {"q": "Which is a key point for: Clearance-restricted staff and access segregation?", "o": ["Cleared named administrators", "Gap register", "Tell stakeholders quickly"], "a": 0, "e": "Correct key point: Cleared named administrators."}, {"q": "Which is a key point for: Clearance-restricted staff and access segregation?", "o": ["Owner approval", "Offshore restrictions", "One page, decisions needed"], "a": 1, "e": "Correct key point: Offshore restrictions."}], "scr": "Admin register, EAM", "qs": [43]}, {"id": "7.2", "wk": "Week 7: Government and regulated", "title": "Mapping NIST, NCSC and FedRAMP to SAP", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How would you map a government security framework such as NIST SP 800-53, NCSC guidance or FedRAMP to SAP security controls?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know the frameworks exist and can talk about them in outline.<br><b>Hiring manager:</b> That you can translate framework language into specific SAP settings and evidence.<br><b>Supervisor:</b> Detail: access control, audit and accountability, identification and authentication families mapped to roles, audit log, password policy, SSO."}, {"h": "The best answer", "p": "<b>Start with the families:</b> I take the relevant control families, such as access control, audit and accountability, and identification and authentication.<br><b>Map to SAP:</b> Access control maps to roles, least privilege and SoD. Audit maps to the security audit log and change documents. Authentication maps to password policy, SSO and multi-factor.<br><b>Evidence:</b> For each mapped control I define the SAP report or setting that evidences it, and the owner.<br><b>Gaps:</b> I record gaps and a plan, with risk acceptance where needed.<br><b>Maintain:</b> I review the mapping after major releases and framework updates."}], "why": "That you can translate framework language into specific SAP settings and evidence.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Mapping NIST, NCSC and FedRAMP controls to SAP?", "t": "mcq", "o": ["Choose control families", "Hypercare", "Firefighter use"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Mapping NIST, NCSC and FedRAMP controls to SAP?", "t": "mcq", "o": ["Process improvement", "Audit log", "Map to roles, log, authentication"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Mapping NIST, NCSC and FedRAMP controls to SAP", "prompt": "How would you map a government security framework such as NIST SP 800-53, NCSC guidance or FedRAMP to SAP security controls?", "model": "I take the relevant control families, such as access control, audit and accountability, and identification and authentication. Access control maps to roles, least privilege and SoD. Audit maps to the security audit log and change documents. Authentication maps to password policy, SSO and multi-factor. For each mapped control I define the SAP report or setting that evidences it, and the owner. I record gaps and a plan, with risk acceptance where needed. I review the mapping after major releases and framework updates.", "pts": ["Choose control families", "Map to roles, log, authentication", "Define evidence per control", "Gap register", "Maintain the mapping"]}], "quiz": [{"q": "Which is a key point for: Mapping NIST, NCSC and FedRAMP controls to SAP?", "o": ["Choose control families", "Quarterly review", "Builder is not approver or importer"], "a": 0, "e": "Correct key point: Choose control families."}, {"q": "Which is a key point for: Mapping NIST, NCSC and FedRAMP controls to SAP?", "o": ["Trust to IAS", "Issues and remediation", "Map to roles, log, authentication"], "a": 2, "e": "Correct key point: Map to roles, log, authentication."}, {"q": "Which is a key point for: Mapping NIST, NCSC and FedRAMP controls to SAP?", "o": ["Define evidence per control", "Provisioning, removal, review, privileged, SoD", "Audit policies"], "a": 0, "e": "Correct key point: Define evidence per control."}], "scr": "Control mapping sheet", "qs": [44]}, {"id": "7.3", "wk": "Week 7: Government and regulated", "title": "Sovereign cloud and data residency", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Your client needs to keep SAP data in-country or in a sovereign cloud. How does that affect security design?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you understand data location is a legal and security matter.<br><b>Hiring manager:</b> That you can design access and support models to meet residency rules.<br><b>Supervisor:</b> Detail: where data is stored, who can access from abroad, support access, encryption keys, logs."}, {"h": "The best answer", "p": "<b>Requirement:</b> I confirm the rule: where data must stay, and who may access it from where.<br><b>Hosting:</b> I choose regions or sovereign offerings that meet the rule, and confirm what they cover.<br><b>Access:</b> Support and administration from other countries are restricted or approved case by case, with logging.<br><b>Keys and logs:</b> I consider customer-managed encryption keys and keep logs inside the region.<br><b>Evidence:</b> I document the controls for regulators and auditors."}], "why": "That you can design access and support models to meet residency rules.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Sovereign cloud and data residency?", "t": "mcq", "o": ["Data source and rule", "Confirm the legal rule", "Negative tests"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Sovereign cloud and data residency?", "t": "mcq", "o": ["Compliant hosting region", "Audit log monitoring", "Numbers not jargon"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Sovereign cloud and data residency", "prompt": "Your client needs to keep SAP data in-country or in a sovereign cloud. How does that affect security design?", "model": "I confirm the rule: where data must stay, and who may access it from where. I choose regions or sovereign offerings that meet the rule, and confirm what they cover. Support and administration from other countries are restricted or approved case by case, with logging. I consider customer-managed encryption keys and keep logs inside the region. I document the controls for regulators and auditors.", "pts": ["Confirm the legal rule", "Compliant hosting region", "Restrict cross-border support", "Keys and logs in region", "Document for regulators"]}], "quiz": [{"q": "Which is a key point for: Sovereign cloud and data residency?", "o": ["Confirm the legal rule", "Mitigation option at approval", "Provisioning, removal, review, privileged, SoD"], "a": 0, "e": "Correct key point: Confirm the legal rule."}, {"q": "Which is a key point for: Sovereign cloud and data residency?", "o": ["Hypercare", "Identify, assess, respond, monitor", "Compliant hosting region"], "a": 2, "e": "Correct key point: Compliant hosting region."}, {"q": "Which is a key point for: Sovereign cloud and data residency?", "o": ["SAML or OIDC trust", "Outcome and lesson", "Restrict cross-border support"], "a": 2, "e": "Correct key point: Restrict cross-border support."}], "scr": "Region and key settings", "qs": [56]}, {"id": "7.4", "wk": "Week 7: Government and regulated", "title": "Regulator and federal audit evidence", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>A government regulator or federal auditor is reviewing your SAP environment. How do you prepare and manage it?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A calm, organized approach.<br><b>Hiring manager:</b> That you control the process, provide accurate evidence and keep leadership informed.<br><b>Supervisor:</b> Detail: evidence list, owners, single point of contact, review before release, tracking requests."}, {"h": "The best answer", "p": "<b>Prepare:</b> I get the scope and the evidence request list, assign owners and set deadlines.<br><b>Single channel:</b> One coordinator handles requests and responses, so answers are consistent.<br><b>Quality:</b> Evidence is reviewed for accuracy and completeness before release, and sources are system-generated.<br><b>Issues:</b> Known gaps are disclosed with a remediation plan, rather than discovered by the auditor.<br><b>Close:</b> I track open items to closure and capture lessons for the next audit."}], "why": "That you control the process, provide accurate evidence and keep leadership informed.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Regulator or federal audit evidence?", "t": "mcq", "o": ["Control platform admins", "Clear ask", "Scope and owners"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Regulator or federal audit evidence?", "t": "mcq", "o": ["Privacy compliance", "Single coordinator", "Clearance and need-to-know"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Regulator or federal audit evidence", "prompt": "A government regulator or federal auditor is reviewing your SAP environment. How do you prepare and manage it?", "model": "I get the scope and the evidence request list, assign owners and set deadlines. One coordinator handles requests and responses, so answers are consistent. Evidence is reviewed for accuracy and completeness before release, and sources are system-generated. Known gaps are disclosed with a remediation plan, rather than discovered by the auditor. I track open items to closure and capture lessons for the next audit.", "pts": ["Scope and owners", "Single coordinator", "Review before release", "Disclose gaps with plan", "Track to closure"]}], "quiz": [{"q": "Which is a key point for: Regulator or federal audit evidence?", "o": ["Scheduled run, deficiencies", "Risk analysis before go-live", "Scope and owners"], "a": 2, "e": "Correct key point: Scope and owners."}, {"q": "Which is a key point for: Regulator or federal audit evidence?", "o": ["Fast fix with approval", "/IWFND/ERROR_LOG and trace", "Single coordinator"], "a": 2, "e": "Correct key point: Single coordinator."}, {"q": "Which is a key point for: Regulator or federal audit evidence?", "o": ["Permission groups and target populations", "Review before release", "Check indicators and defaults"], "a": 1, "e": "Correct key point: Review before release."}], "scr": "Evidence tracker", "qs": [57]}, {"id": "8.1", "wk": "Week 8: Lead focus", "title": "Security strategy and GRC architecture", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>You are the new SAP security lead. How would you build a security strategy and roadmap?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A confident, structured answer showing leadership.<br><b>Hiring manager:</b> That you tie strategy to business risk and audit needs, and sequence work realistically with sponsors.<br><b>Supervisor:</b> Detail: current-state assessment, target design, priorities, quick wins, milestones and measures."}, {"h": "The best answer", "p": "<b>Assess:</b> I assess the current state: roles, SoD, privileged access, cloud footprint, tools, team skills and audit findings.<br><b>Vision:</b> I set the target state with the business: least privilege, automated access governance, covering cloud and S/4.<br><b>Prioritize:</b> I rank by risk and effort. Quick wins first, such as critical access and unused users, then larger items such as role redesign.<br><b>Roadmap:</b> I turn this into a 12 to 24 month roadmap with owners, milestones and budget.<br><b>Measure:</b> I agree a short list of measures with sponsors and report regularly."}, {"h": "The interview question", "p": "<i>How would you decide between keeping on-premise GRC, moving to cloud IAG, or running both?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can give a considered answer, not a slogan.<br><b>Hiring manager:</b> That you weigh functionality, cost, landscape, timelines and risk, and recommend a path.<br><b>Supervisor:</b> Detail: feature gaps, number of systems, S/4 cloud plans, licensing, migration effort and integration."}, {"h": "The best answer", "p": "<b>Landscape:</b> I check where systems are going: RISE and public cloud favor IAG, while heavy ECC and customizations favor staying on-premise for now.<br><b>Functionality:</b> I compare required features with what IAG covers today, and note gaps such as specific workflows.<br><b>Cost and effort:</b> I estimate licensing, migration and run costs, and the effort to move rules, roles and mitigations.<br><b>Options:</b> I present the options with risk and timeline: stay, migrate, or hybrid for a period.<br><b>Recommendation:</b> I recommend based on the roadmap and revisit at set checkpoints."}], "why": "That you tie strategy to business risk and audit needs, and sequence work realistically with sponsors.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Security strategy and roadmap?", "t": "mcq", "o": ["Assess current state", "Names debug-replace and S_TABU_DIS", "Single = building block; composite = job bundle"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Security strategy and roadmap?", "t": "mcq", "o": ["/IWFND/ERROR_LOG and trace", "Role size and profile limits", "Target tied to business risk"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: GRC architecture: on-premise versus cloud?", "t": "mcq", "o": ["Landscape direction", "Disclose gaps with plan", "Roadmap by day 90"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: GRC architecture: on-premise versus cloud?", "t": "mcq", "o": ["Feature comparison", "Choose control families", "Business Partner changes"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Security strategy and roadmap", "prompt": "You are the new SAP security lead. How would you build a security strategy and roadmap?", "model": "I assess the current state: roles, SoD, privileged access, cloud footprint, tools, team skills and audit findings. I set the target state with the business: least privilege, automated access governance, covering cloud and S/4. I rank by risk and effort. Quick wins first, such as critical access and unused users, then larger items such as role redesign. I turn this into a 12 to 24 month roadmap with owners, milestones and budget. I agree a short list of measures with sponsors and report regularly.", "pts": ["Assess current state", "Target tied to business risk", "Prioritize quick wins", "12–24 month roadmap", "Measures and sponsor reporting"]}, {"title": "GRC architecture: on-premise versus cloud", "prompt": "How would you decide between keeping on-premise GRC, moving to cloud IAG, or running both?", "model": "I check where systems are going: RISE and public cloud favor IAG, while heavy ECC and customizations favor staying on-premise for now. I compare required features with what IAG covers today, and note gaps such as specific workflows. I estimate licensing, migration and run costs, and the effort to move rules, roles and mitigations. I present the options with risk and timeline: stay, migrate, or hybrid for a period. I recommend based on the roadmap and revisit at set checkpoints.", "pts": ["Landscape direction", "Feature comparison", "Cost and effort", "Options with risks", "Checkpoints"]}], "quiz": [{"q": "Which is a key point for: Security strategy and roadmap?", "o": ["Firefighter ID, firefighter, controller", "Monitoring", "Assess current state"], "a": 2, "e": "Correct key point: Assess current state."}, {"q": "Which is a key point for: Security strategy and roadmap?", "o": ["Target tied to business risk", "Control framework system of record", "Remove temporary access"], "a": 0, "e": "Correct key point: Target tied to business risk."}, {"q": "Which is a key point for: Security strategy and roadmap?", "o": ["Audit log", "Links to controls", "Prioritize quick wins"], "a": 2, "e": "Correct key point: Prioritize quick wins."}, {"q": "Which is a key point for: GRC architecture: on-premise versus cloud?", "o": ["Avoids one huge role", "Landscape direction", "Sign-off"], "a": 1, "e": "Correct key point: Landscape direction."}, {"q": "Which is a key point for: GRC architecture: on-premise versus cloud?", "o": ["Feature comparison", "Baseline metrics", "Compares missing values with the role"], "a": 0, "e": "Correct key point: Feature comparison."}, {"q": "Which is a key point for: GRC architecture: on-premise versus cloud?", "o": ["Cost and effort", "Retests and records evidence", "Business Partner changes"], "a": 0, "e": "Correct key point: Cost and effort."}], "scr": "Roadmap, architecture view", "qs": [45, 46]}, {"id": "8.2", "wk": "Week 8: Lead focus", "title": "Vendors, offshore teams and building a team", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you manage a security team that includes vendors and offshore staff?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you have managed distributed teams.<br><b>Hiring manager:</b> That you keep quality and control while using the cost advantage, with clear service levels.<br><b>Supervisor:</b> Detail: handover model, queues and priorities, quality checks, access limits, regular reviews."}, {"h": "The best answer", "p": "<b>Structure:</b> I define what offshore does, such as routine requests and reports, and what stays onshore, such as approvals and design decisions.<br><b>Service levels:</b> I set clear service levels and a simple dashboard of volume, age and quality.<br><b>Quality:</b> I do regular sampling of completed work and root-cause review of errors.<br><b>Access:</b> Offshore staff get least-privilege access with logging and no standing powerful access.<br><b>People:</b> I keep regular calls, written runbooks, and treat the vendor team as part of the team."}, {"h": "The interview question", "p": "<i>How do you build and develop a security and GRC team?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> Evidence of people leadership.<br><b>Hiring manager:</b> That you hire for judgement and grow people, creating depth and cover.<br><b>Supervisor:</b> Detail: skills matrix, mentoring, rotations, documentation, succession."}, {"h": "The best answer", "p": "<b>Skills:</b> I map the skills needed, such as role design, GRC, Fiori and cloud, and find the gaps.<br><b>Hiring:</b> I hire for judgement and learning ability and train specific tools.<br><b>Development:</b> I use mentoring, rotations and certification support, and give people ownership of areas.<br><b>Depth:</b> I document procedures and make sure every key task has a backup.<br><b>Culture:</b> I make sure people can raise concerns and learn from errors without blame."}], "why": "That you keep quality and control while using the cost advantage, with clear service levels.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Running vendors and offshore teams?", "t": "mcq", "o": ["Role content and refresh", "Review before release", "Clear split of work"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Running vendors and offshore teams?", "t": "mcq", "o": ["Parameters and RFC checks", "Service levels and dashboard", "Enterprise risk versus access risk"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Hiring, mentoring and building the team?", "t": "mcq", "o": ["Skills map", "IAM apps replace PFCG/SU01", "Clearance and need-to-know"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Hiring, mentoring and building the team?", "t": "mcq", "o": ["Baseline and findings", "Hire for judgement", "Role size and profile limits"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Running vendors and offshore teams", "prompt": "How do you manage a security team that includes vendors and offshore staff?", "model": "I define what offshore does, such as routine requests and reports, and what stays onshore, such as approvals and design decisions. I set clear service levels and a simple dashboard of volume, age and quality. I do regular sampling of completed work and root-cause review of errors. Offshore staff get least-privilege access with logging and no standing powerful access. I keep regular calls, written runbooks, and treat the vendor team as part of the team.", "pts": ["Clear split of work", "Service levels and dashboard", "Sampling and root cause", "Least privilege for vendors", "Runbooks and rhythm"]}, {"title": "Hiring, mentoring and building the team", "prompt": "How do you build and develop a security and GRC team?", "model": "I map the skills needed, such as role design, GRC, Fiori and cloud, and find the gaps. I hire for judgement and learning ability and train specific tools. I use mentoring, rotations and certification support, and give people ownership of areas. I document procedures and make sure every key task has a backup. I make sure people can raise concerns and learn from errors without blame.", "pts": ["Skills map", "Hire for judgement", "Mentoring and rotation", "Backups and runbooks", "Blame-free learning"]}], "quiz": [{"q": "Which is a key point for: Running vendors and offshore teams?", "o": ["Phased plan", "Numbers not jargon", "Clear split of work"], "a": 2, "e": "Correct key point: Clear split of work."}, {"q": "Which is a key point for: Running vendors and offshore teams?", "o": ["Risk analysis on merged access", "Service levels and dashboard", "Feature comparison"], "a": 1, "e": "Correct key point: Service levels and dashboard."}, {"q": "Which is a key point for: Running vendors and offshore teams?", "o": ["SU25 after upgrade", "Sampling and root cause", "Day-one minimum access"], "a": 1, "e": "Correct key point: Sampling and root cause."}, {"q": "Which is a key point for: Hiring, mentoring and building the team?", "o": ["Fiori replaces many transactions", "Skills map", "Retests and records evidence"], "a": 1, "e": "Correct key point: Skills map."}, {"q": "Which is a key point for: Hiring, mentoring and building the team?", "o": ["S_SERVICE and backend objects", "Verify every request", "Hire for judgement"], "a": 2, "e": "Correct key point: Hire for judgement."}, {"q": "Which is a key point for: Hiring, mentoring and building the team?", "o": ["Mentoring and rotation", "Reviewer summaries", "Risks: wrong output, data exposure"], "a": 0, "e": "Correct key point: Mentoring and rotation."}], "scr": "SLA dashboard", "qs": [47, 59]}, {"id": "8.3", "wk": "Week 8: Lead focus", "title": "KPIs and talking to executives", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Which measures do you report to management about SAP access security, and how do you present them?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A short list of clear measures.<br><b>Hiring manager:</b> That your measures drive decisions, not just fill a slide.<br><b>Supervisor:</b> Detail: conflicts count, critical access users, review completion, request cycle time, firefighter use, overdue items."}, {"h": "The best answer", "p": "<b>Risk:</b> Number of users with SoD conflicts and with critical access, trending down.<br><b>Process:</b> Access request cycle time, access review completion, and overdue removals.<br><b>Emergency:</b> Firefighter sessions and the share reviewed on time.<br><b>Audit:</b> Open audit findings and age.<br><b>Presentation:</b> One page with trends, red items and the decisions needed. I explain each measure in business terms."}, {"h": "The interview question", "p": "<i>How do you explain an access security risk to a non-technical executive or audit committee?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> Plain language and confidence.<br><b>Hiring manager:</b> That you can translate a technical issue into business impact and a clear ask.<br><b>Supervisor:</b> Example of how you frame risk, options and the decision you need."}, {"h": "The best answer", "p": "<b>Start with impact:</b> I start with what could happen to the business, for example a payment could be made without a second check.<br><b>Evidence:</b> I give the number and the trend, not the transaction codes.<br><b>Options:</b> I give two or three options with cost, effort and residual risk.<br><b>Ask:</b> I end with the decision I need and the date.<br><b>Follow up:</b> I confirm the decision in writing and report progress."}], "why": "That your measures drive decisions, not just fill a slide.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Security KPIs and reporting?", "t": "mcq", "o": ["Conflicts and critical access", "Design rules", "BRM = controlled role definition"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Security KPIs and reporting?", "t": "mcq", "o": ["Cycle time and review completion", "Maintain for custom Z transactions", "Encryption"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Talking to executives and audit committees?", "t": "mcq", "o": ["IAS authenticates; IPS provisions", "Business impact first", "SUIM reports for review"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Talking to executives and audit committees?", "t": "mcq", "o": ["Numbers not jargon", "Thresholds", "Central identity and MFA"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Security KPIs and reporting", "prompt": "Which measures do you report to management about SAP access security, and how do you present them?", "model": "Number of users with SoD conflicts and with critical access, trending down. Access request cycle time, access review completion, and overdue removals. Firefighter sessions and the share reviewed on time. Open audit findings and age. One page with trends, red items and the decisions needed. I explain each measure in business terms.", "pts": ["Conflicts and critical access", "Cycle time and review completion", "Firefighter use", "Audit findings aging", "One page, decisions needed"]}, {"title": "Talking to executives and audit committees", "prompt": "How do you explain an access security risk to a non-technical executive or audit committee?", "model": "I start with what could happen to the business, for example a payment could be made without a second check. I give the number and the trend, not the transaction codes. I give two or three options with cost, effort and residual risk. I end with the decision I need and the date. I confirm the decision in writing and report progress.", "pts": ["Business impact first", "Numbers not jargon", "Options with trade-offs", "Clear ask", "Written follow-up"]}], "quiz": [{"q": "Which is a key point for: Security KPIs and reporting?", "o": ["Roles and role collections", "Parameters and RFC checks", "Conflicts and critical access"], "a": 2, "e": "Correct key point: Conflicts and critical access."}, {"q": "Which is a key point for: Security KPIs and reporting?", "o": ["Early assessment and SoD check", "Govern the trust configuration", "Cycle time and review completion"], "a": 2, "e": "Correct key point: Cycle time and review completion."}, {"q": "Which is a key point for: Security KPIs and reporting?", "o": ["Firefighter use", "Phased plan", "Restrict cross-border support"], "a": 0, "e": "Correct key point: Firefighter use."}, {"q": "Which is a key point for: Talking to executives and audit committees?", "o": ["Connector groups", "Business impact first", "Trust to IAS"], "a": 1, "e": "Correct key point: Business impact first."}, {"q": "Which is a key point for: Talking to executives and audit committees?", "o": ["Numbers not jargon", "Profile parameters", "Inherent versus residual"], "a": 0, "e": "Correct key point: Numbers not jargon."}, {"q": "Which is a key point for: Talking to executives and audit committees?", "o": ["Least privilege for vendors", "Options with trade-offs", "Role mining from usage"], "a": 1, "e": "Correct key point: Options with trade-offs."}], "scr": "KPI one-pager", "qs": [48, 49]}, {"id": "8.4", "wk": "Week 8: Lead focus", "title": "Your first 90 days", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What would you do in your first 90 days as SAP security lead?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A structured plan.<br><b>Hiring manager:</b> That you listen first, find quick wins, and build credibility before big changes.<br><b>Supervisor:</b> Detail: meeting the team, reviewing audit findings, baseline, quick wins and a plan."}, {"h": "The best answer", "p": "<b>Days 1–30:</b> Listen and learn: meet the team, process owners, audit and Basis. Review findings, tools and the access baseline.<br><b>Days 31–60:</b> Deliver quick wins, such as removing unused critical access and fixing overdue reviews. Agree priorities with sponsors.<br><b>Days 61–90:</b> Present the roadmap with owners and measures, and begin the first workstream.<br><b>Team:</b> Clarify roles and skills gaps, and set up regular team rhythm.<br><b>Report:</b> Provide a short progress report at 30, 60 and 90 days."}], "why": "That you listen first, find quick wins, and build credibility before big changes.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Your first 90 days?", "t": "mcq", "o": ["Conflicts and critical access", "Listen first", "Check for authorization checks in code"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Your first 90 days?", "t": "mcq", "o": ["Structural authorizations", "Central identity and MFA", "Baseline and findings"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Your first 90 days", "prompt": "What would you do in your first 90 days as SAP security lead?", "model": "Listen and learn: meet the team, process owners, audit and Basis. Review findings, tools and the access baseline. Deliver quick wins, such as removing unused critical access and fixing overdue reviews. Agree priorities with sponsors. Present the roadmap with owners and measures, and begin the first workstream. Clarify roles and skills gaps, and set up regular team rhythm. Provide a short progress report at 30, 60 and 90 days.", "pts": ["Listen first", "Baseline and findings", "Quick wins", "Roadmap by day 90", "Regular reporting"]}], "quiz": [{"q": "Which is a key point for: Your first 90 days?", "o": ["Task-based design, small roles", "Listen first", "Day-one minimum access"], "a": 1, "e": "Correct key point: Listen first."}, {"q": "Which is a key point for: Your first 90 days?", "o": ["Baseline and findings", "Test users per job", "Parameters and RFC checks"], "a": 0, "e": "Correct key point: Baseline and findings."}, {"q": "Which is a key point for: Your first 90 days?", "o": ["Secure the service accounts", "Three tools, three questions", "Quick wins"], "a": 2, "e": "Correct key point: Quick wins."}], "scr": "90-day plan", "qs": [50]}, {"id": "8.5", "wk": "Week 8: Lead focus", "title": "Release governance and Zero Trust", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>SAP cloud products release new features constantly. How do you keep security governed when the vendor changes things under you?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you understand cloud changes faster than on-premise.<br><b>Hiring manager:</b> That you have a process to see changes coming, assess them and act, without blocking the business.<br><b>Supervisor:</b> Detail: release notes review, test tenants, new role content, quarterly reviews, regression tests."}, {"h": "The best answer", "p": "<b>Awareness:</b> I assign someone to review release notes for security-relevant changes: new apps, role content and changed defaults.<br><b>Test:</b> I use a test or preview tenant to try changes before they reach production.<br><b>Assess:</b> I check new business catalogs and roles for conflicts and adjust restrictions.<br><b>Process:</b> Changes enter a light change process with owner approval and a record.<br><b>Review:</b> I hold a quarterly review of role content and configuration, and keep regression tests."}, {"h": "The interview question", "p": "<i>What does Zero Trust mean for an SAP landscape, and what would you change?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can explain the idea simply.<br><b>Hiring manager:</b> That you can connect the principle to concrete SAP changes.<br><b>Supervisor:</b> Examples: central identity, multi-factor, least privilege, continuous monitoring, network segmentation, API control."}, {"h": "The best answer", "p": "<b>Idea:</b> Never trust by location. Verify each user, device and request, and give the least access needed.<br><b>Identity:</b> Single sign-on through a central identity service with multi-factor authentication.<br><b>Least privilege:</b> Task-based roles, time-limited privileged access and regular review.<br><b>Monitoring:</b> Log and review key events, and alert on unusual activity.<br><b>Network and APIs:</b> Restrict direct access, secure RFC and API connections and segment environments."}], "why": "That you have a process to see changes coming, assess them and act, without blocking the business.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Release and cloud governance?", "t": "mcq", "o": ["Audit log", "Failed controls raise risk", "Review release notes"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Release and cloud governance?", "t": "mcq", "o": ["Mitigations feed Process Control", "Process improvement", "Preview tenant"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Zero Trust for SAP?", "t": "mcq", "o": ["Role mining and anomaly detection", "Reduces role clean-up", "Verify every request"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Zero Trust for SAP?", "t": "mcq", "o": ["Central identity and MFA", "Human approval", "Risk analysis on merged access"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Release and cloud governance", "prompt": "SAP cloud products release new features constantly. How do you keep security governed when the vendor changes things under you?", "model": "I assign someone to review release notes for security-relevant changes: new apps, role content and changed defaults. I use a test or preview tenant to try changes before they reach production. I check new business catalogs and roles for conflicts and adjust restrictions. Changes enter a light change process with owner approval and a record. I hold a quarterly review of role content and configuration, and keep regression tests.", "pts": ["Review release notes", "Preview tenant", "Check new role content", "Light change process", "Quarterly review"]}, {"title": "Zero Trust for SAP", "prompt": "What does Zero Trust mean for an SAP landscape, and what would you change?", "model": "Never trust by location. Verify each user, device and request, and give the least access needed. Single sign-on through a central identity service with multi-factor authentication. Task-based roles, time-limited privileged access and regular review. Log and review key events, and alert on unusual activity. Restrict direct access, secure RFC and API connections and segment environments.", "pts": ["Verify every request", "Central identity and MFA", "Least privilege and time limits", "Monitoring", "Secure RFC and APIs"]}], "quiz": [{"q": "Which is a key point for: Release and cloud governance?", "o": ["Sign-off", "Links to least privilege", "Review release notes"], "a": 2, "e": "Correct key point: Review release notes."}, {"q": "Which is a key point for: Release and cloud governance?", "o": ["Reconcile and monitor", "Preview tenant", "Independent log review"], "a": 1, "e": "Correct key point: Preview tenant."}, {"q": "Which is a key point for: Release and cloud governance?", "o": ["Inherent versus residual", "Check new role content", "Cycle time and review completion"], "a": 1, "e": "Correct key point: Check new role content."}, {"q": "Which is a key point for: Zero Trust for SAP?", "o": ["MSMP routing", "Verify every request", "Independent log review"], "a": 1, "e": "Correct key point: Verify every request."}, {"q": "Which is a key point for: Zero Trust for SAP?", "o": ["Central identity and MFA", "Route by risk and type", "Mitigations feed Process Control"], "a": 0, "e": "Correct key point: Central identity and MFA."}, {"q": "Which is a key point for: Zero Trust for SAP?", "o": ["Least privilege and time limits", "Least privilege for vendors", "/IWFND/ERROR_LOG and trace"], "a": 0, "e": "Correct key point: Least privilege and time limits."}], "scr": "Release notes review", "qs": [51, 53]}, {"id": "8.6", "wk": "Week 8: Lead focus", "title": "AI in access governance", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How could AI help with SAP access governance, and what risks would you manage?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A balanced, practical answer, not hype.<br><b>Hiring manager:</b> That you see real use cases and sensible guardrails.<br><b>Supervisor:</b> Examples: role mining, anomaly detection, risk summaries in reviews, drafting justifications, with human approval."}, {"h": "The best answer", "p": "<b>Use cases:</b> Role mining and clean-up suggestions, anomaly detection in usage and firefighter logs, and plain-language summaries of conflicts for reviewers.<br><b>Benefits:</b> Faster reviews, better reviewer understanding and earlier detection of unusual activity.<br><b>Risks:</b> Wrong or unexplained suggestions, data exposure to external services, and over-reliance.<br><b>Guardrails:</b> Humans approve changes, data is kept inside approved services, and results are tested const REVIEW=/[?&]review=1/.test(location.search);
let P={},PKEY='tibsec:v1';
function save(){try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){};if(typeof queuePush==='function')queuePush()}
function ps(id){return P[id]||(P[id]={sim:0,lab:{},tb:{},quiz:-1})}
const $=s=>document.querySelector(s),app=$('#app');
function simDone(u){return !u.sim.length||ps(u.id).sim}
function labDone(u){return !u.lab||u.lab.tasks.every((t,i)=>ps(u.id).lab[i])}
function tbDone(u){return u.tb.every((t,i)=>ps(u.id).tb[i])}
function quizDone(u){return ps(u.id).quiz>=u.quiz.length-1}
function done(u){return simDone(u)&&labDone(u)&&tbDone(u)&&quizDone(u)}
function open_(i){return REVIEW||(typeof STAFF!=='undefined'&&STAFF)||i===0||done(UNITS[i-1])}
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function go(id,step){if(id===undefined){home();return}view(id,step||0)}
function home(){
  $('#crumb').textContent='Weeks 0 to 8';
  let h=`<div class="homewrap"><div class="mintro"><h1>Pick a unit</h1><span class="small mut">Learn, simulate, analyse, teach back, quiz. Finish a unit to unlock the next.</span><span class="mleg"><i class="lb"></i>No simulated screens <i class="lg"></i>With simulated screens</span><button class="btn sec" onclick="docs('guide')">User guide</button></div><div class="menu8">`;
  let wk=null;
  UNITS.forEach((u,i)=>{
    if(u.wk!==wk){if(wk!==null)h+='</div>';wk=u.wk;h+=`<div class="mwk"><h4>${esc(wk)}</h4>${/^Week 8/.test(wk)?'<div class="lead">Lead only. Seniors may skip.</div>':''}`}
    const o=open_(i),d=done(u);const cv=(u.sim&&u.sim.length)?'cg':'';
    const parts=[simDone(u)?1:0,labDone(u)?1:0,tbDone(u)?1:0,quizDone(u)?1:0].reduce((a,b)=>a+b,0);
    h+=`<div class="mu ${cv} ${d?'done':''} ${o?'':'lock'}" title="${esc(u.title)}" ${o?`onclick="go('${u.id}')"`:''}><span class="n">${d?'✓':u.id}</span><span class="t">${esc(u.title)}</span><span class="st">${o?(d?'':parts+'/4'):'🔒'}</span></div>`;
  });

  h+=`<details class="mabout"><summary>About this pilot</summary><p class="mut small">The SAP screens are a training simulation, not a live SAP system. The company, users and data are fictional. Your progress is saved to your TIB account, so you can continue on any device. Weeks 0 to 7 serve Senior and Lead candidates. Week 8 is Lead only: Senior candidates may skip it. This is the first build: unit content, simulated screens and quizzes are being added in batches.</p></details></div>`;
  app.classList.remove('fit');app.innerHTML=h;app.scrollTop=0;
}
function view(id,step){
  const u=UNITS.find(x=>x.id===id),i=UNITS.indexOf(u);
  if(!open_(i)){home();return}
  $('#crumb').textContent='Unit '+u.id;
  const names=['1 Learn','2 Simulate','3 Analyse','4 Teach back','5 Quiz'];
  const dn=[true,simDone(u),labDone(u),tbDone(u),quizDone(u)];
  app.classList.remove('fit');let h=`<div class="small mut wkl">${esc(u.wk)}</div><h1 class="utl">Unit ${u.id}. ${u.title}</h1><div class="steps">${names.map((n,k)=>`<button class="${k===step?'on':''} ${dn[k]&&k>0?'dn':''}" onclick="go('${id}',${k})">${n}</button>`).join('')}</div><div id="pane"></div>`;

function nextBtn(u,step,label){return `<div class="row" style="margin-top:12px"><button class="btn" onclick="go('${u.id}',${step})">${label}</button></div>`}
function pLearn(u){

let SI=0,HELP=0,CUR=null,TV={};
function pSim(u){
  if(!u.sim.length){$('#pane').innerHTML=`<div class="card">This unit has no SAP screens. It is about concepts and language.</div>`+nextBtn(u,2,'Next: analyse');ps(u.id).sim=1;save();return}

  const sap=$('#sap'),cmd=$('#cmd'),msg=$('#msg');
  Object.keys(TV).forEach(k=>{const f=sap.querySelector('input[data-id="'+k+'"]');if(f&&!f.value)f.value=TV[k]});
  const a=st.a;

  let tgt=null;
  if(a.k==='cmd')tgt=cmd;else if(a.k==='click'||a.k==='type')tgt=sap.querySelector('[data-id="'+a.id+'"]');
  if(tgt)tgt.classList.add('tgt');
  if(a.k==='type'&&tgt)tgt.focus();if(a.k==='cmd')cmd.focus();
  const adv=()=>{if(a.k==='type')TV[a.id]=a.v;SI++;if(SI>=u.sim.length){ps(u.id).sim=1;save();finishSim(u)}else drawSim()};
  const bad=m=>{msg.textContent=m;sap.classList.remove('shake');void sap.offsetWidth;sap.classList.add('shake')};
  const norm=v=>v.trim().toUpperCase().replace(/^\/[NO]\s*/,'').replace(/^\/[NO]/,'');
  const runCmd=()=>{if(norm(cmd.value)===a.v.toUpperCase())adv();else bad('Not quite. Type '+(SI>0&&u.sim[SI-1].a.k==='cmd'?'/n':'')+a.v+' and press Enter.')};
  cmd.addEventListener('keydown',e=>{if(e.key==='Enter'&&a.k==='cmd')runCmd()});
  sap.addEventListener('click',e=>{
    const el=e.target.closest('[data-id]');if(!el)return;
    const id=el.getAttribute('data-id');
    if(a.k==='cmd'&&id==='enter'){runCmd();return}
    if(a.k==='click'){if(id===a.id)adv();else if(el.tagName!=='INPUT')bad('That is not the right place yet. Follow the orange outline.')}
    else if(a.k==='type'&&id==='enter'){const f=sap.querySelector('[data-id="'+a.id+'"]');if(f&&f.value.trim().toUpperCase()===a.v.toUpperCase())adv();else bad('Type '+a.v+' in the highlighted field first.')}
  });
  if(a.k==='type'&&tgt){tgt.addEventListener('keydown',e=>{if(e.key==='Enter'){if(tgt.value.trim().toUpperCase()===a.v.toUpperCase())adv();else bad('Type '+a.v+' exactly.')}});
    tgt.addEventListener('input',()=>{if(tgt.value.trim().toUpperCase()===a.v.toUpperCase()){tgt.blur();setTimeout(adv,350)}})}
  const nx=$('#nx');if(nx)nx.onclick=adv;
  const sh=$('#show');if(sh)sh.onclick=()=>{HELP++;
    if(a.k==='cmd'){cmd.value=a.v;setTimeout(adv,300)}
    else if(a.k==='type'){tgt.value=a.v;setTimeout(adv,300)}

DOCS.guide.h=`<p><strong>TIB Systems LLC</strong></p><h2>SAP Security, GRC and Fiori Practice: trainee user guide</h2><p>Version 1.0. Date: 26 November 2026.</p>
<h3>1. What this is</h3><p>A self-guided practice course that prepares Senior and Lead SAP Security, GRC and Fiori candidates for interviews and the first months in the role. It follows the 60-question TIB interview bank, in ${n} units across Weeks 0 to 8. You work alone, at your own pace, on any device.</p>
<h3>2. Signing in</h3><p>Use the email and password you were given. Your account must be enrolled by TIB. If you see "Not enrolled", contact TIB with the email you used. Your progress is saved to your account, so you can continue on another device.</p>
<h3>3. The five stages of a unit</h3><ol><li><b>Learn:</b> a short story, a flowchart, an animation, the model answer, and recall points. Where a unit has simulated screens there is also a See it in SAP page.</li><li><b>Simulate:</b> guided clicks on a simulated SAP screen. Follow the orange outline. The Show me button helps if you are stuck.</li><li><b>Analyse:</b> three short tasks on small data tables or choices.</li><li><b>Teach back:</b> explain the topic in your own words, then compare with the model answer and tick the points you covered.</li><li><b>Quiz:</b> four questions. You pass with all but one correct.</li></ol>
<p>Finish a unit to unlock the next one. Colours on the menu show whether a unit has simulated screens: blue none, green with screens.</p>
<h3>4. Senior and Lead</h3><p>Weeks 0 to 7 serve both Senior and Lead candidates. Week 8 is Lead only. Senior candidates may stop after Week 7.</p>
<h3>5. The Thornfield case</h3><p>Every unit uses the fictional company Thornfield Manufacturing, production client 300. The people are Aisha Hughes (AP clerk), Tara Olsen (IT administrator) and Priya Raman (risk manager). The SAP screens are a training simulation, not a live SAP system. The data is fictional.</p>
<h3>6. Telling your own stories</h3><p>The behavioural units (2.6, 4.7 and 8.9) contain illustrative stories. Replace them with your own real experience. Interviewers test real experience.</p>
<h3>7. Tips</h3><ul><li>Say your answers aloud in Teach back. Reading is not the same as saying.</li><li>Do one week at a time, then repeat the weak units.</li><li>The model answers serve three listeners: the recruiter, the hiring manager and the supervisor. Practise all three.</li><li>On a phone, turn the device sideways for the simulated screens.</li></ul>`;
DOCS.mgmt.t='Management report: design, strategy, methodology';
DOCS.mgmt.h=`<p><strong>TIB Systems LLC</strong></p><h2>Management report: SAP Security, GRC and Fiori Practice</h2><p>Version 1.0. Date: 26 November 2026. For instructors and administrators.</p>
<h3>1. Purpose</h3><p>Prepare Senior and Lead SAP Security, GRC and Fiori candidates in the USA, Canada, UK and Europe for interviews and early delivery. The app repeats the proven SAP Controls practice format with new content.</p>
<h3>2. How it was built</h3><ol><li>Market scan of about 55 postings (Senior and Lead roles) on major job sites, including Process Control, Risk Management and government roles.</li><li>A 60-question interview bank (about 60% Senior, 40% Lead), each with recruiter, hiring manager and supervisor variants, approved in six batches.</li><li>A 54-unit design covering all 60 questions exactly once, across nine weeks (0 to 8).</li><li>The app, built in seven batches, each reviewed before the next.</li></ol>
<h3>3. Current content</h3><table><tr><th>Item</th><th>Count</th></tr><tr><td>Units</td><td>${n}</td></tr><tr><td>Units with graphics (story, flowchart, animation)</td><td>${vz}</td></tr><tr><td>Units with simulated SAP screens</td><td>${sims.length} (${steps} guided clicks)</td></tr><tr><td>Analyse tasks</td><td>${labs}</td></tr><tr><td>Quiz questions</td><td>${qzs}</td></tr></table>
<h3>4. Design decisions</h3><ul><li>One bank and one app serve Senior and Lead. Week 8 is Lead only.</li><li>Fictional case company: Thornfield Manufacturing.</li><li>Simulated screens only. No live SAP access is needed.</li><li>Sign-in and enrolment use the TIB account pattern. Progress is stored in separate tables so it does not mix with other apps.</li></ul>
<h3>5. Known limits</h3><ul><li>Weeks 4 to 8 units have shorter simulations and analyse tasks than Weeks 1 to 3.</li><li>Simulated screens are teaching mock-ups, not exact SAP layouts. Government units are generic, not tied to one agency.</li><li>Behavioural stories are illustrations.</li><li>Quizzes are short (four questions per unit).</li></ul>
<h3>6. Suggested next steps</h3><ul><li>Pilot with a small group and review the stage completion data.</li><li>Deepen the units trainees find hardest.</li><li>Add a mock interview round using the bank.</li></ul>`;

function mkSes(j){return {access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,user:{id:j.user.id,email:String(j.user.email||'').toLowerCase()}}}

  hdr(false);$('#crumb').textContent='Sign in';
  const st='width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0 10px;box-sizing:border-box';
  app.innerHTML=`<h1>Sign in</h1><div class="card"><p>Use your TIB account: the same email and password as in the other TIB apps.</p><label>Email</label><input id="lgE" type="email" autocomplete="username" style="${st}"><label>Password</label><input id="lgP" type="password" autocomplete="current-password" style="${st}"><div class="row"><button class="btn" id="lgB">Sign in</button></div><p id="lgM" class="small" style="color:#b3261e;margin-top:8px">${esc(msg||'')}</p></div>`;
  const go_=async()=>{
    const e=$('#lgE').value.trim().toLowerCase(),p=$('#lgP').value;
    if(!e||!p){$('#lgM').textContent='Enter your email and password.';return}
    $('#lgB').disabled=true;$('#lgM').textContent='Signing in...';
    try{const j=await authReq('token?grant_type=password',{email:e,password:p});setSes(mkSes(j));await afterLogin()}
    catch(x){$('#lgB').disabled=false;$('#lgM').textContent=(/invalid/i.test(x.message)?'Email or password not correct.':x.message)}
  };
  $('#lgB').onclick=go_;$('#lgP').onkeydown=ev=>{if(ev.key==='Enter')go_()};
}
function notEnrolled(){
  hdr(false);const o=document.getElementById('outBtn');if(o)o.style.display='';
  $('#crumb').textContent='Not enrolled';
  app.innerHTML=`<h1>Not enrolled</h1><div class="card"><p>You are signed in as <b>${esc(SES.user.email)}</b>, but this account is not enrolled in the SAP Security, GRC and Fiori Practice course. Ask your TIB administrator to enrol this email address.</p><div class="row"><button class="btn" onclick="signOut()">Sign out</button></div></div>`;
}
async function afterLogin(){
  try{
    const en=await rest('sapsec_enrollments?select=role&email=eq.'+encodeURIComponent(SES.user.email));
    if(!en||!en.length){notEnrolled();return}
    ME=en[0];STAFF=(ME.role==='admin'||ME.role==='instructor');
    PKEY='tibsec:v1:'+SES.user.id;
    let L={};try{L=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){}
    P=L;
    const rm=await rest('sapsec_progress?select=state&user_id=eq.'+SES.user.id);
    if(rm&&rm[0]&&rm[0].state)P=mergeState(L,rm[0].state);
    try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}
    hdr(true);push();home();
  }catch(e){setSes(null);loginScreen('Could not load your account: '+e.message)}
}
function signOut(){clearTimeout(PT);if(SES&&ME&&PT===null){}setSes(null);ME=null;STAFF=false;P={};PKEY='tibsec:v1';loginScreen()}
async function dash(){
  if(!STAFF)return;
  $('#crumb').textContent='Instructor view';
  app.innerHTML='<h1>Trainee progress</h1><p class="mut">Loading...</p>';
  try{
    const [en,pr]=await Promise.all([rest('sapsec_enrollments?select=email,full_name,role&order=email'),rest('sapsec_progress?select=email,units_done,updated_at,state')]);
    const m={};pr.forEach(p=>m[p.email]=p);
    const cur=st=>{let k='-';UNITS.forEach(u=>{const s=st&&st[u.id];if(s&&(s.sim||Object.keys(s.lab||{}).length||Object.keys(s.tb||{}).length||s.quiz>=0))k=u.id});return k};
    const rows=en.map(e=>{const p=m[e.email];return `<tr><td>${esc(e.email)}</td><td>${esc(e.full_name||'')}</td><td>${esc(e.role)}</td><td>${p?p.units_done:0} / ${UNITS.length}</td><td>${p?cur(p.state):'-'}</td><td>${p?new Date(p.updated_at).toLocaleDateString():'Never'}</td></tr>`}).join('');
    app.innerHTML=`<h1>Trainee progress</h1><div class="card" style="overflow-x:auto"><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Units complete</th><th>Furthest unit</th><th>Last active</th></tr>${rows}</table><p class="small mut">Instructors and admins see every unit unlocked. To enrol someone, add their email to the enrolment list; they sign in with their TIB account.</p></div><div class="row"><button class="btn sec" onclick="go()">Back to units</button></div>`;
  }catch(e){app.innerHTML='<h1>Trainee progress</h1><p>Could not load: '+esc(e.message)+'</p>'}
}
async function boot(){
  hdr(false);
  let s=null;try{s=JSON.parse(localStorage.getItem('tibsec:auth')||'null')}catch(e){}
  if(!s){loginScreen();return}
  SES=s;
  try{await token();await afterLogin()}catch(e){setSes(null);loginScreen()}
}
boot();

</script></body></html>
