const DOCS={guide:{t:'Trainee user guide',staff:false,h:"<p><strong>TIB Systems LLC</strong></p>\n<p><strong>SAP Controls Practice: trainee user guide</strong></p>\n<p>How to sign in, use the app and run the program, day by day</p>\n<p>Version 1.1 (pilot build)</p>\n<p>Date: 26 November 2026</p>\n<p>App: https://tib-sap-controls-practice.vercel.app</p>\n<h1 id=\"welcome\">1. Welcome</h1>\n<p>This guide shows you how to sign in, how the practice app works, what you will learn, and how to plan your days and weeks. Read sections 2 to 5 before you start. Keep sections 8 and 9 open as your calendar and checklist.</p>\n<p>The app prepares you to answer 60 SAP controls interview questions with real substance. You do not need a SAP system. You practise on simulated SAP screens and on Excel data from a fictional company called Thornfield.</p>\n<h1 id=\"what-you-need\">2. What you need</h1>\n<ul>\n<li><p>A phone, tablet or computer with internet. A computer is best for the Excel work.</p></li>\n<li><p>Microsoft Excel or a free alternative that opens .xlsx files (Google Sheets or LibreOffice also work).</p></li>\n<li><p>Your TIB account: the same email and password you use in other TIB apps, and an invitation (enrolment) from TIB for this course.</p></li>\n<li><p>A notebook, and a quiet place to say your answers out loud.</p></li>\n</ul>\n<h1 id=\"signing-in\">3. Signing in</h1>\n<ol type=\"1\">\n<li><p>Open <strong>https://tib-sap-controls-practice.vercel.app</strong> in your browser.</p></li>\n<li><p>Type your TIB email address and your TIB password, then press <strong>Sign in</strong> (or press Enter).</p></li>\n<li><p>The menu with all your units appears. Your progress is loaded automatically.</p></li>\n</ol>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>What you see</strong></th>\n<th><strong>What it means</strong></th>\n<th><strong>What to do</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Email or password not correct</th>\n<th>The details do not match your TIB account.</th>\n<th>Check spelling. If you forgot your password, use the password reset in another TIB app, then return.</th>\n</tr>\n<tr class=\"header\">\n<th>Not enrolled</th>\n<th>Your sign-in works but your email has not been added to this course.</th>\n<th>Send your sign-in email to your TIB administrator and ask to be enrolled.</th>\n</tr>\n<tr class=\"odd\">\n<th>Could not load your account</th>\n<th>A temporary connection problem.</th>\n<th>Check your internet and sign in again.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>To leave, choose <strong>Sign out</strong> at the top right. On a shared computer always sign out. Your progress is saved to your account, so on a new phone or computer you sign in and carry on where you stopped.</p>\n<h1 id=\"the-menu-home-screen\">4. The menu (home screen)</h1>\n<p>The menu is one screen with no scrolling. Every unit is on it, so you can jump straight to a unit. The units are grouped in one column per week, Week 0 to Week 7. The app fills the whole browser window: only the content area changes, and the top bar stays in place.</p>\n<ul>\n<li><p><strong>Top bar:</strong> the app name, <strong>Job Readiness</strong> (back to the TIB hub), <strong>Menu</strong> (back to this screen), <strong>Guide</strong>, a small <strong>Saved</strong> note and <strong>Sign out</strong>. Instructors also see <strong>Instructor view</strong>.</p></li>\n<li><p><strong>Each unit tile</strong> shows the unit number in a circle, the full title with its interview questions, and a status: <strong>1/4</strong> (how many of the four graded parts you have done), a tick when the unit is complete, or a lock when it is not yet open.</p></li>\n<li><p>A unit unlocks when the previous one is complete. Start at Unit 0.1 and work down the list. Click a tile to open that unit.</p></li>\n<li><p>If the word <strong>Saved</strong> does not appear after you work, your connection may have dropped. The app retries on its own. Keep the page open until it says Saved.</p></li>\n</ul>\n<p>The colour of the number circle tells you how much of the unit is shown on real SAP screenshots:</p>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Colour</strong></th>\n<th><strong>Meaning</strong></th>\n<th><strong>Units</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Blue</th>\n<th>No SAP screenshots in this unit. You learn from the story, flowchart, animation and the simulated SAP screens.</th>\n<th>27 units</th>\n</tr>\n<tr class=\"header\">\n<th>Yellow</th>\n<th>Some SAP screenshots exist for this topic but are not yet in the unit.</th>\n<th>2.3, 3.1, 3.2, 3.3, 3.4</th>\n</tr>\n<tr class=\"odd\">\n<th>Green</th>\n<th>The unit has a \"See it in SAP\" screen with real SAP screenshots.</th>\n<th>0.1 to 0.4, 1.1 to 1.5, 2.1, 2.2, 3.5, 6.1</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>The <strong>Guide</strong> button opens this guide inside the app. On a phone the menu has two columns and scrolls.</p>\n<h1 id=\"how-a-unit-works-five-steps\">5. How a unit works: five steps</h1>\n<p>Every unit has the same five tabs across the top. Do them in order.</p>\n<h2 id=\"step-1-learn\">Step 1: Learn</h2>\n<p>Learn is a series of short screens, one at a time. The heading shows <strong>Screen N of M</strong> and its name, and a row of dots shows where you are. Use <strong>Back</strong> and <strong>Continue</strong> (top left) to move. This takes 10 to 20 minutes.</p>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Screen</strong></th>\n<th><strong>What you do</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Story</th>\n<th>Read a short conversation between the people in the case. It shows the situation in plain words.</th>\n</tr>\n<tr class=\"header\">\n<th>Flowchart</th>\n<th>See the whole process in one picture, from start to finish.</th>\n</tr>\n<tr class=\"odd\">\n<th>Animation</th>\n<th>Press <strong>Next step</strong> to build the process one step at a time. Use <strong>Previous step</strong> to go back and <strong>Replay</strong> to start again. When you reach the last step, <strong>Done</strong> lights up; press it to move on.</th>\n</tr>\n<tr class=\"header\">\n<th>Read</th>\n<th>The short written explanation and the box that says why interviewers ask. Take notes.</th>\n</tr>\n<tr class=\"odd\">\n<th>See it in SAP</th>\n<th>Only on the green units. Real SAP screenshots, frame by frame, with a red box on the part to look at. Use <strong>Next frame</strong>, <strong>Previous frame</strong>, <strong>Replay</strong>, <strong>Full screen</strong> (Esc closes it; arrow keys move between frames) and <strong>Done</strong> on the last frame.</th>\n</tr>\n<tr class=\"header\">\n<th>Recall</th>\n<th>Cover the screen and say the steps in your own words, using the list as a check.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>The picture screens (Story, Flowchart, Animation and See it in SAP) are sized to fit your screen, so you do not need to scroll. On these screens the button you should press next is the bold blue one with an orange glow; <strong>Continue</strong> is pale until you have finished the animation or frames. On the last Learn screen the button takes you to Step 2.</p>\n<p>The example numbers in the animations are made up to show the idea. The SAP screenshots come from the TIB SAP Lab Player and need an internet connection.</p>\n<h2 id=\"step-2-simulate\">Step 2: Simulate</h2>\n<p>You see a simulated SAP screen with a command field. The instruction at the top tells you what to do.</p>\n<ul>\n<li><p>If it says type a transaction code, type it in the command field and press Enter.</p></li>\n<li><p>If it says click, click the highlighted item.</p></li>\n<li><p>A wrong click shows a hint. <strong>Show me</strong> performs the step for you; use it if you are stuck, then repeat the simulation without help.</p></li>\n<li><p>Some units are about ideas and have no screens; they say so and you simply continue.</p></li>\n</ul>\n<p>The screens are a training simulation, not a real SAP system. The company, users and numbers are fictional.</p>\n<h2 id=\"step-3-analyse\">Step 3: Analyse</h2>\n<p>This is the main practical work.</p>\n<ol type=\"1\">\n<li><p>Download the Excel file or files shown on the page.</p></li>\n<li><p>Open them in Excel. Read the unit instructions to see which sheet and columns to use.</p></li>\n<li><p>Filter, sort, count, add, or calculate dates, then type each answer in its box and press Check.</p></li>\n<li><p>Read the feedback. A tick shows why the answer is right; a miss tells you to re-check your filter.</p></li>\n</ol>\n<p>Numbers can be typed with or without commas. Amounts are accepted to within one cent. Some questions need a name or a choice from a list. Every question must be answered correctly before this step counts as done, and you can retry as often as you like.</p>\n<table class=\"t\" class=\"t\">\n<tbody>\n<tr class=\"odd\">\n<td><strong>Tip.</strong> Keep each workbook and save your own working. Describing how you filtered the data is the best preparation for the interviewer who asks, \"How did you test that?\"</td>\n</tr>\n</tbody>\n</table>\n<h2 id=\"step-4-teach-back\">Step 4: Teach back</h2>\n<p>You are shown an interview question. Answer it in your own words as if explaining it to a colleague.</p>\n<ol type=\"1\">\n<li><p>Say your answer out loud first for about two minutes.</p></li>\n<li><p>Type the main points you made (at least a few sentences).</p></li>\n<li><p>Press to reveal the model answer. Compare it with yours.</p></li>\n<li><p>Tick each key point you covered. You need about 80 percent ticked to pass. If you miss points, note them, then go back to Learn and retry.</p></li>\n</ol>\n<p>The app does not store what you type, so be honest. This step is only valuable if you do it properly.</p>\n<h2 id=\"step-5-quiz\">Step 5: Quiz</h2>\n<p>Four multiple-choice questions. You need three correct. After each answer you see an explanation. If you do not pass, review the notes and retake the quiz.</p>\n<h2 id=\"finishing-a-unit\">Finishing a unit</h2>\n<p>A unit is complete when the simulation, every analysis task, every teach-back and the quiz are all done. The next unit then unlocks and you see <strong>Start unit</strong> on the last screen.</p>\n<h1 id=\"what-you-will-learn-the-scope\">6. What you will learn: the scope</h1>\n<p>The 60 questions are covered in two tracks. Follow the Senior track first. The Lead extension is for those aiming at a controls lead role.</p>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Week</strong></th>\n<th><strong>Theme</strong></th>\n<th><strong>What you practise</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>0</th>\n<th>SAP orientation</th>\n<th>Systems and clients, transaction codes, users and roles, reading tables with SE16N and Excel</th>\n</tr>\n<tr class=\"header\">\n<th>1</th>\n<th>ITGC foundations</th>\n<th>Three ITGC domains, privileged access, provisioning and leavers, transports, batch jobs, COSO, COBIT, the three lines</th>\n</tr>\n<tr class=\"odd\">\n<th>2</th>\n<th>Access risk and testing</th>\n<th>SoD analysis, firefighter access, access reviews, design versus operating effectiveness, workpapers, exceptions, sampling, report reliance</th>\n</tr>\n<tr class=\"header\">\n<th>3</th>\n<th>Application controls</th>\n<th>Invoice matching, configuration change logs, posting periods, duplicate invoices, interfaces, S/4HANA, Fiori, migration, database access</th>\n</tr>\n<tr class=\"odd\">\n<th>4</th>\n<th>Third parties, cloud, AI</th>\n<th>SOC 1 reports, CUECs, bridge letters, carve-outs, RISE with SAP, safe use of AI, continuous monitoring</th>\n</tr>\n<tr class=\"header\">\n<th>5</th>\n<th>Communication and mock interview</th>\n<th>Your story, explaining findings to a CFO, auditor disagreement, deadlines, your questions, mock interview, capstone briefing</th>\n</tr>\n<tr class=\"odd\">\n<th>6 (Lead)</th>\n<th>Leading remediation and scope</th>\n<th>SoD programmes, top-down scoping, deficiency classification, S/4HANA project controls, AI reliance</th>\n</tr>\n<tr class=\"header\">\n<th>7 (Lead)</th>\n<th>Leading the engagement</th>\n<th>First two weeks, control matrix, weekly reporting, reviewing juniors, remediation closure, new engagement scoping, mock interview, capstone</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>In total there are 45 units, about 136 hours: Weeks 0 to 5 about 97.5 hours, Weeks 6 and 7 about 39 hours.</p>\n<h1 id=\"how-the-training-runs\">7. How the training runs</h1>\n<ul>\n<li><p><strong>Self-paced.</strong> No class is needed. Your instructor can see your progress and may contact you.</p></li>\n<li><p><strong>Recommended pace.</strong> About 4 hours a day, five days a week. Each content week then fits a calendar week. If you can give only 2 hours a day, allow double the time.</p></li>\n<li><p><strong>Daily rhythm.</strong> Sessions of 90 minutes with a short break. Do Learn and Simulate first, Analyse next, and finish with Teach back and Quiz while the material is fresh.</p></li>\n<li><p><strong>Repeat the weak ones.</strong> Each Friday, redo any unit where you needed Show me or scored 3 of 4.</p></li>\n<li><p><strong>Before an interview.</strong> Redo the mock interview units (5.4 and, for Lead, 7.7) aloud, with a timer.</p></li>\n</ul>\n<h1 id=\"day-by-day-week-by-week\">8. Day by day, week by week</h1>\n<p>Hours are the estimated working time per unit. Use the Friday or last slot to catch up.</p>\n<h2 id=\"week-0-sap-orientation-2-days-9-hours\">Week 0: SAP orientation (2 days, 9 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>0.1 Where SAP lives; 0.2 Transaction codes</th>\n<th>4.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>0.3 Users and roles; 0.4 SE16N and Excel</th>\n<th>5.0</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-1-itgc-foundations-5-days-18.5-hours\">Week 1: ITGC foundations (5 days, 18.5 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>1.1 The three ITGC domains; 1.2 Privileged access (SAP_ALL)</th>\n<th>5.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>1.3 User provisioning and leavers</th>\n<th>3.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>1.4 Change management and transports</th>\n<th>3.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>1.5 Batch jobs and interfaces</th>\n<th>3.0</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>1.6 SOX, COSO, COBIT, three lines</th>\n<th>3.0</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-2-access-risk-and-testing-approach-5-days-19.5-hours\">Week 2: Access risk and testing approach (5 days, 19.5 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>2.1 SoD and access risk</th>\n<th>3.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>2.2 Firefighter access; 2.5 Exceptions and pushback</th>\n<th>5.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>2.3 Mitigating controls and access reviews</th>\n<th>3.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>2.4 Design versus operating effectiveness; the workpaper</th>\n<th>3.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>2.6 Sampling and report reliance</th>\n<th>3.5</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-3-application-controls-s4hana-project-lifecycle-5-days-19-hours\">Week 3: Application controls, S/4HANA, project lifecycle (5 days, 19 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>3.1 Application controls and the three-way match</th>\n<th>3.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>3.2 Configuration changes and posting periods</th>\n<th>3.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>3.3 Duplicate invoices; 3.5 S/4HANA and Fiori</th>\n<th>5.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>3.4 Interface controls and design documents</th>\n<th>3.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>3.6 Migration and database access</th>\n<th>3.0</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-4-third-parties-cloud-and-ai-4-days-plus-catch-up-15-hours\">Week 4: Third parties, cloud and AI (4 days plus catch-up, 15 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>4.1 Reading a SOC 1 report</th>\n<th>4.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>4.2 RISE with SAP; 4.3 Bridge letters and carve-outs</th>\n<th>5.0</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>4.4 Using AI safely</th>\n<th>3.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>4.5 Continuous monitoring</th>\n<th>2.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>Catch-up and redo weak units</th>\n<th>flexible</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-5-communication-mock-interview-capstone-4-days-plus-catch-up-16.5-hours\">Week 5: Communication, mock interview, capstone (4 days plus catch-up, 16.5 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>5.1 Your story, your gap, your questions</th>\n<th>3.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>5.2 Explaining a finding to a CFO; 5.3 Auditor disagreement and deadlines</th>\n<th>5.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>5.4 Mock interview: core questions</th>\n<th>4.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>5.5 Capstone: the Thornfield briefing</th>\n<th>4.0</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>Catch-up; repeat weak units. Senior track complete.</th>\n<th>flexible</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>Weeks 0 to 5 complete the Senior track.</p>\n<h2 id=\"week-6-lead-remediation-scoping-deficiencies-s4hana-ai-5-days-14.5-hours\">Week 6 (Lead): Remediation, scoping, deficiencies, S/4HANA, AI (5 days, 14.5 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>6.1 SoD remediation programme</th>\n<th>3.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>6.2 Top-down scoping</th>\n<th>2.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>6.3 Classifying deficiencies</th>\n<th>3.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>6.4 Controls across an S/4HANA project</th>\n<th>2.5</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>6.5 AI reliance and controls over a GenAI tool</th>\n<th>3.5</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h2 id=\"week-7-lead-leading-the-engagement-5-days-24.5-hours\">Week 7 (Lead): Leading the engagement (5 days, 24.5 hours)</h2>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Day</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Approx. hours</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Day 1</th>\n<th>7.1 First two weeks; 7.2 Control matrix</th>\n<th>6.0</th>\n</tr>\n<tr class=\"header\">\n<th>Day 2</th>\n<th>7.3 Weekly reporting; 7.4 Reviewing a junior</th>\n<th>5.0</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 3</th>\n<th>7.5 Remediation to closure; 7.6 Scoping a new engagement</th>\n<th>5.5</th>\n</tr>\n<tr class=\"header\">\n<th>Day 4</th>\n<th>7.7 Mock interview: Lead questions</th>\n<th>4.0</th>\n</tr>\n<tr class=\"odd\">\n<th>Day 5</th>\n<th>7.8 Capstone: take over a late engagement</th>\n<th>4.0</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"checklist-and-tips\">9. Checklist and tips</h1>\n<h2 id=\"at-the-start-of-each-day\">At the start of each day</h2>\n<ul>\n<li><p>Sign in and look for <strong>Saved</strong>.</p></li>\n<li><p>Open the next unlocked unit. Read the unit time and plan your breaks.</p></li>\n</ul>\n<h2 id=\"at-the-end-of-each-day\">At the end of each day</h2>\n<ul>\n<li><p>Check the badge shows <strong>Complete</strong> or note which parts are left.</p></li>\n<li><p>Write three lines in your notebook: what I learned, what I found hard, one example I can use in an interview.</p></li>\n</ul>\n<h2 id=\"tips\">Tips</h2>\n<ul>\n<li><p>Do not skip Analyse or Teach back. They are where the learning happens, and the interview questions test them.</p></li>\n<li><p>Use real numbers in your answers: \"five users had SAP_ALL, two of them in the finance team\" is stronger than \"some users had broad access\".</p></li>\n<li><p>Treat the SAP screens as practice for finding where to look. Real SAP screens will look a little different. On the green units, study the real screenshots first, then do the simulation.</p></li>\n<li><p>Use the menu colours to plan: green units are the best place to see real SAP, so do them carefully.</p></li>\n<li><p>Never share your password. Do not paste your own employer's data into the exercises or into any AI chat.</p></li>\n</ul>\n<h1 id=\"frequently-asked-questions\">10. Frequently asked questions</h1>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Question</strong></th>\n<th><strong>Answer</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Can I jump ahead?</th>\n<th>No. Units unlock in order so that each builds on the last.</th>\n</tr>\n<tr class=\"header\">\n<th>I got an analysis answer wrong. Can I try again?</th>\n<th>Yes, as often as you like. Read the feedback and check your filters.</th>\n</tr>\n<tr class=\"odd\">\n<th>Is my progress safe if I close the browser?</th>\n<th>Yes. It is saved to your account when you see Saved.</th>\n</tr>\n<tr class=\"header\">\n<th>Can I use my phone?</th>\n<th>Yes for reading, simulation and quizzes. Use a computer for Excel work.</th>\n</tr>\n<tr class=\"odd\">\n<th>Will I be graded?</th>\n<th>There is no certificate in this version. The app records which units you have completed; your instructor can see this.</th>\n</tr>\n<tr class=\"header\">\n<th>Is this a real SAP system?</th>\n<th>No. It is a simulation with fictional Thornfield data.</th>\n</tr>\n<tr class=\"odd\">\n<th>A screen looks different from the SAP I know.</th>\n<th>The simulation is simplified. Use it to learn the logic and where to look, and tell your instructor what differs.</th>\n</tr>\n<tr class=\"header\">\n<th>Who do I contact?</th>\n<th>Your TIB instructor or administrator.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"for-instructors-and-administrators\">11. For instructors and administrators</h1>\n<p>Instructors and administrators sign in the same way. They see every unit unlocked and an <strong>Instructor view</strong> button at the top. That page lists every enrolled person with units complete, the furthest unit reached and the date last active. Enrolling a trainee means adding their sign-in email to the course enrolment list; the trainee then signs in with their existing TIB account.</p>\n"},mgmt:{t:'Management report: design, strategy, methodology',staff:true,h:"<p><strong>TIB Systems LLC</strong></p>\n<p><strong>SAP Controls Practice: design, strategy and outcomes</strong></p>\n<p>Management report</p>\n<p>Version 1.1 (pilot build)</p>\n<p>Date: 26 November 2026</p>\n<p>App: https://tib-sap-controls-practice.vercel.app</p>\n<h1 id=\"executive-summary\">1. Executive summary</h1>\n<p>TIB has built a self-guided practice application that prepares people with little SAP experience to answer the 60 questions in the TIB SAP Controls interview bank, at Senior level and at Lead level. Trainees have no access to a real SAP system, so the application supplies simulated SAP screens with guided clicks and fictional Thornfield data extracts to analyse in Excel.</p>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Measure</strong></th>\n<th><strong>Pilot build</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Interview questions covered</th>\n<th>60 of 60 (Senior Q1 to 48, Lead Q49 to 60)</th>\n</tr>\n<tr class=\"header\">\n<th>Learning units</th>\n<th>45, in 8 content weeks (Week 0 to Week 7)</th>\n</tr>\n<tr class=\"odd\">\n<th>Estimated study time</th>\n<th>136.5 hours: Senior 97.5, Lead extension 39</th>\n</tr>\n<tr class=\"header\">\n<th>Simulated SAP screen steps</th>\n<th>116 guided steps across 26 units</th>\n</tr>\n<tr class=\"odd\">\n<th>Excel data extracts</th>\n<th>31 workbooks, each with planted exceptions</th>\n</tr>\n<tr class=\"header\">\n<th>Data analysis tasks</th>\n<th>296, each with a checked answer</th>\n</tr>\n<tr class=\"odd\">\n<th>Teach-back exercises</th>\n<th>74 (every one of the 60 questions at least once)</th>\n</tr>\n<tr class=\"header\">\n<th>Quiz questions</th>\n<th>180 (4 per unit, pass mark 3 of 4)</th>\n</tr>\n<tr class=\"odd\">\n<th>Access and tracking</th>\n<th>TIB shared sign-in; progress saved per trainee; instructor view</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Status.</strong> The pilot build is complete and live. Sign-in, enrolment and progress saving are connected to the shared TIB Supabase project, and the admin and one instructor are enrolled. It has been tested with automated checks and a simulated browser; it has not yet been used by a real trainee cohort.</p>\n<p><strong>Update, 26 November 2026.</strong> Since version 1.0 the application has gained a picture layer on all 45 units (character story, flowchart, step-by-step animation, recall list), a \"See it in SAP\" screen with real SAP screenshots on 13 units, a one-screen colour-coded menu, and a layout that fits the screen without scrolling. These changes are live, and the menu and picture-screen layout changes are covered in section 3.2.</p>\n<p><strong>Recommendation.</strong> Run a pilot with three to five trainees, have a subject matter expert verify the SAP screen details listed in section 8, and then decide on certification, an administration screen and pricing (section 9).</p>\n<h1 id=\"the-problem-and-the-objective\">2. The problem and the objective</h1>\n<p>TIB trainees are typically junior to mid-level consultants with limited practical SAP experience who struggle to learn alone. Interview preparation from a question list alone produces recited answers that collapse under follow-up questions. A live SAP system would solve this, but it is expensive, risky to give to every trainee, and unavailable to most.</p>\n<p><strong>Objective.</strong> After the training, a trainee can answer each of the 60 questions in their own words, with a concrete example from work they have actually done in the application, and can carry out the underlying analysis on a data extract.</p>\n<h1 id=\"application-design\">3. Application design</h1>\n<h2 id=\"what-the-trainee-sees\">3.1 What the trainee sees</h2>\n<p>Every unit follows the same five steps, so trainees always know what to do next:</p>\n<ul>\n<li><p><strong>Learn.</strong> A short explanation of the concept and why interviewers ask about it.</p></li>\n<li><p><strong>Simulate.</strong> A simulated SAP screen. The trainee types the transaction code or clicks the highlighted field; a wrong click gives a hint, and a Show me button demonstrates the step.</p></li>\n<li><p><strong>Analyse.</strong> The trainee downloads an Excel extract of fictional Thornfield data and answers questions that need filtering, counting, summing or dates. Answers are checked, with a reason shown.</p></li>\n<li><p><strong>Teach back.</strong> The trainee types an explanation of the interview question, reveals the model answer, and ticks the key points they covered.</p></li>\n<li><p><strong>Quiz.</strong> Four multiple-choice questions, pass mark three.</p></li>\n</ul>\n<h2 id=\"pictures-sap-screenshots-and-screen-layout-added-26-november-2026\">3.2 Pictures, SAP screenshots and screen layout (added 26 November 2026)</h2>\n<ul>\n<li><p><strong>Learn is a series of single screens.</strong> Each unit's Learn step is a pager of up to six screens: Story (a short conversation between the case characters), Flowchart, Animation (the process built one step at a time), Read (the written explanation and why interviewers ask), See it in SAP (where available) and Recall (cover the screen and retell). Across the 45 units this is 238 screens. The first and last buttons follow the trainee through to the Simulate step.</p></li>\n<li><p><strong>See it in SAP.</strong> Thirteen units (0.1 to 0.4, 1.1 to 1.5, 2.1, 2.2, 3.5 and 6.1) show 70 real SAP screenshots, frame by frame, with a red box on the part to look at and a full-screen view. The screenshots come from the TIB SAP Lab Player and are cleared for reuse. Frames the source flagged as wrong or unconfirmed were left out or reworded, and unconfirmed user counts were removed from captions.</p></li>\n<li><p><strong>Coverage and menu colours.</strong> The menu number is blue where a unit has no SAP screenshots (27 units), yellow where some exist in the Lab Player but are not yet used (5 units: 2.3 and 3.1 to 3.4), and green where the unit has the See it in SAP screen (13 units).</p></li>\n<li><p><strong>One-screen menu.</strong> All 45 units sit on one screen in eight week columns, so a trainee can jump to a unit without scrolling. The application fills the whole browser window, with a fixed top bar.</p></li>\n<li><p><strong>Fit to screen and clear primary action.</strong> The Story, Flowchart, Animation and See it in SAP screens are sized to the available screen so no scrolling is needed. The expected action (Next step, Next frame, then Done) is the bold highlighted button, and Continue is pale until the animation or frames are finished. Next, Previous and Done are disabled at the ends.</p></li>\n</ul>\n<h2 id=\"how-it-is-built\">3.3 How it is built</h2>\n<ul>\n<li><p>A single web page with no server code of its own, hosted on Vercel from a GitHub repository. Every push to the repository redeploys it.</p></li>\n<li><p>Content is data-driven: each unit is a record holding its learning text, simulation steps, analysis tasks, teach-backs and quiz. Adding a unit means adding a record, not rebuilding the app.</p></li>\n<li><p>Sign-in uses the shared TIB email and password (Supabase Auth). Two new tables, enrolments and progress, sit in the existing TIB-training-lms project. Row-level security means a trainee can see only their own progress; instructors and admins see everyone.</p></li>\n<li><p>The application makes no calls to an AI service while running. There is no per-use running cost beyond existing hosting and database.</p></li>\n<li><p>Mobile-first layout with phone (about 600 px) and tablet (about 880 px) breakpoints. The menu and picture screens fit the screen on desktop and tablet; on a phone the menu has two columns and scrolls.</p></li>\n</ul>\n<h2 id=\"control-of-progress\">3.4 Control of progress</h2>\n<p>Units unlock in order. A unit is complete only when its simulation, all analysis tasks, all teach-backs and the quiz are done. Instructors and admins see all units unlocked so they can review content. Progress is saved to the trainee account after each action and also cached in the browser, so a trainee can switch device.</p>\n<h1 id=\"strategy\">4. Strategy</h1>\n<ul>\n<li><p><strong>Anchor on the questions.</strong> The curriculum is built backwards from the 60 questions: each question is taught in the unit that supplies its evidence, then rehearsed as a teach-back. There is no content that does not serve a question.</p></li>\n<li><p><strong>Replace system access with simulation and data.</strong> Simulated screens teach navigation and where to look; Excel extracts teach analysis, which is the real work of a controls tester.</p></li>\n<li><p><strong>One case company.</strong> Thornfield recurs throughout, so findings connect: a widened invoice tolerance in Week 3 explains unblocked invoices; Week 3 and Week 4 exposures are added together in the Week 5 capstone. This builds the habit of connecting findings, which interviewers reward.</p></li>\n<li><p><strong>Two tracks.</strong> Senior (Weeks 0 to 5) covers Q1 to 48. Lead (Weeks 6 and 7) adds Q49 to 60 and assumes the Senior content.</p></li>\n<li><p><strong>Planted exceptions.</strong> Every extract contains deliberate exceptions, and every answer is calculated from the same data by script, so answers cannot disagree with the files.</p></li>\n</ul>\n<h1 id=\"methodology\">5. Methodology</h1>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Principle</strong></th>\n<th><strong>How the application applies it</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>Do first, then explain</th>\n<th>Trainees perform the step or analysis before reading the model answer.</th>\n</tr>\n<tr class=\"header\">\n<th>Retrieval practice</th>\n<th>Teach-back and quizzes require the trainee to produce the answer from memory.</th>\n</tr>\n<tr class=\"odd\">\n<th>Immediate feedback</th>\n<th>Wrong clicks get a hint; every analysis answer shows the reason; quizzes explain each answer.</th>\n</tr>\n<tr class=\"header\">\n<th>Mastery gating</th>\n<th>The next unit unlocks only when the current one is complete, preventing skipping.</th>\n</tr>\n<tr class=\"odd\">\n<th>Worked reasoning, not recitation</th>\n<th>Model answers are shown only after the trainee has written their own, with key points to tick against.</th>\n</tr>\n<tr class=\"header\">\n<th>Realistic communication practice</th>\n<th>Week 5 and Week 7 include mock interviews and a capstone briefing for an executive or sponsor.</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p><strong>Quality checks performed.</strong> Every unit was checked automatically: every simulation target exists, every answer index is valid, every data file is present, and every teach-back has its model answer. A simulated browser stepped through each unit. All 31 extracts and all 296 answers are generated by script and cross-checked.</p>\n<h1 id=\"curriculum-coverage\">6. Curriculum coverage</h1>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Week</strong></th>\n<th><strong>Theme</strong></th>\n<th><strong>Units</strong></th>\n<th><strong>Hours</strong></th>\n<th><strong>Questions</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>0</th>\n<th>SAP orientation</th>\n<th>4</th>\n<th>9.0</th>\n<th>Foundations (no interview questions)</th>\n</tr>\n<tr class=\"header\">\n<th>1</th>\n<th>ITGC foundations and audit frameworks</th>\n<th>6</th>\n<th>18.5</th>\n<th>Q1, 2, 3, 12, 13, 14, 27, 28, 29, 39</th>\n</tr>\n<tr class=\"odd\">\n<th>2</th>\n<th>Access risk, SoD and testing approach</th>\n<th>6</th>\n<th>19.5</th>\n<th>Q4 to 9, 30 to 34</th>\n</tr>\n<tr class=\"header\">\n<th>3</th>\n<th>Application controls, S/4HANA and project lifecycle</th>\n<th>6</th>\n<th>19.0</th>\n<th>Q10, 11, 15, 16, 35 to 38, 40 to 42</th>\n</tr>\n<tr class=\"odd\">\n<th>4</th>\n<th>Third parties, SOC 1, cloud and AI</th>\n<th>5</th>\n<th>15.0</th>\n<th>Q17 to 20, 43 to 48</th>\n</tr>\n<tr class=\"header\">\n<th>5</th>\n<th>Stakeholders, mock interview and capstone</th>\n<th>5</th>\n<th>16.5</th>\n<th>Q21 to 26</th>\n</tr>\n<tr class=\"odd\">\n<th>6</th>\n<th>Lead: remediation, scoping, deficiencies, S/4HANA, AI</th>\n<th>5</th>\n<th>14.5</th>\n<th>Q49 to 54</th>\n</tr>\n<tr class=\"header\">\n<th>7</th>\n<th>Lead: leading the engagement, mock interview, capstone</th>\n<th>8</th>\n<th>24.5</th>\n<th>Q55 to 60</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<p>Suggested pace: about 4 hours a day for five days a week completes the Senior track in six calendar weeks and the Lead extension in two more. At 2 hours a day the same content takes about twice as long.</p>\n<h1 id=\"what-the-trainee-will-be-able-to-do\">7. What the trainee will be able to do</h1>\n<h2 id=\"after-the-senior-track-weeks-0-to-5\">After the Senior track (Weeks 0 to 5)</h2>\n<ul>\n<li><p>Explain the SAP landscape (development, quality, production, clients), navigate by transaction code, and read user, role, table, batch job and transport data.</p></li>\n<li><p>Test the three ITGC domains: user provisioning and leavers, privileged access, change management and transports, and batch and interface operations. Explain COSO, COBIT and the three lines.</p></li>\n<li><p>Perform segregation of duties and access risk analysis, review emergency access, test user access reviews, distinguish design from operating effectiveness, choose and defend a sample, handle exceptions and control-owner pushback, and judge reliance on system reports.</p></li>\n<li><p>Test automated and application controls: invoice matching, configuration change logs, posting periods, duplicate invoices, interface reconciliation. Explain S/4HANA, Fiori access, data migration and database-level access.</p></li>\n<li><p>Assess third parties: SOC 1 Type I and II, complementary user entity controls, exceptions, bridge letters, carve-outs, and who controls what under RISE with SAP.</p></li>\n<li><p>Use AI safely in testing (masking client data, verifying output) and describe continuous controls monitoring.</p></li>\n<li><p>Give a clear two-minute story, explain a finding to a CFO, handle an auditor disagreement and deadline pressure, and ask strong questions of the interviewer.</p></li>\n</ul>\n<h2 id=\"after-the-lead-extension-weeks-6-and-7\">After the Lead extension (Weeks 6 and 7)</h2>\n<ul>\n<li><p>Lead an SoD remediation programme by role rather than by user; scope an engagement top-down; classify and aggregate deficiencies; embed controls across an S/4HANA project; set conditions for relying on AI-assisted work and control a client GenAI tool.</p></li>\n<li><p>Take over a late engagement: check the tracker against evidence, run a RAID log, build and maintain the control matrix, report weekly on one page, review a junior tester, drive remediation to retest dates, and scope a new engagement.</p></li>\n</ul>\n<table class=\"t\" class=\"t\">\n<tbody>\n<tr class=\"odd\">\n<td><strong>What this does not claim.</strong> The training does not make a trainee a SAP-experienced consultant. It prepares them to answer interview questions with substance and to perform the analysis from extracts. Hands-on experience in a live system remains valuable and is not replaced.</td>\n</tr>\n</tbody>\n</table>\n<h1 id=\"limitations-and-items-to-verify\">8. Limitations and items to verify</h1>\n<table class=\"t\" class=\"t\">\n<thead>\n<tr class=\"header\">\n<th><strong>Area</strong></th>\n<th><strong>Limitation</strong></th>\n<th><strong>Action</strong></th>\n</tr>\n<tr class=\"odd\">\n<th>SAP screen fidelity</th>\n<th>Screens are teaching approximations. Names and paths to verify against a real system: user-lock flag values, the SUIM report path, FK03 vendor display, FAGLB03, change-document paths, GRC functions in the launchpad, tables T169G and T001B, OMR6, MRBR, WE02 statuses 51 and 53, HANA cockpit layout.</th>\n<th>Subject matter expert review before commercial use</th>\n</tr>\n<tr class=\"header\">\n<th>Teach-back marking</th>\n<th>Self-assessed against key points. Typed answers are not stored or graded, so staff see completion only, not the quality of answers.</th>\n<th>Consider AI or instructor grading later (policy decision on API use)</th>\n</tr>\n<tr class=\"odd\">\n<th>No certification</th>\n<th>Quiz pass (3 of 4) is a learning aid, not a validated assessment.</th>\n<th>Decide whether to add a proctored or instructor-marked final</th>\n</tr>\n<tr class=\"header\">\n<th>Thresholds</th>\n<th>Some exercise rules are illustrative (RAG rules, 120-day long gap, deficiency thresholds of 5,000,000 materiality and 25 percent). They are stated inside each exercise.</th>\n<th>Align with TIB methodology</th>\n</tr>\n<tr class=\"odd\">\n<th>Operations</th>\n<th>Enrolment is added by staff in the database. There is no forgot-password button in the app. Needs internet to sign in. Not tested on real phones or across browsers.</th>\n<th>Add an admin enrolment screen; device test during the pilot</th>\n</tr>\n<tr class=\"header\">\n<th>Content</th>\n<th>The 60 model answers come from the TIB question bank, and the units were drafted from them.</th>\n<th>Instructor read-through of all 45 units</th>\n</tr>\n<tr class=\"odd\">\n<th>SAP screenshots</th>\n<th>Shown on 13 of 45 units. They load from the TIB SAP Lab Player site, so the panel needs that site online and its image paths unchanged. A few source frames were flagged wrong or unconfirmed and were left out or reworded. Example numbers in the animations are invented and labelled as such.</th>\n<th>Subject matter expert review of the frames; consider hosting copies of the images with the app</th>\n</tr>\n<tr class=\"header\">\n<th>Screen layout</th>\n<th>The menu and picture screens were measured in a desktop browser at three window sizes; they have not been checked on real phones or tablets. On a phone the menu scrolls.</th>\n<th>Device test during the pilot</th>\n</tr>\n</thead>\n<tbody>\n</tbody>\n</table>\n<h1 id=\"decisions-and-next-steps\">9. Decisions and next steps</h1>\n<ol type=\"1\">\n<li><p>Approve a pilot cohort of three to five trainees and name an owner to review their feedback after Week 2.</p></li>\n<li><p>Assign a subject matter expert to verify the SAP screen items in section 8.</p></li>\n<li><p>Decide on certification: none, instructor-marked final, or a timed exam using the existing exam tools.</p></li>\n<li><p>Approve building an admin enrolment screen and a forgot-password path.</p></li>\n<li><p>Decide where the application sits in the TIB offer (for example, as a link from the Job Readiness hub) and whether it is sold alone or bundled.</p></li>\n<li><p>Optional later phases: richer analytics (first-attempt quiz pass rates, time per unit) and AI-graded teach-backs.</p></li>\n<li><p>Add See it in SAP screens for the five yellow units (2.3 and 3.1 to 3.4) and decide whether to extend screenshots to the other 27 units.</p></li>\n<li><p>Test unit 1.3 and a phone before the pilot, and decide whether Read should come before the Animation.</p></li>\n</ol>\n<h1 id=\"appendix-a.-data-and-privacy\">Appendix A. Data and privacy</h1>\n<ul>\n<li><p>All company, user and transaction data is fictional (Thornfield). No client data is used.</p></li>\n<li><p>Stored about each trainee: email, name, role, and progress flags per unit. Typed answers are not stored.</p></li>\n<li><p>Access control is enforced in the database (row-level security), not only in the page.</p></li>\n</ul>\n"}};

const SB_URL='https://blfgwysgekfqhcafofhe.supabase.co',SB_KEY='sb_publishable_ThLetpd4hj49fjce-kXoFA_v4ghwIqV';

function setSes(s){SES=s;try{if(s)localStorage.setItem('tibsec:auth',JSON.stringify(s));else localStorage.removeItem('tibsec:auth')}catch(e){}}
async function authReq(path,body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
  return j;
}
function mkSes(j){return {access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,user:{id:j.user.id,email:String(j.user.email||'').toLowerCase()}}}
async function token(){
  if(!SES)throw new Error('Not signed in');
  if(Date.now()>SES.exp){const j=await authReq('token?grant_type=refresh_token',{refresh_token:SES.refresh_token});setSes(mkSes(j))}
  return SES.access_token;
}
async function rest(path,opt){
  const t=await token();
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  if(!r.ok)throw new Error('Request failed ('+r.status+')');
  const x=await r.text();return x?JSON.parse(x):null;
}
function mergeState(a,b){
  const r={};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(id=>{
    const x=a[id],y=b[id];
    if(!x)r[id]=y;else if(!y)r[id]=x;
    else r[id]={sim:(x.sim||y.sim)?1:0,lab:Object.assign({},y.lab,x.lab),tb:Object.assign({},y.tb,x.tb),quiz:Math.max(x.quiz,y.quiz)};
  });
  return r;
}

    const e=$('#lgE').value.trim().toLowerCase(),p=$('#lgP').value;
    if(!e||!p){$('#lgM').textContent='Enter your email and password.';return}
    $('#lgB').disabled=true;$('#lgM').textContent='Signing in...';
    try{const j=await authReq('token?grant_type=password',{email:e,password:p});setSes(mkSes(j));await afterLogin()}
    catch(x){$('#lgB').disabled=false;$('#lgM').textContent=(/invalid/i.test(x.message)?'Email or password not correct.':x.message)}
  };
  $('#lgB').onclick=go_;$('#lgP').onkeydown=ev=>{if(ev.key==='Enter')go_()};
}
function notEnrolled(){
  hdr(false);const o=document.getElementById('outBtn');if(o)o.style.display='';
  $('#crumb').textContent='Not enrolled';
  app.innerHTML=`<h1>Not enrolled</h1><div class="card"><p>You are signed in as <b>${esc(SES.user.email)}</b>, but this account is not enrolled in the SAP Security, GRC and Fiori Practice course. Ask your TIB administrator to enrol this email address.</p><div class="row"><button class="btn" onclick="signOut()">Sign out</button></div></div>`;
}
async function afterLogin(){
  try{
    const en=await rest('sapsec_enrollments?select=role&email=eq.'+encodeURIComponent(SES.user.email));
    if(!en||!en.length){notEnrolled();return}
    ME=en[0];STAFF=(ME.role==='admin'||ME.role==='instructor');
    PKEY='tibsec:v1:'+SES.user.id;
    let L={};try{L=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){}
    P=L;
    const rm=await rest('sapsec_progress?select=state&user_id=eq.'+SES.user.id);
    if(rm&&rm[0]&&rm[0].state)P=mergeState(L,rm[0].state);
    try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}
    hdr(true);push();home();
  }catch(e){setSes(null);loginScreen('Could not load your account: '+e.message)}
}
function signOut(){clearTimeout(PT);if(SES&&ME&&PT===null){}setSes(null);ME=null;STAFF=false;P={};PKEY='tibsec:v1';loginScreen()}
async function dash(){
  if(!STAFF)return;
  $('#crumb').textContent='Instructor view';
  app.innerHTML='<h1>Trainee progress</h1><p class="mut">Loading...</p>';
  try{
    const [en,pr]=await Promise.all([rest('sapsec_enrollments?select=email,full_name,role&order=email'),rest('sapsec_progress?select=email,units_done,updated_at,state')]);
    const m={};pr.forEach(p=>m[p.email]=p);
    const cur=st=>{let k='-';UNITS.forEach(u=>{const s=st&&st[u.id];if(s&&(s.sim||Object.keys(s.lab||{}).length||Object.keys(s.tb||{}).length||s.quiz>=0))k=u.id});return k};
    const rows=en.map(e=>{const p=m[e.email];return `<tr><td>${esc(e.email)}</td><td>${esc(e.full_name||'')}</td><td>${esc(e.role)}</td><td>${p?p.units_done:0} / ${UNITS.length}</td><td>${p?cur(p.state):'-'}</td><td>${p?new Date(p.updated_at).toLocaleDateString():'Never'}</td></tr>`}).join('');
    app.innerHTML=`<h1>Trainee progress</h1><div class="card" style="overflow-x:auto"><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Units complete</th><th>Furthest unit</th><th>Last active</th></tr>${rows}</table><p class="small mut">Instructors and admins see every unit unlocked. To enrol someone, add their email to the enrolment list; they sign in with their TIB account.</p></div><div class="row"><button class="btn sec" onclick="go()">Back to units</button></div>`;
  }catch(e){app.innerHTML='<h1>Trainee progress</h1><p>Could not load: '+esc(e.message)+'</p>'}
}
async function boot(){
  hdr(false);
  let s=null;try{s=JSON.parse(localStorage.getItem('tibsec:auth')||'null')}catch(e){}
  if(!s){loginScreen();return}
  SES=s;
  try{await token();await afterLogin()}catch(e){setSes(null);loginScreen()}
}
boot();

</script></body></html>
