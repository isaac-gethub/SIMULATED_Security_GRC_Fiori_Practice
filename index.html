FN('2.4',['<b>Copy delivered:</b> never edit the delivered rule set. Copy it so upgrades do not overwrite your work.','<b>Tune permissions:</b> remove false positives by making rules specific.','<b>Add custom risks:</b> cover how this company really works.','<b>Generate and test:</b> rebuild the rules and rerun analysis to see the effect.'],
['A review finds a risk the delivered rules miss: maintaining bank data and releasing payments.','Define the functions that describe it.','Create the custom risk, for example Z001, and set its level.','Generate the rules and test before use.']);
FN('2.5',['<b>TSTC:</b> the table of transaction codes. List the Z and Y codes.','<b>Used? who:</b> check usage data to see which custom codes matter.','<b>Add to function:</b> add the action with its authorization object.','<b>Regenerate and rerun:</b> rebuild the rules and rerun the analysis.'],
['The custom payment release code ZFI_PAYREL is missing from the ruleset, so conflicts through it are invisible.','Add it to the payment function with its permission, F_BKPF_BUK.','The analysis now sees the conflict, and users with it are reported.']);
FN('2.6',['<b>Listen:</b> understand the business pressure first, for example a deadline.','<b>Quantify risk:</b> show the conflict and its impact in plain words.','<b>Offer options:</b> split tasks, temporary access with review, or a mitigating control.','<b>Escalate and record:</b> if they insist, go to the risk owner and keep a record.'],
['Situation: a finance director wants one analyst to create vendors and release payments to meet a deadline.','Action: show the risk and offer three options, so the answer is not only no.','Result: a temporary firefighter ID with review meets the deadline safely.','Lesson: bring options, hold the line, and escalate when needed.']);
FN('3.1',['<b>Request:</b> raised in GRC with the role and a business reason.','<b>Risk analysis:</b> runs automatically and attaches the result to the request.','<b>Approvals:</b> manager, role owner and, if a risk was found, the risk owner.','<b>Provision:</b> GRC assigns the roles in the backend system.','<b>Evidence:</b> every step is stored as an audit trail.'],
['The requester submits with a business reason.','Risk analysis runs and finds two high risks, shown in the request.','The approver sees the risk with the request, so the decision is informed.','The approver rejects, or approves with a mitigating control. The decision is recorded.']);
FN('3.2',['<b>HR event:</b> hire, transfer or termination, recorded in HR.','<b>Joiner:</b> request a standard role bundle for the job, with approval.','<b>Mover:</b> add new access and remove the old, to stop access creep.','<b>Leaver:</b> lock on the end date and remove roles.','<b>Evidence and review:</b> reconcile HR lists with SAP and keep the results.'],
['HR records that the employee left on 30 September.','SAP still shows an active user who logged on in November.','Lock the user, remove roles and investigate the logon.']);
FN('3.3',['<b>Request and reason:</b> a specific reason and ticket, not "urgent".','<b>Approve:</b> an authorised owner approves for a defined period.','<b>Use, time limited:</b> the ID expires automatically.','<b>Log:</b> every action recorded.','<b>Review:</b> an independent controller checks the log against the reason.'],
['A session ran at 02:14 under the reason "Urgent", which is too vague.','The log shows a vendor bank account was changed.','A payment run followed. Together this is a high-risk pattern.','The controller must review and challenge this, and record the outcome.']);
FN('3.4',['<b>Scope and data:</b> choose the population and add last-use data.','<b>Send to owners:</b> role or data owners get focused lists.','<b>Decide:</b> keep or remove each line, with a reason.','<b>Remove:</b> removals are actioned in the system.','<b>Evidence:</b> keep decisions, completion and removal proof.'],
['The reviewer sees the role Z_FI_PAY_RELEASE assigned to a user.','The last-use data shows it was never used.','Remove it and keep the evidence of the removal.']);
FN('3.5',['<b>Stage 1, manager:</b> confirms the person needs the access.','<b>Stage 2, role owner:</b> confirms the role fits the need.','<b>Stage 3, risk owner:</b> runs only when risk analysis finds a conflict.','<b>Stage 4, security:</b> final check and provisioning.'],
['A request enters the path.','A BRF+ rule checks the risk analysis result.','If a risk was found, the risk owner stage runs.','If not, the stage is skipped, so clean requests are quick.']);
FN('3.6',['<b>GRC:</b> holds the analysis but reads users and roles from the backend.','<b>Connector:</b> the RFC link to the backend. It needs a working technical user.','<b>Backend system:</b> the source of users, roles and authorizations.','<b>Sync jobs:</b> copy the data into GRC on a schedule.'],
['The sync job fails, so GRC data goes stale and analysis misses new conflicts.','The job log shows the RFC user is locked.','Unlock or replace the user and test the connection.','Rerun the role import and user sync jobs and confirm the logs are clean.']);
// ===== DEEPENING round 1: Weeks 0 and 1 (learn cards, simulation coaching, analyse, quiz) =====
function DP(id,o){const u=UNITS.find(x=>x.id===id);
 if(o.cards)o.cards.forEach(c=>u.learn.push({h:c[0],p:c[1]}));
 if(o.say&&u.sim)for(const k in o.say)u.sim[k].say=o.say[k];
 if(o.outro&&u.sim&&u.sim.length)u.sim.push({s:u.sim[u.sim.length-1].s,say:o.outro,a:{k:'read'}});
 if(o.tasks)u.lab.tasks=o.tasks;if(o.quiz)u.quiz=o.quiz}
DP('0.1',{cards:[['Worked example: one invoice','Aisha Hughes (AHUGHES) enters a vendor invoice with FB60. SAP finds her role Z_FI_AP_CLERK, which contains the object F_BKPF_BUK with ACTVT 01 and BUKRS 1000. FB60 asks for create in company code 1000, so the check passes and the invoice posts. If she tries company code 2000, the BUKRS field fails and she sees no authorization. GRC would separately flag her if she could also release the payment.'],['Common mistakes','Mixing up the layers: the <b>role</b> is what you assign, the <b>object</b> is what SAP checks. Saying Fiori controls access: Fiori is only the screen, and the backend still decides. Forgetting that identity (who you are) and authorization (what you may do) are two different steps.']],
 tasks:[mq('Which comes first when a user starts a transaction?',['SAP checks the authorization objects in the user\'s roles','GRC runs a risk analysis','A transport is imported'],0,'At runtime SAP compares what the program needs with the objects and values in the user\'s roles. GRC analyses access separately and in advance, it does not run at each click.'),
 mq('A role contains the object F_BKPF_BUK with BUKRS 1000. The user posts in company code 2000. Result?',['Allowed, the object exists','Blocked, the value does not match','Allowed, because ACTVT passed'],1,'Every field must pass. The object is present but the company code value is wrong, so the check fails even if the activity passes.'),
 mq('Which statement about Fiori is correct?',['Hiding a tile removes the authorization','Fiori is the browser screen, and backend authorizations still decide','Fiori replaces roles'],1,'Fiori shows apps. Access to data is still decided by the service and backend objects.'),
 mq('What does the identity service (IAS) do?',['Decides who may log in and handles single sign-on','Defines authorization objects','Runs the ruleset'],0,'IAS authenticates users. Roles and objects then decide what they may do.'),
 mq('Why does GRC matter if roles already limit access?',['A user can hold several roles whose combination creates a risky ability','Roles are not checked','It replaces PFCG'],0,'Each role may look safe alone, but together they can let one person create a vendor and pay it. GRC finds those combinations.')],
 quiz:[qz('Roles contain:',['Authorization objects with values','Passwords','Transport requests'],0,'A role holds the menu and authorization objects whose values SAP checks.'),qz('How many fields of an object must pass?',['All of them','At least one','Half'],0,'All fields must match for the check to pass.'),qz('Which tool creates users?',['SU01','PFCG','STMS'],0,'SU01 maintains users. PFCG maintains roles.'),qz('GRC Access Control mainly finds:',['Access conflicts','Slow reports','Failed batch jobs'],0,'It analyses access for segregation of duties and critical access.'),qz('Cloud identity (IAS, IPS) handles:',['Login and provisioning','Authorization values','Printing'],0,'IAS handles login and single sign-on, IPS creates and removes users.'),qz('A "no authorization" message means:',['A check failed for a field value','The system is down','The user is deleted'],0,'SAP found no matching value for at least one field.')]});
DP('0.2',{cards:[['Worked example: reviewing TOLSEN','In SU01 you open Tara Olsen. Type: dialog, a named person, correct. Valid through: 31.12.9999, no end date. Last logon: 02.04.2026, seven months ago. Profiles: SAP_ALL. Conclusion: a dialog user with unrestricted access who has not logged on for months. Action: confirm with her manager whether she needs it, then remove SAP_ALL and give her the roles for her real job, or lock the account.'],['Common mistakes','Treating a long absence as harmless: an unused powerful account is the one attackers want. Reviewing only roles and forgetting <b>profiles</b>, where SAP_ALL hides. Accepting shared dialog IDs because "the team shares one login".']],
 say:{1:'<b>SU01 is the user maintenance transaction.</b> Reviewers use it to read one person\'s record. Type SU01 in the command field and press Enter.',2:'The initial screen asks which user to open. The user ID is the person\'s SAP login name. Type TOLSEN, the IT administrator.',3:'You can only display here, which is the safe way to review. Click Display.',4:'The Address tab shows the person. For a security review the <b>Logon data</b> tab matters more: it holds the user type, validity and last logon. Open it.',5:'<b>User type:</b> dialog, a named person. <b>Valid through 31.12.9999</b> means the account never expires. <b>Last logon</b> shows how recently it was used. Now open the Profiles tab, where the real power sits.',6:'<b>SAP_ALL</b> is highlighted. It contains every authorization in the system. For a dialog user this is a finding, whatever the job title. Click Next.'},
 outro:'<b>Interview takeaway:</b> "In SU01 I check the user type, validity, last logon, roles and profiles. A dialog user with SAP_ALL and months of inactivity is removed or tightened, and for many users I use SUIM." Click Next.',
 tasks:[{q:'Which user carries the highest risk?<br>'+TBL(['User','Type','Last logon','Profiles'],[{c:['AHUGHES','Dialog','30.10.2026','Z_FI_AP_CLERK']},{c:['TOLSEN','Dialog','02.04.2026','SAP_ALL']},{c:['BATCH_ADM','System','n/a','Z_BATCH']}]),t:'mcq',o:['AHUGHES','TOLSEN','BATCH_ADM'],a:1,why:'TOLSEN is a dialog user with SAP_ALL, which is unrestricted, and has not logged on for months. Neither of the others holds anything close.'},
 mq('Which user type is meant for a named person?',['Dialog','System','Communication'],0,'Dialog users log on through the screen. System and communication users are technical.'),
 mq('A user has "Valid through 31.12.9999". What does it mean?',['No end date is set','The account expires this year','The user is locked'],0,'It is the default open end date. For contractors you would expect a real end date.'),
 mq('A team shares one dialog ID "AP_TEAM". The main problem is:',['You cannot tell who did what','It is slower','It uses more licences'],0,'Accountability is lost: an audit trail with a shared ID cannot be tied to a person.'),
 mq('You need every user in the system who holds SAP_ALL. What do you use?',['SUIM, users by profile','SU53','STMS'],0,'SUIM reports many users at once. SU01 shows only one.')],
 quiz:[qz('Which transaction shows one user record?',['SU01','SE16N','SM37'],0,'SU01 is user maintenance.'),qz('Which reports review many users?',['SUIM','STMS','SCC4'],0,'SUIM is the user information system.'),qz('A generic dialog ID shared by a team is:',['A control weakness','Good practice','Required by SAP'],0,'You cannot tell who did what.'),qz('SAP_ALL gives:',['Every authorization','Display only','Only finance'],0,'It is unrestricted access.'),qz('Which user type cannot log on interactively?',['System','Dialog','Reference'],0,'System users run background work.'),qz('Last logon months ago on a powerful account suggests:',['A clean-up or lock candidate','Nothing','A new joiner'],0,'Unused powerful accounts are risk with no benefit.')]});
DP('0.3',{cards:[['Worked example: AHUGHES cannot post','Aisha posts an invoice in company code 2000 and gets "no authorization". She runs SU53 at once. It shows object F_BKPF_BUK, field BUKRS, required 2000, she holds 1000. The consultant checks: was she approved for 2000, and would it create a conflict? Yes, approved. The fix is made in development in the derived role Z_FI_AP_CLERK_2000, tested, and transported.'],['Common mistakes','Running SU53 hours later after other checks have overwritten it. Adding SAP_ALL "to test". Changing the role directly in production. Fixing the symptom without asking whether the access was legitimate.']],
 say:{1:'<b>SU53 shows the last authorization check that failed</b> for the logged-on user. Ask the user to run it right after the error, in the same session. Type SU53 and press Enter.',2:'The table lists each failed check: <b>object, field, required value and the values the user holds</b>. Click the failed row to see the detail.',3:'The program required company code 2000 but the user only holds 1000. That is the gap. Before changing anything, ask if the access is approved and creates no conflict.'},
 outro:'<b>Interview takeaway:</b> "I use SU53 straight after the error to see object, field and value. If it is unclear, I trace with STAUTHTRACE. I check approval and risk, fix in development, test and transport, never in production." Click Next.',
 tasks:[{q:'What was missing?<br>'+TBL(['Object','Field','Required','User has'],[{c:['F_BKPF_BUK','BUKRS','3000','1000, 2000']}]),t:'mcq',o:['Company code 3000','Activity 03','Transaction FB60'],a:0,why:'The required value 3000 is not among the values 1000 and 2000 that the user holds.'},
 mq('First step before adding the missing value?',['Check the request is approved and creates no conflict','Add SAP_ALL','Ask the user to retry'],0,'Adding access without approval or risk check is how conflicts and audit findings begin.'),
 mq('Where is the fix made?',['In development, then transported','Directly in production','In SU53'],0,'Roles are changed in development, tested, and moved by transport so the change is traceable.'),
 mq('SU53 is empty or unclear. What next?',['Run an authorization trace (STAUTHTRACE)','Delete the role','Lock the user'],0,'A trace records every check, passed and failed, including background and Fiori calls SU53 does not capture.'),
 mq('Why must the user run SU53 straight away?',['It only keeps the last failed check','It deletes old data','It is faster at night'],0,'SU53 shows the most recent failure. Later checks overwrite it.')],
 quiz:[qz('Which transaction shows the last failed check?',['SU53','SU01','SE16N'],0,'SU53 shows it.'),qz('If SU53 is unclear you use:',['An authorization trace','A restart','SM37'],0,'STAUTHTRACE records all checks.'),qz('A fix should include:',['Approval and risk check','Only a password reset','Skipping tests'],0,'Check approval and risk first.'),qz('Production roles are changed:',['By transport','Directly','By the user'],0,'Via transport after testing.'),qz('SU53 shows:',['Required and held values','Passwords','Job logs'],0,'Object, field, required and held values.'),qz('A good consultant never fixes by:',['Adding SAP_ALL','Using SU53','Tracing'],0,'It is unrestricted access.')]});
DP('0.4',{cards:[['Worked example: one question, three audiences','Question: "How do you review access?" <b>Recruiter version:</b> "I use a fixed method: scope, report, review, remove, evidence." <b>Hiring manager version:</b> "It matters because unreviewed access causes audit findings and fraud; I focus on high-risk access first." <b>Supervisor version:</b> "I run SUIM by role and by critical authorization, send owners a list with last-use data, and track removals to closure." It is the same answer in three registers.'],['Common mistakes','Giving a long story when the question wants a method. Using tool names without saying why they matter. Ending without a decision. Memorising an answer word for word: interviewers notice and ask a follow-up that breaks the script.']],
 tasks:[mq('Who listens mainly for judgement and business risk?',['Hiring manager','Recruiter','Supervisor'],0,'The hiring manager owns the outcome and wants to see that you weigh risk.'),mq('Who listens for tools such as SU53 and PFCG?',['Supervisor','Recruiter','Nobody'],0,'The supervisor works with you daily and wants practical detail.'),mq('How should an answer end?',['With a decision and an owner','With a joke','With a salary question'],0,'Closing with remove, mitigate or escalate, and who owns it, shows leadership.'),mq('A behavioural answer uses which shape?',['Situation, action, result, lesson','A list of tools','A definition'],0,'A short story with a clear outcome and what you learned.'),mq('Why use your own story and not the one in this course?',['Interviewers probe real detail and a borrowed story breaks','It is shorter','It is required'],0,'The course stories show the shape. Your own experience survives follow-up questions.')],
 quiz:[qz('A recruiter mostly wants:',['Clear structure and vocabulary','Code','A long history'],0,'Clarity and vocabulary.'),qz('A supervisor mostly wants:',['Practical detail','Slogans','Silence'],0,'Hands-on detail.'),qz('Behavioural answers use:',['Situation, action, result, lesson','A list of tools','A long pause'],0,'A short story.'),qz('The stories in this course are:',['Illustrations of the shape','Scripts to learn','Required answers'],0,'Replace them with your own.'),qz('The first step in the answer method is:',['Signpost the structure','Name a tool','Give a decision'],0,'Say how many steps you will give.'),qz('Saying your answers aloud helps because:',['Speaking is a different skill from knowing','It is quieter','It is shorter'],0,'Practise the delivery.')]});
DP('1.1',{cards:[['Worked example: reading Z_FI_AP_CLERK','In PFCG you open the role and its Authorizations tab. You see S_TCODE (transactions FB60, FBL1N) and F_BKPF_BUK with ACTVT 01, 02, 03 and BUKRS 1000. Reading it aloud: "This role can enter, change and display accounting documents, but only in company code 1000." A star in BUKRS would mean every company code, which you would query.'],['Common mistakes','Reading only the transaction list and ignoring the values. Missing a star. Forgetting that organizational values (company code, plant) are what limit the reach of an otherwise correct role.']],
 say:{1:'<b>PFCG is the role maintenance transaction.</b> Roles hold menu and authorizations. Type PFCG and press Enter.',2:'Type the role name. This is the AP clerk role used at Thornfield.',3:'Display mode lets you inspect without risk of change. Click Display.',4:'The <b>Authorizations</b> tab holds the objects and values. This is where you see exactly what the role allows. Open it.',5:'Each row is an authorization object. F_BKPF_BUK controls accounting documents by company code. Click it to read its fields.',6:'<b>ACTVT</b> lists the activities: 01 create, 02 change, 03 display. <b>BUKRS</b> is the company code. This role works only in 1000. Click Next.'},
 outro:'<b>Interview takeaway:</b> "An authorization object is a template with fields. The role fills in values. Every field must pass. I always look at activity, organizational levels and any star." Click Next.',
 tasks:[{q:'Can the user display documents in company code 2000?<br>'+TBL(['Object','ACTVT','BUKRS'],[{c:['F_BKPF_BUK','01, 02, 03','1000']}]),t:'mcq',o:['Yes','No'],a:1,why:'Display (03) is allowed, but only in company code 1000. The company code field fails for 2000.'},
 mq('ACTVT 06 means:',['Delete','Display','Create'],0,'06 is delete, 03 display, 01 create, 02 change.'),
 mq('BUKRS contains a star (*). What does it mean?',['All company codes','No company code','Company code 0'],0,'A star means all values. It is broad and needs a business reason.'),
 mq('A role lists transaction FB60 in S_TCODE but has no F_BKPF_BUK. What happens?',['The user can start FB60 but cannot post','The user can post anywhere','The role is invalid'],0,'S_TCODE allows starting the transaction. The business object still has to pass.'),
 mq('Which part limits the reach of the role to one company?',['Organizational values such as BUKRS','The role name','The user type'],0,'Org values are the boundary of the role.')],
 quiz:[qz('An authorization object is:',['A template for checks','A transport','A user type'],0,'Roles fill it with values.'),qz('ACTVT is:',['The activity','The user','The client'],0,'Activity.'),qz('How many fields must pass?',['All of them','One','Half'],0,'All fields must pass.'),qz('BUKRS limits access by:',['Company code','Plant','Language'],0,'Company code.'),qz('A star in a field means:',['All values','No values','Default'],0,'It is the widest possible value.'),qz('S_TCODE controls:',['Which transactions can be started','Which company codes','Which jobs run'],0,'It controls starting transactions.')]});
DP('1.2',{cards:[['Worked example: two company codes','Thornfield has company codes 1000 and 2000. The AP duties are identical. Build the parent Z_FI_AP_CLERK once (menu and authorizations, BUKRS 1000). Derive Z_FI_AP_CLERK_2000 and change only BUKRS to 2000. Then build the composite Z_FI_AP_COMPOSITE for the AP job from singles for invoices, display and reporting. Fix the parent, and both company codes are fixed.'],['Common mistakes','Copying a role and editing both copies by hand, so they drift. Putting authorizations into a composite, where they cannot live. Building one huge role per job. Forgetting that derived roles inherit changes from the parent, so you test both.']],
 say:{1:'<b>PFCG again.</b> Composite and derived roles are both maintained here. Type PFCG and press Enter.',2:'Open the composite role for the AP clerk job.',3:'Click Display to inspect it.',4:'A <b>composite role</b> lists the single roles it bundles and holds no authorizations of its own. It exists to make assignment simple: one role per job. Click Next.',5:'A <b>derived role</b> inherits menu and authorizations from its parent, here Z_FI_AP_CLERK, and only the organizational values change, here BUKRS 2000. One design, many org levels. Click Next.'},
 outro:'<b>Interview takeaway:</b> "Singles are the building blocks, composites bundle them by job and hold no authorizations, derived roles copy a parent and change only org values. I keep roles small and owned." Click Next.',
 tasks:[mq('Same duties for company codes 1000 and 2000. Best design?',['One parent and two derived roles','Two unrelated roles','One role with a star'],0,'Derived roles keep one design and change only org values.'),mq('Which role type holds no authorizations of its own?',['Composite','Single','Derived'],0,'A composite is only a bundle of single roles.'),mq('The parent role changes. What happens to derived roles?',['They inherit it, and must be regenerated and tested','Nothing','They are deleted'],0,'Inheritance is the benefit, but you must adjust and test the generated authorizations.'),mq('A single role with 300 transactions is a problem because:',['It is hard to review and hides risk','It runs faster','It is safer'],0,'Large roles hide excess access and cause SoD conflicts.'),mq('Who should own each role?',['A named business or IT owner','Nobody','The consultant only'],0,'An owner approves requests and reviews the role.')],
 quiz:[qz('Which is the building block?',['Single role','Composite role','Profile'],0,'Single roles.'),qz('A derived role changes:',['Organizational values','The menu','The user type'],0,'Org values only.'),qz('A composite role is used to:',['Bundle singles for a job','Store passwords','Move transports'],0,'Job bundle.'),qz('Good design is:',['Small, task-based roles','One huge role','Copy and edit freely'],0,'Small, owned roles.'),qz('Derived roles inherit from:',['A parent role','The user','The client'],0,'The parent.'),qz('Composite roles are assigned:',['To users','To objects','To transports'],0,'Users get composites.')]});
DP('1.3',{cards:[['Worked example: adding FB60','You add FB60 to the AP role menu. PFCG reads SU24 and proposes S_TCODE, F_BKPF_BUK and F_LFA1_BUK (vendor display by company code), among others. Each comes with default values. You then fill in the company code and the activities. Thornfield also has a custom code ZFI_PAYREL: if SU24 has no entry, the role would have the transaction but none of the objects it checks.'],['Common mistakes','Editing the role by hand to add every object, instead of fixing SU24 once. Leaving defaults with stars. Never maintaining SU24 for custom Z transactions. Running SU25 after an upgrade without understanding what it overwrites.']],
 say:{1:'<b>SU24 holds the proposals</b> that link each transaction to the authorization objects it checks. Type SU24 and press Enter.',2:'Enter the transaction whose proposals you want to read: FB60, enter incoming invoice.',3:'Click Display to open the proposal list.',4:'Each row is an object. <b>Check indicator</b> says whether the program tests it. <b>Proposal</b> says whether PFCG should add it. Click the F_BKPF_BUK row.',5:'Check Yes with a proposal means PFCG adds this object with default values when FB60 goes in a role. Your job is then to maintain the real values. Click Next.'},
 outro:'<b>Interview takeaway:</b> "SU24 drives what PFCG proposes. Wrong SU24 means wrong roles. SU25 compares defaults after an upgrade, and I maintain SU24 for custom Z transactions." Click Next.',
 tasks:[mq('The proposal says Do not check, No. What happens in PFCG?',['The object is not proposed','The object is added','The role is deleted'],0,'The program does not test it, so the role does not need it.'),mq('When is SU25 used?',['After an upgrade or support package','At every logon','During batch jobs'],0,'It compares SAP\'s new defaults with your SU24 maintenance.'),mq('A custom Z transaction has no SU24 entry. Result?',['Roles come out incomplete','Nothing','Faster logon'],0,'PFCG proposes no objects, so users get no authorization at runtime.'),mq('Why fix SU24 and not the role by hand?',['The fix applies to every future role','It is quicker once','It hides risk'],0,'One correct SU24 entry improves every role that uses the transaction.'),mq('Check = Yes and proposal = Yes. Next you:',['Maintain the values such as company code','Delete it','Leave the defaults'],0,'Defaults can be broad. Maintain real values.')],
 quiz:[qz('SU24 stores:',['Object proposals per transaction','Passwords','Job logs'],0,'Proposals.'),qz('Check indicator Check means:',['The program tests the object','The object is ignored','The user is locked'],0,'The program checks it.'),qz('SU25 runs:',['After upgrade','Daily','Never'],0,'Upgrade comparison.'),qz('Good SU24 reduces:',['Role clean-up work','Disk space','Network speed'],0,'Cleaner roles.'),qz('Custom Z transactions need:',['SU24 maintenance','Nothing','Deletion'],0,'Maintain them.'),qz('PFCG gets proposals from:',['SU24','SU53','SM37'],0,'SU24.')]});
DP('1.4',{cards:[['Worked example: SAP_ALL audit','You run SUIM, users by profile SAP_ALL, and get four users. BATCH_ADM is a locked system user: low urgency, confirm the owner. FF_BASIS01 is a locked firefighter ID. TOLSEN and DEVELOPER2 are active dialog users who logged on recently: these two are the finding. You remove SAP_ALL, give them task roles, and route emergencies through firefighter access. You also search S_DEVELOP activity 02 and S_TABU_DIS.'],['Common mistakes','Counting locked and system IDs as equal to active dialog users. Fixing SAP_ALL but leaving the same power in a large custom role. Forgetting that debug-replace and table maintenance are as dangerous as SAP_ALL.']],
 say:{1:'<b>SUIM is the user information system:</b> a set of reports over users, roles and authorizations. Type SUIM and press Enter.',2:'Open the selection by complex criteria. It lets you search users by profile, role or authorization.',3:'Use the By profiles tab, because SAP_ALL is a profile.',4:'Type the profile you are hunting for.',5:'Click Execute. SAP lists every user holding it.',6:'The list shows two unlocked dialog users with SAP_ALL. These are the findings, while locked and system IDs are lower urgency. Click Next.'},
 outro:'<b>Interview takeaway:</b> "Nobody holds SAP_ALL permanently in production. I find holders with SUIM, remove it, and use logged, reviewed firefighter access for emergencies. I also check debug-replace and table maintenance." Click Next.',
 tasks:[{q:'How many holders need action?<br>'+TBL(['User','Type','Locked','Last logon'],[{c:['TOLSEN','Dialog','No','02.04.2026']},{c:['DEVELOPER2','Dialog','No','29.10.2026']},{c:['BATCH_ADM','System','Yes','n/a']},{c:['FF_BASIS01','Dialog','Yes','12.08.2026']}]),t:'num',a:2,why:'TOLSEN and DEVELOPER2 are active, unlocked dialog users. The locked system and firefighter IDs still need owner confirmation but are not the urgent finding.'},mq('Best control for emergency use?',['Firefighter ID with log review','Permanent SAP_ALL','Shared password'],0,'Emergency power is controlled, logged and reviewed afterwards.'),mq('Which object allows debug with replace?',['S_DEVELOP with activity 02','S_TCODE','F_BKPF_BUK'],0,'Debug with replace lets a user change data values at runtime.'),mq('A developer needs SAP_ALL in production "for support". You:',['Offer a firefighter ID','Grant it for a month','Share an admin ID'],0,'Give controlled, time-limited, logged access.'),mq('Besides SAP_ALL, which is also critical?',['S_TABU_DIS with broad table groups','Display of a report','A printer role'],0,'Table maintenance lets a user change data outside business transactions.')],
 quiz:[qz('Who should hold SAP_ALL in production?',['Nobody permanently','All admins','All auditors'],0,'Use controlled emergency access.'),qz('SUIM by profile finds:',['Users with a profile','Failed jobs','Transports'],0,'Profile holders.'),qz('Critical access is controlled by:',['Approval, time limit, logging','Trust','A memo'],0,'Process and monitoring.'),qz('Debug with replace is:',['A critical power','Harmless','Display only'],0,'It can change data.'),qz('Firefighter access is:',['Time limited and reviewed','Permanent','Unlogged'],0,'Controlled use.'),qz('A locked system user with SAP_ALL needs:',['Owner confirmation','Nothing','A new role'],0,'Confirm and document.')]});
DP('1.5',{cards:[['Worked example: from 310 to focused roles','Role usage shows Z_FI_ALL_ACCESS with 310 transactions, 40 users, 9 transactions used. You trace three real users doing their work and find they need payables entry, vendor display and payment proposals. You build three task roles from those checks, derive for company codes, test with real users and migrate in waves. The 301 unused transactions leave the picture, and so does the SoD noise they created.'],['Common mistakes','Cutting access without a trace and breaking month-end. Tracing a user who does not do the full job. Skipping rollback. Not setting design rules, so the same oversized role is rebuilt two years later.']],
 say:{1:'<b>STAUTHTRACE is the system authorization trace.</b> It records checks while a user works. Type STAUTHTRACE and press Enter.',2:'Start the trace for the user whose work you want to measure.',3:'The user now repeats their real work. Every check is recorded. When done, stop the trace.',4:'The result lists every check with a pass or fail. Click the failed row.',5:'F_BKPF_KOA failed: the role is missing it. Add it through SU24 and the role, then test again. Click Next.'},
 outro:'<b>Interview takeaway:</b> "I measure role size and usage, trace real work, split by task, derive for org values, and set design rules so it does not return." Click Next.',
 tasks:[{q:'What share of the 310 transactions is used?<br>'+TBL(['Role','Users','Transactions in role','Used'],[{c:['Z_FI_ALL_ACCESS','40','310','9']}]),t:'mcq',o:['About 3%','About 30%','About 90%'],a:0,why:'9 of 310 is about 3 percent. The other 97 percent is excess access.'},mq('Best fix?',['Split by task and derive','Add more access','Ignore it'],0,'Small task roles are reviewable and safer.'),mq('A trace shows Failed with RC 4. It means:',['A missing authorization','A passed check','A locked user'],0,'Return code 4 means the check failed.'),mq('Why trace real work and not guess?',['Needs differ from job titles','It is slower','Guessing is allowed'],0,'Real checks show what people actually need.'),mq('How do you stop oversized roles returning?',['Design rules and owner review','Hope','More roles'],0,'Set limits on size, require an owner and review regularly.')],
 quiz:[qz('The trace tool is:',['STAUTHTRACE','SU01','STMS'],0,'System authorization trace.'),qz('A trace shows:',['Every check, passed and failed','Only the failure','Passwords'],0,'All checks.'),qz('Oversized roles hide:',['Risk','Nothing','Data'],0,'They hide excess access.'),qz('Prevent it by:',['Role size rules','More roles','No review'],0,'Design rules.'),qz('Role usage data shows:',['What is actually used','Passwords','Backups'],0,'Used versus assigned.'),qz('Migrate role changes in:',['Waves with rollback','One big bang','No testing'],0,'Reduce risk.')]});
DP('1.6',{cards:[['Worked example: a clean-up programme','Baseline: 2,400 roles, 6,100 users, 1,900 SoD conflicts, 40 percent of assigned roles unused in 12 months. Quick win: remove unused assignments and lock inactive users, conflicts fall to 1,100 in two weeks. Role mining then produces 180 task roles with owners. Rollout in four waves by department. After: 700 conflicts, with risk checking at request time to stop new ones. Numbers like these are what an interviewer wants to hear.'],['Common mistakes','Starting without a baseline, so success cannot be proved. Redesigning everything before removing unused access. A big-bang cutover with no rollback. No ongoing control, so conflicts creep back.']],
 say:{1:'<b>ST03N workload statistics</b> can show which transactions a user or role has really used. Type ST03N and press Enter.',2:'The table compares roles with their usage. Click the role with a very low share used.',3:'Z_FI_ALL_ACCESS gives 310 transactions but only 9 are used, across 40 users and 6 active. This is the first clean-up target. Click Next.'},
 outro:'<b>Interview takeaway:</b> "Baseline, quick wins by removing unused access, role mining for task roles, rollout in waves, prove with before and after numbers, and prevent with request-time risk checks." Click Next.',
 tasks:[mq('First step of a clean-up?',['Baseline the numbers','Delete roles','Buy a tool'],0,'Without a baseline you cannot prove improvement.'),mq('Which is a quick win?',['Remove unused access','Rewrite all roles','Hire more staff'],0,'Unused access is risk with no benefit and little business impact when removed.'),mq('How do you prevent drift?',['Risk check at request time and periodic review','Hope','Annual memo'],0,'Stop new conflicts entering and re-check regularly.'),mq('Why roll out in waves?',['Limit impact and allow rollback','It is cheaper','Auditors require it'],0,'A problem in one department does not stop the business.'),mq('What is role mining?',['Using real usage data to design roles','Deleting roles','Reading passwords'],0,'Group users by what they actually do and build roles for those patterns.')],
 quiz:[qz('Role mining uses:',['Real usage data','Guesses','Passwords'],0,'Usage and assignments.'),qz('Roll out in:',['Waves with rollback','One big bang','No testing'],0,'Reduce risk.'),qz('Prove success by:',['Before and after metrics','Opinion','Silence'],0,'Show the numbers.'),qz('Business Role Management adds:',['Controlled role design','A new database','A printer'],0,'Role definition workflow.'),qz('The first quick win is:',['Remove unused access','Add roles','Close the audit'],0,'Cheap and safe.'),qz('A baseline records:',['Roles, users, conflicts, unused access','Passwords','Printers'],0,'The starting measures.')]});
// ===== DEEPENING round 2: Weeks 2 and 3 =====
const GW='<b>GRC is reached through the NetWeaver Business Client.</b> Type NWBC and press Enter to open the GRC work centre.';
DP('2.1',{cards:[['Worked example: AHUGHES and risk P010','Aisha Hughes holds Z_FI_AP_CLERK, which allows vendor changes (XK01, FK01), and Z_FI_PAY_RELEASE, which allows payment runs (F110, F-53). The ruleset defines risk P010 as vendor master maintenance combined with payment processing. ARA matches her actions and permissions to both functions and reports P010 at High level. One person could create a fake vendor and pay it. The fix is to separate the duties, not to ignore the alert.'],['Common mistakes','Saying SoD is "about roles": it is about what a person can do in combination. Leaving the delivered ruleset untouched and living with false positives. Forgetting permissions, which make results precise. Treating a risk report as a verdict: it is a finding that needs a business decision.']],
 say:{1:GW,2:'<b>Access Risk Analysis (ARA)</b> checks one user, role or the whole system against the ruleset. Enter the user to analyse: AHUGHES, the AP clerk.',3:'The rule set is GLOBAL, the report type is action level. Click Run analysis.',4:'The result lists each risk with its level and number of conflicts. P010 is High. Click it to see why.',5:'The detail shows the two <b>functions</b> that meet in one user: vendor master maintenance and payment processing, with the actions in conflict. This is the segregation of duties risk.'},
 outro:'<b>Interview takeaway:</b> "A risk is built from functions, a function from actions and permissions. ARA reports a risk when one user holds both. I tune the ruleset to the business." Click Next.',
 tasks:[{q:'Which finding is the highest priority?<br>'+TBL(['Risk','Level','User'],[{c:['P010','High','AHUGHES']},{c:['F021','Medium','AHUGHES']},{c:['X900','Low','TOLSEN']}]),t:'mcq',o:['P010','F021','X900'],a:0,why:'High-level risks involve the most serious fraud or error routes and are handled first.'},
 mq('A risk is made of:',['Two or more functions','One transaction','A role name'],0,'The combination of duties is what makes it a risk.'),
 mq('Why are permissions part of a function?',['They cut false positives by checking real values','They lock users','They move transports'],0,'A user who can only display would otherwise be flagged as if they could change.'),
 mq('The delivered ruleset reports hundreds of risks nobody understands. Best response?',['Tune a copy to the business','Switch off analysis','Delete low risks'],0,'Tune and document. Do not remove the control.'),
 mq('Which pair is a classic SoD conflict?',['Create vendor and release payment','Display vendor and display invoice','Run a report and print it'],0,'One person controlling both ends of a payment route is the textbook fraud path.')],
 quiz:[qz('A function contains:',['Actions and permissions','Passwords','Jobs'],0,'Actions and permissions.'),qz('SoD means:',['No one completes a risky process alone','Everyone has all access','Only admins approve'],0,'Split the duties.'),qz('ARA stands for:',['Access Risk Analysis','Auto Role Assign','Audit Report Archive'],0,'GRC module.'),qz('A delivered ruleset should be:',['Tuned to the business','Left unchanged','Deleted'],0,'Tune it.'),qz('A risk is reported when a user:',['Holds all its functions','Logs on','Has a role'],0,'Every function of the risk must be present.'),qz('Permissions in a function:',['Make results precise','Lock users','Slow the system'],0,'They reduce false positives.')]});
DP('2.2',{cards:[['Worked example: remove or mitigate AHUGHES','ARA shows P010 for Aisha. You ask her manager: does the AP clerk release payments? No, that is the treasury team, the role came from a previous job. Decision: remove Z_FI_PAY_RELEASE through a change request. A different case: the finance controller truly needs both for small companies. Decision: mitigate with a weekly review of vendor bank changes by the CFO, recorded in GRC.'],['Common mistakes','Mitigating because removal is "too much work". Accepting a mitigation with no evidence. Letting the consultant approve the risk acceptance. Leaving the ticket without a date for the removal.']],
 say:{1:GW,2:'Analyse the clerk again, this time to decide what to do about the finding.',3:'Click Run analysis.',4:'Open risk P010 to read its detail and the options.',5:'Ask first: does this person really need payment release? Here the answer is no, so <b>Remove access</b> is the cleanest fix because the risk disappears. Click it.',6:'The removal is made through a change request, not directly. At the next analysis the conflict is gone. Mitigation is the second choice, used only when the duty is truly needed.'},
 outro:'<b>Interview takeaway:</b> "Remove first. Mitigate only when both duties are needed, with a control, an owner and evidence. The business risk owner accepts the residual risk, and I never approve my own request." Click Next.',
 tasks:[mq('The user does not use the second duty. Action?',['Remove it','Mitigate it','Ignore it'],0,'Unused access is simply removed. No control is needed.'),mq('The controller truly needs both duties. Action?',['Mitigate with a control','Add SAP_ALL','Remove all access'],0,'Mitigate, with an owner and evidence, and record the risk acceptance.'),mq('Who accepts the residual risk?',['The business risk owner','The consultant alone','The user'],0,'Risk belongs to the business. The consultant advises.'),mq('Removal and mitigation are both done. What do you check later?',['That the removal holds and the control runs','Nothing','Only the user list'],0,'Both are monitored in the next analysis and review.'),mq('Which answer sounds strongest in an interview?',['Remove if not needed, otherwise mitigate and evidence it','Always mitigate','Always remove'],0,'It shows judgement, not a fixed rule.')],
 quiz:[qz('First choice for a conflict?',['Remove the access','Mitigate','Accept silently'],0,'Remove if not needed.'),qz('Mitigation needs:',['Control, owner, evidence','Only a note','Nothing'],0,'It must really operate.'),qz('Who approves the residual risk?',['Business owner','Consultant alone','Auditor'],0,'The owner.'),qz('Self-approval is:',['Not allowed','Fine','Encouraged'],0,'It breaks SoD.'),qz('Removal is done through:',['A change request','A direct edit','Email'],0,'Governed change.'),qz('A consultant\'s role is to:',['Advise and implement','Accept risk alone','Ignore it'],0,'Decisions are the owner\'s.')]});
DP('2.3',{cards:[['Worked example: MC_P010_WEEKLY','Control: every Friday the controller exports vendor bank changes from the change log and compares them with payments made that week. Owner: Priya Raman, independent of AP. Evidence: signed comparison report with the date, filed in the evidence folder. In GRC the control MC_P010_WEEKLY is assigned to AHUGHES and risk P010, valid to 31.12.2027. At the next analysis, the risk shows as mitigated, not removed.'],['Common mistakes','A control owned by someone inside the risky process. "Management reviews" with no frequency. Evidence made after the fact. A control that covers the wrong risk. Letting the valid-to date expire silently, so the risk returns unnoticed.']],
 say:{1:GW,2:'The mitigating control is defined in GRC. Type its ID, MC_P010_WEEKLY, in the control field.',3:'The monitor is the person who performs the control, here Priya Raman, independent of AP, and it is valid to the end of 2027. Click Assign to link the control to the user and the risk.',4:'The risk still appears in reports but is marked <b>mitigated</b>. When the valid-to date passes, the conflict reappears and forces a review.'},
 outro:'<b>Interview takeaway:</b> "A real control has an owner, a frequency, a procedure that covers the exact risk and evidence each period. I test it before I accept it." Click Next.',
 tasks:[{q:'Is this a real control?<br>'+TBL(['Control','Owner','Frequency','Evidence'],[{c:['Review bank changes','Controller','Weekly','Signed report']},{c:['Be careful','None','None','None']}]),t:'mcq',o:['First is real, second is not','Both are real','Neither'],a:0,why:'A real control has an owner, a frequency and evidence. "Be careful" has none of these.'},mq('Mitigation removes the risk?',['No, it reduces it','Yes completely','Only for admins'],0,'The conflict remains and is covered by a control.'),mq('The valid-to date expires. What happens?',['The conflict reappears','Nothing','The user is deleted'],0,'This forces a review of whether the control still operates.'),mq('Who should perform the control?',['Someone independent of the risky duties','The user themselves','Anyone'],0,'A user cannot control their own access.'),mq('Which evidence is acceptable?',['A dated, signed review report','A verbal assurance','A plan to review'],0,'Evidence is produced each time the control runs.')],
 quiz:[qz('A mitigating control needs:',['Owner, frequency, evidence','Only a name','A password'],0,'All three.'),qz('Mitigation is assigned to:',['User and risk','A transport','A client'],0,'Both.'),qz('The risk after mitigation is:',['Visible but covered','Deleted','Hidden'],0,'Marked mitigated.'),qz('A paper-only control is:',['A finding','Good enough','Required'],0,'It must run.'),qz('The monitor should be:',['Independent','The user','Unknown'],0,'Independent person.'),qz('Controls are tested:',['Before acceptance','Never','After a finding'],0,'Test first.')]});
DP('2.4',{cards:[['Worked example: tuning for Thornfield','The delivered rule P020 flags anyone who can post invoices and display payments. At Thornfield that is every clerk and the alerts are noise. In a copy of the rule set you add a permission so the risk only fires when the user can also execute the payment run. False positives drop from 400 to 40. You also add Z001, a custom risk for the bank data and payment release combination, approved by Priya Raman and documented in a change record.'],['Common mistakes','Editing the delivered rule set directly. Tuning with no approval. Lowering a risk level to make the report look better. Adding custom risks without updating documentation, so nobody can explain the result to an auditor.']],
 say:{1:GW,2:'<b>Rule set maintenance</b> lists delivered and custom risks. Delivered ones come with SAP. Click the custom risk Z001 that Thornfield added.',3:'Z001 covers a business-specific route that the delivered rules miss. It was approved by the risk owner and has a change record. Every tuning step leaves this kind of trail.'},
 outro:'<b>Interview takeaway:</b> "I copy the delivered set, tune permissions to cut false positives, add custom risks for the business, and approve and document each change before I generate and test." Click Next.',
 tasks:[mq('Too many false positives. First move?',['Tune permissions in a copy','Delete the risks','Turn off analysis'],0,'Tune, never delete.'),mq('Why copy the delivered set?',['Upgrades will not overwrite your changes','It is faster','SAP requires it'],0,'You also keep a clean baseline.'),mq('Every ruleset change needs:',['Approval and documentation','Nothing','A new client'],0,'Auditors ask who approved it and why.'),mq('A risk is lowered from High to Low so the report looks better. This is:',['Inappropriate without justification','Good practice','Required'],0,'Levels follow business impact, not appearance.'),mq('After changing rules you:',['Generate and test, then rerun the analysis','Do nothing','Delete users'],0,'Regenerate and compare the results.')],
 quiz:[qz('Edit the delivered set?',['Copy then edit','Edit directly','Never analyse'],0,'Copy first.'),qz('A custom risk covers:',['Business-specific gaps','Passwords','Printers'],0,'Local processes.'),qz('Changes are approved by:',['Risk owner','Anyone','Nobody'],0,'Governance.'),qz('After changing rules:',['Generate and test','Do nothing','Delete users'],0,'Regenerate.'),qz('Tuning permissions reduces:',['False positives','Users','Roles'],0,'Fewer noise alerts.'),qz('A change record shows:',['Who approved what and why','Passwords','Job logs'],0,'Audit trail.')]});
DP('2.5',{cards:[['Worked example: ZFI_PAYREL','Thornfield wrote ZFI_PAYREL, a custom transaction that releases payment batches. The delivered ruleset has never heard of it, so a user with ZFI_PAYREL and vendor maintenance is never flagged. You list Z codes from table TSTC, check usage data, and add ZFI_PAYREL to the payment function with the permission F_BKPF_BUK. After regenerating, ARA reports five users with a conflict that was invisible before.'],['Common mistakes','Assuming the ruleset covers custom code. Adding the transaction but not its authorization objects. Forgetting to regenerate. Not including Z-code review in the change process, so each new Z transaction is a new blind spot.']],
 say:{1:'<b>SE16N is the table browser.</b> Open table TSTC to list transaction codes, then filter on Z and Y, which are customer-created codes.',2:'Now return to the GRC work centre and open the function that covers payments. '+GW,3:'ZFI_PAYREL is a custom transaction missing from the function, so conflicts through it are invisible. Click it.',4:'Click Add action. The function now includes the transaction with its permission object.',5:'It is now active with the permission F_BKPF_BUK. The rules still have to be regenerated and the analysis rerun before users with this code are reported.'},
 outro:'<b>Interview takeaway:</b> "The ruleset only knows what is listed. I find Z transactions in TSTC, add them to the right function with permissions, regenerate and rerun. I put Z-code review into the change process." Click Next.',
 tasks:[mq('A Z transaction that releases payments is not in the ruleset. Result?',['SoD risks are missed','Nothing','More alerts'],0,'These are false negatives, the dangerous kind.'),mq('Which table lists transaction codes?',['TSTC','USR02','TADIR only'],0,'TSTC is the transaction code table.'),mq('After adding the action you:',['Regenerate rules and rerun the analysis','Delete the role','Lock users'],0,'The rules must be rebuilt to take effect.'),mq('Z and Y mean:',['Customer-created objects','SAP standard','Temporary'],0,'Customer namespace.'),mq('How do you stop new blind spots?',['Make Z-code review part of the change process','Review once a year','Ignore it'],0,'Every new custom transaction is checked as it is created.')],
 quiz:[qz('Custom codes are covered by:',['Adding them to functions','Nothing needed','SU53'],0,'Add them.'),qz('Z codes start with:',['Z or Y','A','S'],0,'Customer namespace.'),qz('Missing actions cause:',['False negatives','False positives','Faster logon'],0,'Risks are missed.'),qz('Check usage with:',['Usage data','Guessing','A memo'],0,'See if it is used.'),qz('After adding an action:',['Regenerate','Reboot','Delete'],0,'Regenerate rules.'),qz('Permissions on the action are:',['The authorization objects checked','Passwords','Colours'],0,'They make the match precise.')]});
DP('2.6',{cards:[['Worked example: the shape of a strong answer','Situation (10 seconds): a finance director wanted one analyst to create vendors and release payments. Action (30 seconds): showed the risk in plain words, offered three options, escalated when pressed. Result (10 seconds): temporary reviewed access, risk controlled. Lesson (10 seconds): bring options, not only a no. Aim for one minute in total.'],['Common mistakes','Telling a story where you were the hero and the business the villain. No result. Inventing numbers. Answering "what would you do" when asked "tell me about a time". Reciting the course story: use your own.']],
 tasks:[mq('A director demands access today. Best first move?',['Listen, then explain the risk and offer options','Say no','Give it quietly'],0,'Be the partner who holds the line.'),mq('They still insist. You:',['Escalate to the risk owner and keep a record','Give in','Hide it'],0,'You do not carry the risk alone.'),mq('Your story should be:',['Your own real experience','A copied script','Invented numbers'],0,'Interviewers probe the detail.'),mq('How long should the answer be?',['About one minute','Ten minutes','One sentence'],0,'Short but complete.'),mq('Which part is often missing?',['The lesson','The situation','The name'],0,'The lesson shows growth.')],
 quiz:[qz('A good behavioural answer is:',['Short, specific, with a result','Long and vague','Only theory'],0,'Situation, action, result, lesson.'),qz('You should bring the business:',['Options','Only a refusal','Blame'],0,'Offer alternatives.'),qz('If pressure continues:',['Escalate','Comply','Ignore'],0,'Use the risk owner.'),qz('The story in this course is:',['An illustration','Your CV','A rule'],0,'Replace it with yours.'),qz('SAR stands for:',['Situation, action, result','Security and risk','Scope and review'],0,'The story shape (plus lesson).'),qz('A strong answer shows:',['Judgement and backbone','Only speed','Only rules'],0,'Both.')]});
DP('3.1',{cards:[['Worked example: request 4711','Aisha asks for Z_FI_PAY_RELEASE with the reason "needed for payment runs". On submit, GRC runs risk analysis and finds two high risks, P010 and P020. The line manager approves, the role owner approves, then the risk owner sees the two risks. Nothing justifies the combination, so the request is rejected with a reason. Everything is stored: who, when, what the analysis said. That is the audit trail.'],['Common mistakes','Approvers who cannot see the risk. Allowing self-approval. Approving "to be helpful". No business reason in the request. Provisioning outside the workflow, which breaks the audit trail.']],
 say:{1:GW,2:'The request form needs a business reason. Type a short one. Auditors read this later.',3:'Click Submit. GRC will run the risk analysis automatically.',4:'The approver sees the request <b>together with the risk result</b>: two high risks. The decision is now informed. Here the access is not needed, so click Reject.',5:'The rejection is recorded with a reason and a date. No access was provisioned, and the audit trail shows exactly what happened.'},
 outro:'<b>Interview takeaway:</b> "Request, risk analysis, approvals with the risk visible, provisioning, evidence. I block self-approval and escalate delays." Click Next.',
 tasks:[mq('The approver cannot see the risk. Impact?',['They approve blindly','Nothing','Faster work'],0,'Show the risk result in the approval screen.'),mq('Who may approve their own request?',['Nobody','The requester','Anyone'],0,'Self-approval breaks the control.'),mq('What is kept as evidence?',['Request, risk result, approvals, dates','Only a name','Nothing'],0,'The full trail is what auditors test.'),mq('Access is granted by email to "save time". The problem?',['It bypasses the workflow and leaves no trail','Nothing','It is faster'],0,'Out-of-process access is a classic finding.'),mq('An approver is on leave. Best design?',['Delegation or escalation rules','Skip approval','Let the requester decide'],0,'Keep control without blocking the business.')],
 quiz:[qz('First step after submit:',['Risk analysis','Provisioning','Archive'],0,'Analyse then approve.'),qz('Approvers need to see:',['The risk','Nothing','Passwords'],0,'Informed decisions.'),qz('Evidence is:',['The audit trail','Optional','Verbal'],0,'Auditors need it.'),qz('Provisioning happens:',['After approval','Before approval','Never'],0,'Only after.'),qz('Self-approval is:',['Blocked','Allowed','Required'],0,'Break of SoD.'),qz('Delays are handled by:',['Escalation','Ignoring','Skipping'],0,'Escalate.')]});
DP('3.2',{cards:[['Worked example: BWILSON','HR says Ben Wilson left on 30 September. SUIM shows his user active and unlocked, and the last logon is 14 November, six weeks after leaving. Actions: lock the user at once, remove roles, check what was done since 30 September using the audit log, and raise an incident. Root cause: the leaver notice never reached IT. Fix: an automated feed from HR, plus a monthly reconciliation.'],['Common mistakes','Relying on manager emails for leavers. Locking but never removing roles. Forgetting contractors, who are not in HR. Movers who keep old access and slowly accumulate it.']],
 say:{1:'<b>SUIM</b> gives the active user list. Compare it with the HR leaver list. Type SUIM and press Enter.',2:'The comparison shows people who have left but still have an active account. Click the leaver who is still active.',3:'The user logged on after the end date, which is a serious finding: lock, remove roles and investigate. Add an automated HR feed so this stops depending on emails.'},
 outro:'<b>Interview takeaway:</b> "HR is the source. Joiners get a role bundle, movers lose old access, leavers are locked on the end date. I prove it by comparing HR with SAP and checking logons after the end date." Click Next.',
 tasks:[{q:'How many leavers still have a working account?<br>'+TBL(['Employee','HR end','SAP status'],[{c:['BWILSON','30.09.2026','Active']},{c:['KNOWLES','31.10.2026','Locked']},{c:['CHEN','15.10.2026','Active']}]),t:'num',a:2,why:'BWILSON and CHEN left but are still active. KNOWLES is locked.'},mq('Best prevention?',['Automated HR feed','Monthly email','Trust managers'],0,'Manual notice is the weakest control.'),mq('Movers should:',['Lose old access','Keep all access','Be locked'],0,'Otherwise they accumulate access over time (access creep).'),mq('A leaver logged on after the end date. First action?',['Lock, remove roles, investigate','Wait','Reset the password'],0,'Contain, then investigate.'),mq('Which group is often missed?',['Contractors','Managers','Auditors'],0,'They may not be in the HR system.')],
 quiz:[qz('The source of truth is:',['HR','The user','IT guess'],0,'HR data.'),qz('Leavers are locked:',['On the end date','Next year','Never'],0,'Timely.'),qz('Movers risk:',['Access creep','Nothing','Faster logon'],0,'They accumulate roles.'),qz('Check leavers with:',['HR list versus SAP users','Guessing','SM37'],0,'Reconcile.'),qz('Joiners get:',['A standard role bundle','Copy of a colleague','SAP_ALL'],0,'Approved standard roles.'),qz('Logon after leaving is:',['A serious finding','Normal','Expected'],0,'Investigate.')]});
DP('3.3',{cards:[['Worked example: session S-102','FF_FIN01 was used at 02:14 with the reason "Urgent". The log shows SE16N on the vendor bank table, FK02 changing a vendor bank account at 02:20 and an F110 payment run at 02:31. A change to bank details followed by a payment run is the classic fraud pattern. The controller challenges the reason, asks for the ticket, checks the vendor against supporting documents and records the result. If it cannot be justified, it becomes an incident.'],['Common mistakes','Reasons like "Urgent" or "Support". Sessions left open for days. Reviewers who are the same people who used the ID. Reviews done months later. No link between the session and a ticket.']],
 say:{1:GW,2:'Open the firefighter log. Each row is a session: who, which ID and why. Click session S-102 to see what was done.',3:'The log shows a vendor bank account change and a payment run at night with a weak reason. The controller challenges it, then clicks Mark reviewed with a note. The review is the control.'},
 outro:'<b>Interview takeaway:</b> "Firefighter IDs are requested with a specific reason and ticket, time limited, fully logged and reviewed by an independent controller. I challenge weak reasons." Click Next.',
 tasks:[mq('Reason "Urgent". Acceptable?',['No, too vague','Yes','Only at night'],0,'Reasons must be specific and tied to a ticket.'),mq('Who reviews the session?',['An independent controller','The user','Nobody'],0,'You cannot review yourself.'),mq('Session length should be:',['Short and limited','Open ended','Permanent'],0,'Time limits reduce exposure.'),mq('A bank change followed by a payment run in one session is:',['A high-risk pattern to challenge','Normal','Routine'],0,'It is the classic fraud route.'),mq('Review should happen:',['Within a set short time','Whenever','At year end'],0,'Prompt review limits damage.')],
 quiz:[qz('Firefighter access is:',['Temporary and logged','Permanent','Unlogged'],0,'Controlled.'),qz('Every action is:',['Logged','Ignored','Deleted'],0,'Log trail.'),qz('Review is done by:',['A controller','The user','Nobody'],0,'Independent.'),qz('A vague reason should be:',['Challenged','Accepted','Hidden'],0,'Ask for detail.'),qz('The session is linked to:',['A ticket','A password','A job'],0,'Traceability.'),qz('Emergency access is for:',['Real emergencies','Daily work','Convenience'],0,'Exceptions only.')]});
DP('3.4',{cards:[['Worked example: finance review','The review covers 120 finance users. Each role owner gets only their roles with last-use data. For AHUGHES the owner sees Z_FI_AP_CLERK used daily (keep) and Z_FI_PAY_RELEASE never used (remove). Decisions are recorded in GRC, a removal ticket is created, and completion is confirmed. The pack for audit: population, reviewer, decisions, removal evidence.'],['Common mistakes','Sending one 50,000-line spreadsheet. Reviewers approving everything in minutes. No usage data. Removals never actioned. The reviewer being the user\'s own subordinate.']],
 say:{1:GW,2:'The review lists users and roles with last-use data. The role AHUGHES has but has <b>never used</b> is the obvious candidate. Click it.',3:'Never used means no business need, so choose remove. Click Remove selected.'},
 outro:'<b>Interview takeaway:</b> "Owners get focused lists with last-use data, decide keep or remove, and I action the removals and evidence them. I chase overdue reviews." Click Next.',

DP('3.5',{cards:[['Worked example: path AC_STD','Process: access request. Path AC_STD has four stages. Stage 1, line manager, always. Stage 2, role owner, always. Stage 3, risk owner, only if risk analysis found a conflict (BRF+ rule). Stage 4, security, provisioning. A clean request for a display role goes manager, role owner, security in a day. A request that creates a high risk also waits for the risk owner, with escalation after three days.'],['Common mistakes','Too many approval stages, so users bypass the system. Agents who are individuals instead of groups, which stalls on leave. No escalation. Not testing each route. Rules that nobody can explain.']],
 say:{1:GW,2:'The path lists the stages. Each has an <b>agent</b> who approves and a <b>rule</b> that decides when it runs. Click stage 2 to see how a stage is set.',3:'The risk-owner stage runs only when risk analysis finds something, decided by a BRF+ rule. Clean requests skip it, which avoids bottlenecks.'},
 outro:'<b>Interview takeaway:</b> "MSMP is process, path, stage, agent and rule. Rules route by risk, I add escalation, and I test every route before go-live." Click Next.',
 tasks:[mq('Clean requests should:',['Skip the risk owner stage','Always wait for it','Be rejected'],0,'Avoid bottlenecks, add control only where risk exists.'),mq('A stage has:',['An agent and a rule','Only a name','A password'],0,'Who approves and when.'),mq('An agent is one named person who goes on leave. Better design?',['A group or delegate','Skip the stage','Remove the stage'],0,'Use groups and delegation.'),mq('Before go-live you:',['Test every route','Skip testing','Delete rules'],0,'Clean, with risk, firefighter.'),mq('Where are routing rules built?',['BRF+','SU01','STMS'],0,'BRF+ decides which path or stage applies.')],

DP('3.6',{cards:[['Worked example: THORN_QA','The connector THORN_QA shows status Error and last sync on 10 November. The job log says the role import failed: RFC user locked. Result: GRC data for the quality system is two weeks old, so analysis misses new conflicts. Fix: unlock the RFC user and set a non-expiring password under control, test the connection, rerun the role import and user sync, confirm the logs are clean, and add alerts for job failures.'],['Common mistakes','Treating sync failure as "just technical". Using a named person as the RFC user, so the connection breaks when they leave. No monitoring. Fixing one connector without checking the others.']],
 say:{1:'<b>SPRO</b> is the configuration entry point. The GRC integration framework holds the connectors. Type SPRO and press Enter.',2:'The list shows each connector, its system, status and last sync. THORN_QA shows an error since 10 November. Click it.',3:'The job log says the RFC user is locked, so no data has been synchronised. Unlock or replace it, then click Test connection.'},
 outro:'<b>Interview takeaway:</b> "Stale GRC data means unreliable analysis. I check the connector and sync job logs, fix the RFC user, test, rerun the jobs and monitor failures." Click Next.',
 tasks:[mq('The job log says RFC user locked. Result?',['GRC data is stale','Nothing','Faster analysis'],0,'No sync means analysis runs on old data.'),mq('First action?',['Unlock or replace the user, then test','Delete the connector','Ignore it'],0,'Fix, test, rerun the jobs.'),mq('How do you catch this early?',['Monitor job logs and alert','Wait for users','Yearly check'],0,'Alerting avoids weeks of stale data.'),mq('Best type of RFC user?',['A technical user under control','A named person','SAP_ALL for everyone'],0,'Persistent and least privilege.'),mq('Why is it a security matter?',['Missed conflicts and wrong evidence','It is not','Only speed'],0,'Reports then give false assurance.')],

DP('4.1',{cards:[['Worked example: trimming the clerk\'s catalog','The AP clerk role carries catalog Z_FI_BC_ALL_APPS with 184 apps. The clerk really uses six: invoice entry, vendor line items, payment status and three reports. You create SAP-based catalog Z_FI_BC_AP_CLERK with those six, assign it with an AP space and page, remove the broad catalog, and test as the clerk. The backend objects already limit the company code. Result: 178 fewer apps to review and fewer SoD conflicts.'],['Common mistakes','Believing that a hidden tile is secure. Assigning one giant catalog "so users can find things". Forgetting the service authorization (S_SERVICE) when adding a custom app. Not testing as a real user after changing the catalog.']],
 say:{1:'<b>/UI2/FLPD_CUST is the Fiori launchpad content tool.</b> Catalogs, spaces and pages are maintained here. Type it and press Enter.',2:'Each catalog is assigned to a role. The clerk has two small ones and one very broad one. Click the broad catalog.',3:'184 apps, six used. Everything else is access with no business need. Replace it with a small catalog and test. Remember that hiding tiles is not security, because the backend still decides.'},
 outro:'<b>Interview takeaway:</b> "Catalogs and spaces decide what users see. Service authorization and backend objects decide what they can do. I keep catalogs small and task based and always test as a real user." Click Next.',
 tasks:[mq('Hiding a tile means:',['Not security','Access is removed','Faster'],0,'The app can still be started through its service or link unless authorization stops it.'),mq('Best catalog design?',['Small, task-based','One giant catalog','No catalog'],0,'Small catalogs are easy to review and assign.'),mq('Who enforces data access in the end?',['Backend authorization','The tile','The browser'],0,'Backend objects are checked on every call.'),mq('A custom OData service is added to an app. What else is needed?',['The service authorization in the role','Nothing','A new client'],0,'Without S_SERVICE the user gets a 403.'),mq('A clerk reports a missing tile. Likely cause?',['Catalog or space not assigned','The server is down','A password'],0,'Missing tile points to the front end, an error after clicking points to the back end.')],
 quiz:[qz('A catalog contains:',['Apps','Passwords','Jobs'],0,'Apps and tiles.'),qz('A space holds:',['Pages','Users','Tables'],0,'Layout.'),qz('Roles assign:',['Catalogs','Browsers','Printers'],0,'Via the menu.'),qz('Backend objects still:',['Decide access','Are ignored','Are deleted'],0,'Always checked.'),qz('The content tool is:',['/UI2/FLPD_CUST','SU01','STMS'],0,'Launchpad content tool.'),qz('A small catalog reduces:',['Review effort and risk','Speed','Users'],0,'Less to review.')]});
DP('4.2',{cards:[['Worked example: payment app 403','AHUGHES opens the payments app and sees an error. The tile is there, so the catalog is fine. /IWFND/ERROR_LOG shows API_PAYMENT, 403 and a missing S_SERVICE check. SU53 shows no backend failure yet because the call never got that far. Fix: add the service to the role through the approved route, check it does not create a conflict (she should not be able to release payments), test and transport.'],['Common mistakes','Changing the role before checking if the user should have the access. Looking only at SU53 for a Fiori error. Granting a broad role "to see if it works". Forgetting to clear caches or refresh after the change.']],
 say:{1:'<b>/IWFND/ERROR_LOG is the gateway error log.</b> It lists failed OData service calls. Type it and press Enter.',2:'Each row is a failed call with time, service, user and error. Click the failing payment call.',3:'The detail names the missing service authorization. Fix through the approved route, never with a broad role.'},
 outro:'<b>Interview takeaway:</b> "Front end or back end first. Missing tile means catalog or space. A tile with an error means service or backend authorization. I use the gateway error log and SU53 or a trace, then fix through approval." Click Next.',
 tasks:[mq('403 on one app only. Likely cause?',['Missing service or backend authorization','Server down','Network cable'],0,'It is a permissions problem, not availability.'),mq('Which log shows gateway errors?',['/IWFND/ERROR_LOG','SM37','SE16N'],0,'Gateway error log.'),mq('Before changing the role:',['Check approval and SoD','Add SAP_ALL','Skip'],0,'Never fix by widening beyond need.'),mq('The tile does not appear at all. Where do you look?',['Catalog and space assignment','The error log first','The database'],0,'The front-end layer controls visibility.'),mq('SU53 shows nothing for a Fiori error. Next tool?',['Authorization trace','Reboot','Delete user'],0,'Trace records all checks including service calls.')],

DP('4.3',{cards:[['Worked example: vendors become business partners','In ECC a vendor clerk used XK01 and the role had F_LFA1_APP. In S/4HANA vendors are created through BP, with business partner authorization objects (B_BUPA_RLT, B_BUPA_GRP). The simplification item check lists this. You rebuild the roles, update the SoD function "vendor master maintenance" to include BP, and rerun the analysis. Without the update, a user with BP and payment release looks clean.'],['Common mistakes','Migrating roles unchanged and expecting them to work. Forgetting the SoD ruleset. Not reading the simplification list for security-relevant items. Assuming Fiori means roles are no longer needed.']],
 say:{1:'<b>SYCM is the simplification item catalog.</b> It lists what changed in S/4HANA and how. Type SYCM and press Enter.',2:'Each row is a change with its security effect. Click the Business Partner item.',3:'Vendors and customers are now business partners. Roles using XK01 and FD01 must be rebuilt with BP, and the SoD rules updated, or conflicts through the new transaction go undetected.'},
 outro:'<b>Interview takeaway:</b> "I read the simplification list for security impact, rebuild affected roles, update the SoD ruleset with the new actions and retest." Click Next.',
 tasks:[mq('XK01 in an ECC role. In S/4HANA?',['Replace with BP','Keep','Delete the user'],0,'Business Partner replaces separate vendor transactions.'),mq('SoD rules need:',['Updating for new actions','Nothing','Deleting'],0,'Otherwise conflicts via BP are invisible.'),mq('Fiori needs:',['Catalogs','Nothing','Printers'],0,'Apps need catalogs and services.'),mq('Where do you find what changed?',['Simplification list','SU01','SM37'],0,'It documents each changed area.'),mq('A migrated role is not rebuilt. Likely result?',['No authorization or wrong access','Nothing','Faster logon'],0,'Old objects no longer match the new transactions.')],

DP('4.4',{cards:[['Worked example: a restricted business role','BR_AP_ACCOUNTANT combines the business catalogs for payables and reporting. The restriction type is company code, limited to 1000. The user can do the AP job in Thornfield\'s main company and nothing else. BR_FIN_ALL, in contrast, combines all finance catalogs with no restriction: it grants every finance app in every company code. You replace it with narrower roles and add restrictions, then test with a test user.'],['Common mistakes','Looking for PFCG in public cloud. Choosing a catalog because the name sounds right without reading its content. Leaving restriction types empty. Assuming SAP-delivered business roles fit without review.']],
 say:{1:'In public cloud there is no PFCG. '+GW.replace('GRC is reached through the NetWeaver Business Client.','The identity and access management apps hold business roles.').replace('open the GRC work centre','open the IAM apps (simulated)'),2:'The list shows business roles, their catalogs and restrictions. Click the role with no restriction.',3:'No restriction means all company codes and all finance apps. Narrow it: smaller catalogs plus a restriction type such as company code 1000.'},
 outro:'<b>Interview takeaway:</b> "In public cloud, access is business roles, catalogs and restriction types in the IAM apps. I choose the smallest catalogs, add restrictions, review SoD (for example with IAG) and test." Click Next.',

DP('4.5',{cards:[['Worked example: the comparison list','For role Z_FI_AP_CLERK the comparison shows: XK01 replaced by BP (replace), FB60 still exists and now also has a Fiori app (keep and add the app), MB51 unchanged (keep). You swap XK01 for BP, add the app to the catalog, regenerate the profile, and use the chance to remove two transactions nobody used in 12 months. SoD is rerun: BP now appears in the vendor function.'],['Common mistakes','Migrating roles one by one by hand with no comparison. Not cleaning up while migrating. Skipping the SoD rerun. Forgetting that Fiori apps are separate from transactions and need catalogs.']],
 say:{1:'<b>SU25 and the role comparison tools</b> show how ECC roles map to S/4HANA. Type SU25 and press Enter.',2:'Each row is a transaction in the old role, its S/4 replacement and the action to take. Click the replaced transaction XK01.',3:'XK01 is replaced by BP. Add BP, remove XK01, regenerate the profile, rerun SoD and test with a real user.'},

DP('4.6',{cards:[['Worked example: UAT matrix and hypercare','In UAT the treasury role fails: PMURPHY cannot run the payment proposal because a payment object is missing. It is fixed and retested before go-live. After go-live, day 1 and day 2 both show "no authorization for F110" for different users: a pattern, not two cases. Fix the role once, record it in the hypercare log, and report the trend to the steering group.'],['Common mistakes','Testing roles with test users who have SAP_ALL. No role freeze, so untested changes reach production. Closing hypercare issues by giving the user a one-off role. Not trending issues.']],
 say:{1:'The matrix records each role, tester, result and defect. Click the failed test.',2:'The failure and the hypercare log show the same kind of issue repeating. A pattern means a role design gap, so fix the role once rather than patch users.'},
 outro:'<b>Interview takeaway:</b> "I test roles by job with real testers, freeze role changes before cutover, and in hypercare I log and trend issues so I fix the role, not the user." Click Next.',
 tasks:[mq('Same issue for many users means:',['A role design gap','Bad luck','User error'],0,'Fix the role once.'),mq('Before cutover:',['Freeze role changes','Change freely','Delete'],0,'The tested design must be the live design.'),mq('Hypercare issues should be:',['Logged and trended','Ignored','Hidden'],0,'Patterns reveal design gaps.'),mq('Why not test with admin users?',['They hide authorization gaps','They are slow','Auditors forbid it'],0,'A user with SAP_ALL would never see a missing object.'),mq('An emergency role change after freeze needs:',['Approval and evidence','Nothing','A password'],0,'Governed, even when urgent.')],

DP('4.7',{cards:[['Worked example: structuring the answer','Situation: "I changed a role in production to fix an urgent user issue without a transport." Action: "I told my manager the same day, restored the role from development, raised a proper change and tested it." Result: "No data impact, and the correct change was in place within a day." Lesson: "I added an alert on direct role changes so it cannot happen quietly again." Under a minute, honest, ends on prevention.'],['Common mistakes','Choosing a trivial mistake. Blaming the process or others. Hiding the impact. Ending without the lesson. Telling a story that makes you look careless with no recovery.']],
 tasks:[mq('Best opening?',['Own it clearly','Blame others','Say none ever'],0,'Honest ownership builds trust.'),mq('Strong answers include:',['The lesson and prevention','Excuses','Long delays'],0,'Show you improved the system.'),mq('Choose a mistake that is:',['Real but recoverable','Trivial','Catastrophic and unresolved'],0,'It must show judgement and recovery.'),mq('When did you report it?',['As early as possible','After it was found','Never'],0,'Early reporting is the point of the story.'),mq('Use:',['Your real story','A script','A made-up one'],0,'Follow-up questions expose invented stories.')],

DP('5.1',{cards:[['Worked example: BTP cockpit login','The BTP cockpit accepts local passwords and MFA is off. A leaver\'s local account would still work after the corporate directory disables them. Fix: switch the application to trust the corporate IdP through IAS, enforce MFA, and use IPS so leavers lose access automatically when HR ends the record. Result: one identity, one policy, nothing to forget.'],['Common mistakes','Mixing up IAS (login) and IPS (provisioning). Leaving local admin accounts. MFA optional "for convenience". Provisioning users manually in each system.']],
 say:{1:'The applications list shows each app\'s trust, authentication and MFA setting. Click the application with no MFA.',2:'Local passwords and no MFA is a weakness. Trust the corporate identity provider, enforce MFA, and let IPS provision users so leavers disappear automatically.'},
 outro:'<b>Interview takeaway:</b> "IAS authenticates through the corporate IdP with SSO and MFA, IPS provisions and removes users automatically. I remove local passwords." Click Next.',
 tasks:[mq('IPS does:',['Provisioning','Passwords only','Printing'],0,'It creates, changes and deletes users in target systems.'),mq('Local passwords are:',['A weakness','Best','Required'],0,'Use the corporate identity provider.'),mq('MFA should be:',['Enforced','Optional','Off'],0,'A stolen password alone should not be enough.'),mq('A leaver is disabled in the directory. What should happen?',['Access disappears everywhere automatically','Nothing','They keep using local accounts'],0,'That is the purpose of central identity.'),mq('SSO means:',['One login for many apps','No passwords at all','Shared passwords'],0,'The user signs in once.')],
