fighter) design and log review?", "t": "mcq", "o": ["Add custom transactions", "Firefighter ID, firefighter, controller", "SU24 and Fiori content"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Emergency access (firefighter) design and log review", "prompt": "How do you design and control emergency access in SAP, and how do you review what was done with it?", "model": "Emergency access lets a trusted person fix a production problem with powerful access when no normal role allows it. In GRC Emergency Access Management I create firefighter IDs for defined purposes, assign firefighters and an independent controller, and set a limited validity period. The firefighter logs in with the ID and must enter a reason. The session is recorded, including the transactions, and the changes. The controller receives the log, reviews it and signs off in the system. I check that the work matches the reason and the ticket, and I escalate anything unusual. Firefighter IDs are not used for regular work. I report on how often they are used, by whom, and on any that are not reviewed on time.", "pts": ["Controlled, not banned", "Firefighter ID, firefighter, controller", "Reason and recorded session", "Independent log review", "Reporting on use and overdue reviews"]}], "quiz": [{"q": "Which is a key point for: Emergency access (firefighter) design and log review?", "o": ["Assess acquired landscape", "Quarterly review", "Controlled, not banned"], "a": 2, "e": "Correct key point: Controlled, not banned."}, {"q": "Which is a key point for: Emergency access (firefighter) design and log review?", "o": ["Target tied to business risk", "Impact and likelihood", "Firefighter ID, firefighter, controller"], "a": 2, "e": "Correct key point: Firefighter ID, firefighter, controller."}, {"q": "Which is a key point for: Emergency access (firefighter) design and log review?", "o": ["Sign-off", "Reason and recorded session", "Population completeness"], "a": 1, "e": "Correct key point: Reason and recorded session."}], "scr": "EAM firefighter log", "qs": [12]}, {"id": "3.4", "wk": "Week 3: Access lifecycle", "title": "Periodic access reviews", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you run a periodic user access review, and what makes it effective rather than just a rubber stamp?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A clear process with owners and dates.<br><b>Hiring manager:</b> That reviewers can actually understand what they are reviewing and that removals really happen, because auditors test for follow-through.<br><b>Supervisor:</b> The practical set-up: who gets the review, how roles are described, how rejections are executed, and the evidence."}, {"h": "The best answer", "p": "<b>Scope:</b> I decide the scope: all users, or only those with critical access or conflicts, and which systems.<br><b>Make it readable:</b> Reviewers see a plain description of each role, not a technical name. I use the business role descriptions and flag high-risk roles.<br><b>Run it:</b> In GRC User Access Review, or a controlled report, managers and role owners confirm or reject. I set a deadline and follow up with reminders and escalation.<br><b>Follow-through:</b> Rejected access is removed by a tracked request. I confirm removal and report the completion rate.<br><b>Evidence:</b> I keep the review population, the sign-offs and the removal proof. I check that the population is complete, which is the point auditors test first."}], "why": "That reviewers can actually understand what they are reviewing and that removals really happen, because auditors test for follow-through.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Periodic user access and SoD reviews?", "t": "mcq", "o": ["Scope and complete population", "Failed controls raise risk", "Service levels and dashboard"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Periodic user access and SoD reviews?", "t": "mcq", "o": ["Readable role descriptions", "Remove temporary access", "Roles move by transport"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Periodic user access and SoD reviews", "prompt": "How do you run a periodic user access review, and what makes it effective rather than just a rubber stamp?", "model": "I decide the scope: all users, or only those with critical access or conflicts, and which systems. Reviewers see a plain description of each role, not a technical name. I use the business role descriptions and flag high-risk roles. In GRC User Access Review, or a controlled report, managers and role owners confirm or reject. I set a deadline and follow up with reminders and escalation. Rejected access is removed by a tracked request. I confirm removal and report the completion rate. I keep the review population, the sign-offs and the removal proof. I check that the population is complete, which is the point auditors test first.", "pts": ["Scope and complete population", "Readable role descriptions", "Deadlines and escalation", "Rejections executed and confirmed", "Evidence retained"]}], "quiz": [{"q": "Which is a key point for: Periodic user access and SoD reviews?", "o": ["Destinations and APIs", "MSMP routing", "Scope and complete population"], "a": 2, "e": "Correct key point: Scope and complete population."}, {"q": "Which is a key point for: Periodic user access and SoD reviews?", "o": ["Readable role descriptions", "SU01 and SU10", "Inventory custom transactions"], "a": 0, "e": "Correct key point: Readable role descriptions."}, {"q": "Which is a key point for: Periodic user access and SoD reviews?", "o": ["Tune the ruleset", "Deadlines and escalation", "Remove first"], "a": 1, "e": "Correct key point: Deadlines and escalation."}], "scr": "GRC user access review", "qs": [13]}, {"id": "3.5", "wk": "Week 3: Access lifecycle", "title": "MSMP workflow configuration", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain how you would configure an MSMP workflow for access requests.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know the pieces: path, stage, agent and rule.<br><b>Hiring manager:</b> That you align approvals with the company's authority structure and do not create bottlenecks.<br><b>Supervisor:</b> Configuration steps: process IDs, paths, stages, initiators, rules (BRF+), agents, notifications, testing."}, {"h": "The best answer", "p": "<b>Plan:</b> I map the approval chain with the business: manager, role owner, risk owner and any security stage.<br><b>Build:</b> In MSMP I define the process, the path and stages with the right agents and the BRF+ rules that decide the route.<br><b>Conditions:</b> For example, requests with conflicts go to the risk owner, and requests for firefighter IDs to the controller.<br><b>Notifications and escalation:</b> I set notifications, reminders and escalation if no response.<br><b>Test:</b> I test each path with sample users, including rejection and change of roles."}], "why": "That you align approvals with the company's authority structure and do not create bottlenecks.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: MSMP workflow configuration?", "t": "mcq", "o": ["Risks linked to controls", "Mentoring and rotation", "Process, path, stage, agent"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: MSMP workflow configuration?", "t": "mcq", "o": ["Roles and role collections", "HANA privileges", "BRF+ rules"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "MSMP workflow configuration", "prompt": "Explain how you would configure an MSMP workflow for access requests.", "model": "I map the approval chain with the business: manager, role owner, risk owner and any security stage. In MSMP I define the process, the path and stages with the right agents and the BRF+ rules that decide the route. For example, requests with conflicts go to the risk owner, and requests for firefighter IDs to the controller. I set notifications, reminders and escalation if no response. I test each path with sample users, including rejection and change of roles.", "pts": ["Process, path, stage, agent", "BRF+ rules", "Route by risk and type", "Reminders and escalation", "Test every path"]}], "quiz": [{"q": "Which is a key point for: MSMP workflow configuration?", "o": ["Privacy compliance", "Assess current state", "Process, path, stage, agent"], "a": 2, "e": "Correct key point: Process, path, stage, agent."}, {"q": "Which is a key point for: MSMP workflow configuration?", "o": ["Work with Basis", "BRF+ rules", "Landscape direction"], "a": 1, "e": "Correct key point: BRF+ rules."}, {"q": "Which is a key point for: MSMP workflow configuration?", "o": ["Least privilege for vendors", "Prevent drift", "Route by risk and type"], "a": 2, "e": "Correct key point: Route by risk and type."}], "scr": "MSMP path and stage", "qs": [27]}, {"id": "3.6", "wk": "Week 3: Access lifecycle", "title": "Backend connectors and sync jobs", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you connect GRC to backend systems and keep the data accurate?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you have hands-on GRC setup experience.<br><b>Hiring manager:</b> That the data feeding the risk analysis is complete and current, so reports can be trusted.<br><b>Supervisor:</b> Detail: RFC connectors, connector groups, logical systems, background jobs for repository sync, and troubleshooting."}, {"h": "The best answer", "p": "<b>Connectors:</b> I create the RFC connections and map each to a logical system in the GRC integration scenarios, with a service user that has minimum rights.<br><b>Groups:</b> I define connector groups for each application and the right connection type.<br><b>Synchronization:</b> Background jobs sync users, roles and authorizations to the GRC repository, plus the action usage.<br><b>Monitoring:</b> I check job logs for failures and reconcile record counts to the backend.<br><b>Security:</b> The RFC users are tightly controlled, since they can read all access data."}], "why": "That the data feeding the risk analysis is complete and current, so reports can be trusted.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Backend connectors and synchronization jobs?", "t": "mcq", "o": ["Audit findings aging", "Track to closure", "RFC and logical systems"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Backend connectors and synchronization jobs?", "t": "mcq", "o": ["Backups and runbooks", "Check indicators and defaults", "Connector groups"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Backend connectors and synchronization jobs", "prompt": "How do you connect GRC to backend systems and keep the data accurate?", "model": "I create the RFC connections and map each to a logical system in the GRC integration scenarios, with a service user that has minimum rights. I define connector groups for each application and the right connection type. Background jobs sync users, roles and authorizations to the GRC repository, plus the action usage. I check job logs for failures and reconcile record counts to the backend. The RFC users are tightly controlled, since they can read all access data.", "pts": ["RFC and logical systems", "Connector groups", "Scheduled synchronization jobs", "Reconcile and monitor", "Secure the service accounts"]}], "quiz": [{"q": "Which is a key point for: Backend connectors and synchronization jobs?", "o": ["No permanent SAP_ALL in production", "RFC and logical systems", "Clearance and need-to-know"], "a": 1, "e": "Correct key point: RFC and logical systems."}, {"q": "Which is a key point for: Backend connectors and synchronization jobs?", "o": ["Design rules", "Connector groups", "Skills map"], "a": 1, "e": "Correct key point: Connector groups."}, {"q": "Which is a key point for: Backend connectors and synchronization jobs?", "o": ["Scheduled synchronization jobs", "Specific situation", "HANA privileges"], "a": 0, "e": "Correct key point: Scheduled synchronization jobs."}], "scr": "Connector setup, job log", "qs": [26]}, {"id": "4.1", "wk": "Week 4: Fiori and S/4HANA", "title": "Fiori security: catalogs, spaces, pages", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain how security works for SAP Fiori. How do catalogs, groups, spaces, pages and roles fit together?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can describe it simply: what the user sees and what lets them in.<br><b>Hiring manager:</b> That you understand a tile is not security. The backend authorizations must also be in place, and the design has to be maintainable.<br><b>Supervisor:</b> The objects: business catalogs, groups, spaces and pages, PFCG menu, S_SERVICE, OData and the launchpad."}, {"h": "The best answer", "p": "<b>What the user sees:</b> The launchpad shows tiles. In the newer design, business catalogs hold the apps, and spaces and pages organize what appears on the home screen. The older design uses catalogs and groups.<br><b>What lets them in:</b> Roles carry the catalogs and spaces. A tile is only the entry point, so the user also needs the authorizations for the OData service (S_SERVICE) and for the business objects behind it.<br><b>Roles:</b> In PFCG the Fiori content is added to the role through the menu, with the catalog and space or page, and the backend authorizations are maintained from SU24.<br><b>Design:</b> I build business roles around jobs, reuse the SAP standard catalogs where possible, and clone only when needed, to keep upgrades simple.<br><b>Testing:</b> I test with a user who has only the role. A visible tile that returns an error usually means missing backend authorization or an inactive service."}], "why": "That you understand a tile is not security. The backend authorizations must also be in place, and the design has to be maintainable.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Fiori security: catalogs, groups, spaces and pages?", "t": "mcq", "o": ["Catalog holds apps; space and page lay out", "Sampling and root cause", "Issues with owners"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Fiori security: catalogs, groups, spaces and pages?", "t": "mcq", "o": ["Links to controls", "Gap register", "Tile is not security"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Fiori security: catalogs, groups, spaces and pages", "prompt": "Explain how security works for SAP Fiori. How do catalogs, groups, spaces, pages and roles fit together?", "model": "The launchpad shows tiles. In the newer design, business catalogs hold the apps, and spaces and pages organize what appears on the home screen. The older design uses catalogs and groups. Roles carry the catalogs and spaces. A tile is only the entry point, so the user also needs the authorizations for the OData service (S_SERVICE) and for the business objects behind it. In PFCG the Fiori content is added to the role through the menu, with the catalog and space or page, and the backend authorizations are maintained from SU24. I build business roles around jobs, reuse the SAP standard catalogs where possible, and clone only when needed, to keep upgrades simple. I test with a user who has only the role. A visible tile that returns an error usually means missing backend authorization or an inactive service.", "pts": ["Catalog holds apps; space and page lay out", "Tile is not security", "S_SERVICE and backend objects", "PFCG menu and SU24", "Test with a real role-only user"]}], "quiz": [{"q": "Which is a key point for: Fiori security: catalogs, groups, spaces and pages?", "o": ["Remove temporary access", "Mitigation option at approval", "Catalog holds apps; space and page lay out"], "a": 2, "e": "Correct key point: Catalog holds apps; space and page lay out."}, {"q": "Which is a key point for: Fiori security: catalogs, groups, spaces and pages?", "o": ["Quarterly review", "Tile is not security", "Same capabilities, different delivery"], "a": 1, "e": "Correct key point: Tile is not security."}, {"q": "Which is a key point for: Fiori security: catalogs, groups, spaces and pages?", "o": ["S_SERVICE and backend objects", "Remove or mitigate with evidence", "Verify every request"], "a": 0, "e": "Correct key point: S_SERVICE and backend objects."}], "scr": "Launchpad designer, PFCG menu", "qs": [14]}, {"id": "4.2", "wk": "Week 4: Fiori and S/4HANA", "title": "Fiori troubleshooting", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>A user cannot see a Fiori tile, or the app opens but shows an error. How do you troubleshoot?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A calm, ordered checklist.<br><b>Hiring manager:</b> That you separate a content problem (the tile) from an authorization problem (the service) and a system problem (the service is inactive), so you fix the cause.<br><b>Supervisor:</b> Tools and order: role content, launchpad checks, /IWFND/ERROR_LOG, STAUTHTRACE, service activation in /IWFND/MAINT_SERVICE."}, {"h": "The best answer", "p": "<b>Tile missing:</b> I check the role has the catalog and space or page, the role is assigned and the user has re-logged in or the cache is refreshed. I check the launchpad content in the designer.<br><b>App errors:</b> I look at the gateway error log (/IWFND/ERROR_LOG) and the front-end error, then run an authorization trace for the user.<br><b>Service:</b> I confirm the OData service is active and the user has S_SERVICE for it.<br><b>Backend:</b> The trace shows the missing backend object. I add it in the role through SU24 and test.<br><b>Close out:</b> I document the cause so the role design is corrected, not patched for one user."}], "why": "That you separate a content problem (the tile) from an authorization problem (the service) and a system problem (the service is inactive), so you fix the cause.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Fiori troubleshooting: a missing tile or failing app?", "t": "mcq", "o": ["Self-assessment and testing", "Separate tile, service and backend", "Identify, assess, respond, monitor"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Fiori troubleshooting: a missing tile or failing app?", "t": "mcq", "o": ["Reconcile HR list with SAP users", "Start small", "Role content and refresh"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Fiori troubleshooting: a missing tile or failing app", "prompt": "A user cannot see a Fiori tile, or the app opens but shows an error. How do you troubleshoot?", "model": "I check the role has the catalog and space or page, the role is assigned and the user has re-logged in or the cache is refreshed. I check the launchpad content in the designer. I look at the gateway error log (/IWFND/ERROR_LOG) and the front-end error, then run an authorization trace for the user. I confirm the OData service is active and the user has S_SERVICE for it. The trace shows the missing backend object. I add it in the role through SU24 and test. I document the cause so the role design is corrected, not patched for one user.", "pts": ["Separate tile, service and backend", "Role content and refresh", "/IWFND/ERROR_LOG and trace", "S_SERVICE and active service", "Fix the role design"]}], "quiz": [{"q": "Which is a key point for: Fiori troubleshooting: a missing tile or failing app?", "o": ["Separate tile, service and backend", "Quantified savings", "Secure RFC and APIs"], "a": 0, "e": "Correct key point: Separate tile, service and backend."}, {"q": "Which is a key point for: Fiori troubleshooting: a missing tile or failing app?", "o": ["Options with trade-offs", "Fix the highest risk first", "Role content and refresh"], "a": 2, "e": "Correct key point: Role content and refresh."}, {"q": "Which is a key point for: Fiori troubleshooting: a missing tile or failing app?", "o": ["/IWFND/ERROR_LOG and trace", "Reconcile and monitor", "Validate before reacting"], "a": 0, "e": "Correct key point: /IWFND/ERROR_LOG and trace."}], "scr": "Launchpad, /IWFND/ERROR_LOG", "qs": [15]}, {"id": "4.3", "wk": "Week 4: Fiori and S/4HANA", "title": "S/4HANA versus ECC security", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What changes in security when a company moves from ECC to S/4HANA?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know the main differences and can state them briefly.<br><b>Hiring manager:</b> That you see security as part of the program plan, with role changes, simplification effects and new risks identified early.<br><b>Supervisor:</b> Specifics: Fiori apps replacing transactions, SU24 and simplification items, role redesign, new objects and the Business Partner model."}, {"h": "The best answer", "p": "<b>User experience:</b> Users move from SAP GUI transactions to Fiori apps, so roles must include Fiori content, and many transactions are replaced or simplified.<br><b>Role redesign:</b> Role content has to be reworked using the simplification list and the S/4 SU24 proposals. A straight copy of ECC roles usually leaves gaps or extra access.<br><b>Data model changes:</b> Customer and vendor become Business Partner, and some objects are consolidated, which changes the authorization checks.<br><b>Database:</b> HANA brings database-level users and privileges that need their own controls.<br><b>Approach:</b> I assess the roles early, redesign by job, test with real users and run a risk analysis on the new roles before go-live."}], "why": "That you see security as part of the program plan, with role changes, simplification effects and new risks identified early.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: S/4HANA security versus ECC?", "t": "mcq", "o": ["Prevent drift", "Fiori replaces many transactions", "Baseline metrics"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: S/4HANA security versus ECC?", "t": "mcq", "o": ["Check for authorization checks in code", "Role rework, not copy", "Admin review"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "S/4HANA security versus ECC", "prompt": "What changes in security when a company moves from ECC to S/4HANA?", "model": "Users move from SAP GUI transactions to Fiori apps, so roles must include Fiori content, and many transactions are replaced or simplified. Role content has to be reworked using the simplification list and the S/4 SU24 proposals. A straight copy of ECC roles usually leaves gaps or extra access. Customer and vendor become Business Partner, and some objects are consolidated, which changes the authorization checks. HANA brings database-level users and privileges that need their own controls. I assess the roles early, redesign by job, test with real users and run a risk analysis on the new roles before go-live.", "pts": ["Fiori replaces many transactions", "Role rework, not copy", "Business Partner changes", "HANA privileges", "Early assessment and SoD check"]}], "quiz": [{"q": "Which is a key point for: S/4HANA security versus ECC?", "o": ["Object = template, field = value, role = instance", "Fiori replaces many transactions", "Feature comparison"], "a": 1, "e": "Correct key point: Fiori replaces many transactions."}, {"q": "Which is a key point for: S/4HANA security versus ECC?", "o": ["Assess current state", "Owner, expiry and testing", "Role rework, not copy"], "a": 2, "e": "Correct key point: Role rework, not copy."}, {"q": "Which is a key point for: S/4HANA security versus ECC?", "o": ["Business Partner changes", "Specific situation", "Negative tests"], "a": 0, "e": "Correct key point: Business Partner changes."}], "scr": "Simplification list view", "qs": [16]}, {"id": "4.4", "wk": "Week 4: Fiori and S/4HANA", "title": "S/4HANA public cloud roles", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How does security work in S/4HANA Cloud Public Edition?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you understand the model is different from the classic on-premise approach.<br><b>Hiring manager:</b> That you can adapt to a standard model, with less custom coding and more reliance on delivered content.<br><b>Supervisor:</b> Detail: business users, business roles and catalogs, restrictions, IAM apps, and extensibility."}, {"h": "The best answer", "p": "<b>Model:</b> Access is based on business users and business roles built from business catalogs. There is no PFCG or SU01 as in on-premise.<br><b>Restrictions:</b> Roles are restricted by write, read and value restrictions, for example by company code.<br><b>IAM apps:</b> Administrators use IAM apps in Fiori to maintain business users, roles and restrictions.<br><b>Design:</b> I start from the SAP delivered business roles, adjust restrictions, and keep custom catalogs to a minimum.<br><b>Control:</b> I still run access reviews and risk analysis, using the cloud tooling."}], "why": "That you can adapt to a standard model, with less custom coding and more reliance on delivered content.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: S/4HANA public cloud: business roles and IAM?", "t": "mcq", "o": ["Business users, roles, catalogs", "Maintain the mapping", "SYSTEM user locked"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: S/4HANA public cloud: business roles and IAM?", "t": "mcq", "o": ["Automatic provisioning by connector", "Single coordinator", "Restrictions by value"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "S/4HANA public cloud: business roles and IAM", "prompt": "How does security work in S/4HANA Cloud Public Edition?", "model": "Access is based on business users and business roles built from business catalogs. There is no PFCG or SU01 as in on-premise. Roles are restricted by write, read and value restrictions, for example by company code. Administrators use IAM apps in Fiori to maintain business users, roles and restrictions. I start from the SAP delivered business roles, adjust restrictions, and keep custom catalogs to a minimum. I still run access reviews and risk analysis, using the cloud tooling.", "pts": ["Business users, roles, catalogs", "Restrictions by value", "IAM apps replace PFCG/SU01", "Use delivered roles", "Reviews and risk analysis still apply"]}], "quiz": [{"q": "Which is a key point for: S/4HANA public cloud: business roles and IAM?", "o": ["Maintain for custom Z transactions", "/IWFND/ERROR_LOG and trace", "Business users, roles, catalogs"], "a": 2, "e": "Correct key point: Business users, roles, catalogs."}, {"q": "Which is a key point for: S/4HANA public cloud: business roles and IAM?", "o": ["Control platform admins", "Root cause", "Restrictions by value"], "a": 2, "e": "Correct key point: Restrictions by value."}, {"q": "Which is a key point for: S/4HANA public cloud: business roles and IAM?", "o": ["Names ACTVT and organizational levels", "Reminders and escalation", "IAM apps replace PFCG/SU01"], "a": 2, "e": "Correct key point: IAM apps replace PFCG/SU01."}], "scr": "IAM apps, business role", "qs": [34]}, {"id": "4.5", "wk": "Week 4: Fiori and S/4HANA", "title": "ECC to S/4 role migration", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you approach security in an ECC to S/4HANA migration?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A phased approach linked to the project timeline.<br><b>Hiring manager:</b> That security is included from the start and that role changes, testing and cutover are planned.<br><b>Supervisor:</b> Detail: simplification list, SU25, role analysis for obsolete transactions, Fiori content, testing and hypercare."}, {"h": "The best answer", "p": "<b>Assess:</b> I analyze current roles against the simplification list to find obsolete or changed transactions.<br><b>Redesign:</b> I adjust roles using the updated SU24 proposals, add Fiori content and rebuild where simpler.<br><b>Test:</b> Security testing uses real users in UAT, with negative tests for what must not be possible.<br><b>Risk:</b> I run risk analysis on the new roles before go-live.<br><b>Cutover and hypercare:</b> I prepare role transports for cutover and staff a hypercare team to fix authorization issues quickly."}], "why": "That security is included from the start and that role changes, testing and cutover are planned.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: ECC to S/4HANA role migration?", "t": "mcq", "o": ["Simplification list review", "Keep the auditor informed", "Regenerate and test"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: ECC to S/4HANA role migration?", "t": "mcq", "o": ["Reviewer summaries", "SU24 and Fiori content", "Written follow-up"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "ECC to S/4HANA role migration", "prompt": "How do you approach security in an ECC to S/4HANA migration?", "model": "I analyze current roles against the simplification list to find obsolete or changed transactions. I adjust roles using the updated SU24 proposals, add Fiori content and rebuild where simpler. Security testing uses real users in UAT, with negative tests for what must not be possible. I run risk analysis on the new roles before go-live. I prepare role transports for cutover and staff a hypercare team to fix authorization issues quickly.", "pts": ["Simplification list review", "SU24 and Fiori content", "UAT with real users", "Risk analysis before go-live", "Hypercare"]}], "quiz": [{"q": "Which is a key point for: ECC to S/4HANA role migration?", "o": ["Human approval", "Offshore restrictions", "Simplification list review"], "a": 2, "e": "Correct key point: Simplification list review."}, {"q": "Which is a key point for: ECC to S/4HANA role migration?", "o": ["SU24 and Fiori content", "Reconcile HR list with SAP users", "Provisioning, removal, review, privileged, SoD"], "a": 0, "e": "Correct key point: SU24 and Fiori content."}, {"q": "Which is a key point for: ECC to S/4HANA role migration?", "o": ["Reason and recorded session", "UAT with real users", "Impact and likelihood"], "a": 1, "e": "Correct key point: UAT with real users."}], "scr": "Role comparison", "qs": [30]}, {"id": "4.6", "wk": "Week 4: Fiori and S/4HANA", "title": "UAT, cutover and hypercare", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you manage security during user acceptance testing, cutover and hypercare?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can support a project through go-live calmly.<br><b>Hiring manager:</b> That you prevent go-live disruption and avoid emergency fixes that create risk.<br><b>Supervisor:</b> Detail: test users by job, negative tests, role freeze, cutover transports, hypercare desk."}, {"h": "The best answer", "p": "<b>UAT:</b> I create test users for each job role, run positive and negative tests and log defects.<br><b>Role freeze:</b> I freeze role changes before go-live, except approved fixes.<br><b>Cutover:</b> Final roles are transported and verified, and users are assigned by the approved matrix.<br><b>Hypercare:</b> I staff a rapid-response team with a fast but controlled process: every fix is logged, approved and risk-checked.<br><b>After:</b> I clean up temporary access and document lessons learned."}], "why": "That you prevent go-live disruption and avoid emergency fixes that create risk.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Security UAT, cutover and hypercare?", "t": "mcq", "o": ["Encryption", "Connector groups", "Test users per job"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Security UAT, cutover and hypercare?", "t": "mcq", "o": ["Govern the trust configuration", "Document for regulators", "Negative tests"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Security UAT, cutover and hypercare", "prompt": "How do you manage security during user acceptance testing, cutover and hypercare?", "model": "I create test users for each job role, run positive and negative tests and log defects. I freeze role changes before go-live, except approved fixes. Final roles are transported and verified, and users are assigned by the approved matrix. I staff a rapid-response team with a fast but controlled process: every fix is logged, approved and risk-checked. I clean up temporary access and document lessons learned.", "pts": ["Test users per job", "Negative tests", "Role freeze", "Controlled hypercare fixes", "Remove temporary access"]}], "quiz": [{"q": "Which is a key point for: Security UAT, cutover and hypercare?", "o": ["Maintain the mapping", "Generic IDs treated as high risk", "Test users per job"], "a": 2, "e": "Correct key point: Test users per job."}, {"q": "Which is a key point for: Security UAT, cutover and hypercare?", "o": ["Negative tests", "Owner, expiry and testing", "Risk analysis before go-live"], "a": 0, "e": "Correct key point: Negative tests."}, {"q": "Which is a key point for: Security UAT, cutover and hypercare?", "o": ["/IWFND/ERROR_LOG and trace", "Enterprise risk versus access risk", "Role freeze"], "a": 2, "e": "Correct key point: Role freeze."}], "scr": "Test matrix, hypercare log", "qs": [39]}, {"id": "4.7", "wk": "Week 4: Fiori and S/4HANA", "title": "Behavioural: a production mistake", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Tell me about a mistake you made in a production security change. How did you handle it?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> Honesty and a calm tone. They want to see you can own an error.<br><b>Hiring manager:</b> That you act fast, tell the right people and fix the process, not hide it.<br><b>Supervisor:</b> What exactly you did to roll back, verify and prevent a repeat."}, {"h": "The best answer", "p": "<b>Situation:</b> I imported a role change that removed a menu entry, and a group of users lost access to a posting transaction during month-end.<br><b>Action:</b> I told my manager and the process owner at once, restored the role through an urgent approved transport and confirmed with affected users.<br><b>Impact:</b> The outage was under two hours and no postings were lost.<br><b>Cause:</b> The change was tested with a single user and not with the full role set.<br><b>Prevention:</b> I added a regression test with sample users per job to our release checklist and avoided imports in close periods."}], "why": "That you act fast, tell the right people and fix the process, not hide it.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: A production security mistake?", "t": "mcq", "o": ["RFC and logical systems", "Fix root cause", "Own the error"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: A production security mistake?", "t": "mcq", "o": ["Tell stakeholders quickly", "Regular reporting", "Options compared"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "A production security mistake", "prompt": "Tell me about a mistake you made in a production security change. How did you handle it?", "model": "I imported a role change that removed a menu entry, and a group of users lost access to a posting transaction during month-end. I told my manager and the process owner at once, restored the role through an urgent approved transport and confirmed with affected users. The outage was under two hours and no postings were lost. The change was tested with a single user and not with the full role set. I added a regression test with sample users per job to our release checklist and avoided imports in close periods.", "pts": ["Own the error", "Tell stakeholders quickly", "Fast fix with approval", "Root cause", "Process improvement"]}], "quiz": [{"q": "Which is a key point for: A production security mistake?", "o": ["SU01 and SU10", "Own the error", "Offered alternatives"], "a": 1, "e": "Correct key point: Own the error."}, {"q": "Which is a key point for: A production security mistake?", "o": ["Mitigation option at approval", "Clear ask", "Tell stakeholders quickly"], "a": 2, "e": "Correct key point: Tell stakeholders quickly."}, {"q": "Which is a key point for: A production security mistake?", "o": ["Fast fix with approval", "Action and permission level analysis", "Business Partner changes"], "a": 0, "e": "Correct key point: Fast fix with approval."}], "scr": "None (story practice)", "qs": [24]}, {"id": "5.1", "wk": "Week 5: Cloud, platform and operations", "title": "Cloud identity: IAS, IPS and SSO", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain how SAP Cloud Identity Services, IAS and IPS, support single sign-on and user provisioning across cloud and on-premise systems.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A short, clear explanation of what each service does.<br><b>Hiring manager:</b> That you understand identity as the front door: central authentication, automated provisioning and fewer standalone passwords.<br><b>Supervisor:</b> Detail: IAS as the identity provider, SAML or OIDC trust, corporate identity provider as a proxy, IPS provisioning, and role assignment."}, {"h": "The best answer", "p": "<b>IAS:</b> Identity Authentication Service handles login and single sign-on. Applications trust it through SAML or OpenID Connect.<br><b>Corporate IdP:</b> IAS can proxy to the company identity provider, so users log in with their corporate credentials.<br><b>IPS:</b> Identity Provisioning Service moves identities and assignments from a source such as the corporate directory to target systems, including SAP cloud applications and on-premise systems.<br><b>Access:</b> Authorizations stay in the target system, assigned by groups or role collections that provisioning can populate.<br><b>Control point:</b> I govern the trust configuration, the provisioning rules and the people who can change them, since they control who can log in."}], "why": "That you understand identity as the front door: central authentication, automated provisioning and fewer standalone passwords.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Cloud identity: IAS, IPS and single sign-on?", "t": "mcq", "o": ["Add to functions and permissions", "Permission-level rules", "IAS authenticates; IPS provisions"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Cloud identity: IAS, IPS and single sign-on?", "t": "mcq", "o": ["Light change process", "Scheduled run, deficiencies", "SAML or OIDC trust"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Cloud identity: IAS, IPS and single sign-on", "prompt": "Explain how SAP Cloud Identity Services, IAS and IPS, support single sign-on and user provisioning across cloud and on-premise systems.", "model": "Identity Authentication Service handles login and single sign-on. Applications trust it through SAML or OpenID Connect. IAS can proxy to the company identity provider, so users log in with their corporate credentials. Identity Provisioning Service moves identities and assignments from a source such as the corporate directory to target systems, including SAP cloud applications and on-premise systems. Authorizations stay in the target system, assigned by groups or role collections that provisioning can populate. I govern the trust configuration, the provisioning rules and the people who can change them, since they control who can log in.", "pts": ["IAS authenticates; IPS provisions", "SAML or OIDC trust", "Proxy to corporate IdP", "Authorizations remain in the target", "Govern the trust configuration"]}], "quiz": [{"q": "Which is a key point for: Cloud identity: IAS, IPS and single sign-on?", "o": ["SUIM reports for review", "IAS authenticates; IPS provisions", "Day-one minimum access"], "a": 1, "e": "Correct key point: IAS authenticates; IPS provisions."}, {"q": "Which is a key point for: Cloud identity: IAS, IPS and single sign-on?", "o": ["SAML or OIDC trust", "Deadlines and escalation", "Separate tile, service and backend"], "a": 0, "e": "Correct key point: SAML or OIDC trust."}, {"q": "Which is a key point for: Cloud identity: IAS, IPS and single sign-on?", "o": ["Firefighter use", "Proxy to corporate IdP", "RFC and logical systems"], "a": 1, "e": "Correct key point: Proxy to corporate IdP."}], "scr": "IAS admin console", "qs": [17]}, {"id": "5.2", "wk": "Week 5: Cloud, platform and operations", "title": "Identity Access Governance (IAG)", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What is SAP Cloud Identity Access Governance, and how does it relate to on-premise GRC?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know it is the cloud version of access governance.<br><b>Hiring manager:</b> That you can help decide where each fits and plan the move.<br><b>Supervisor:</b> Detail: access analysis, access request, role design, privileged access, and integration with IPS and cloud systems."}, {"h": "The best answer", "p": "<b>What it is:</b> IAG is the cloud service for access governance: access analysis, access request, role design, privileged access management and certification.<br><b>Comparison:</b> It covers the same ideas as the on-premise Access Control, delivered as a service, with a different data and configuration approach.<br><b>Integration:</b> It connects to on-premise and cloud systems and can use IPS for identity data.<br><b>Decision:</b> Cloud-first companies or those on RISE tend to move to IAG. Others keep on-premise GRC for now or run both.<br><b>Governance:</b> In either case the principles stay the same: risk check at request, review, emergency access."}], "why": "That you can help decide where each fits and plan the move.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Identity Access Governance (IAG) with IPS?", "t": "mcq", "o": ["Cloud access governance service", "KRIs", "Builder is not approver or importer"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Identity Access Governance (IAG) with IPS?", "t": "mcq", "o": ["Mitigation option at approval", "Same capabilities, different delivery", "Issues with owners"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Identity Access Governance (IAG) with IPS", "prompt": "What is SAP Cloud Identity Access Governance, and how does it relate to on-premise GRC?", "model": "IAG is the cloud service for access governance: access analysis, access request, role design, privileged access management and certification. It covers the same ideas as the on-premise Access Control, delivered as a service, with a different data and configuration approach. It connects to on-premise and cloud systems and can use IPS for identity data. Cloud-first companies or those on RISE tend to move to IAG. Others keep on-premise GRC for now or run both. In either case the principles stay the same: risk check at request, review, emergency access.", "pts": ["Cloud access governance service", "Same capabilities, different delivery", "Integration with IPS", "Choose by landscape", "Same control principles"]}], "quiz": [{"q": "Which is a key point for: Identity Access Governance (IAG) with IPS?", "o": ["Add to functions and permissions", "Names the user types", "Cloud access governance service"], "a": 2, "e": "Correct key point: Cloud access governance service."}, {"q": "Which is a key point for: Identity Access Governance (IAG) with IPS?", "o": ["Assigned in GRC with owner and expiry", "Compares missing values with the role", "Same capabilities, different delivery"], "a": 2, "e": "Correct key point: Same capabilities, different delivery."}, {"q": "Which is a key point for: Identity Access Governance (IAG) with IPS?", "o": ["Restrictions by value", "Start from standard, tailor to business", "Integration with IPS"], "a": 2, "e": "Correct key point: Integration with IPS."}], "scr": "IAG dashboard", "qs": [33]}, {"id": "5.3", "wk": "Week 5: Cloud, platform and operations", "title": "BTP security", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How is security handled on SAP Business Technology Platform?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A clear, simple description of the structure.<br><b>Hiring manager:</b> That you see BTP as part of the security landscape, with its own administrators, trust and risks, needing governance.<br><b>Supervisor:</b> Detail: global account, subaccounts, trust to IAS, role collections, roles from applications, destinations and API security."}, {"h": "The best answer", "p": "<b>Structure:</b> The global account holds subaccounts. Each subaccount has its own users, trust configuration and applications.<br><b>Authentication:</b> Subaccounts trust an identity provider, usually IAS, which proxies to the corporate directory.<br><b>Authorization:</b> Applications define roles. Roles are grouped in role collections, which are assigned to users or groups.<br><b>Admin access:</b> Administrators of the platform and of subaccounts have very high power, so I limit and review them.<br><b>Integrations:</b> I review destinations, credentials and API access, since they link BTP to the SAP backends."}], "why": "That you see BTP as part of the security landscape, with its own administrators, trust and risks, needing governance.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: BTP security: trust, subaccounts and role collections?", "t": "mcq", "o": ["Measured result", "Blame-free learning", "Global account and subaccounts"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: BTP security: trust, subaccounts and role collections?", "t": "mcq", "o": ["Named admins, least privilege", "Trust to IAS", "Specific situation"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "BTP security: trust, subaccounts and role collections", "prompt": "How is security handled on SAP Business Technology Platform?", "model": "The global account holds subaccounts. Each subaccount has its own users, trust configuration and applications. Subaccounts trust an identity provider, usually IAS, which proxies to the corporate directory. Applications define roles. Roles are grouped in role collections, which are assigned to users or groups. Administrators of the platform and of subaccounts have very high power, so I limit and review them. I review destinations, credentials and API access, since they link BTP to the SAP backends.", "pts": ["Global account and subaccounts", "Trust to IAS", "Roles and role collections", "Control platform admins", "Destinations and APIs"]}], "quiz": [{"q": "Which is a key point for: BTP security: trust, subaccounts and role collections?", "o": ["Compliant hosting region", "Global account and subaccounts", "Same control principles"], "a": 1, "e": "Correct key point: Global account and subaccounts."}, {"q": "Which is a key point for: BTP security: trust, subaccounts and role collections?", "o": ["Trust to IAS", "Fast fix with approval", "Cycle time and review completion"], "a": 0, "e": "Correct key point: Trust to IAS."}, {"q": "Which is a key point for: BTP security: trust, subaccounts and role collections?", "o": ["Roles and role collections", "Feature comparison", "Business impact first"], "a": 0, "e": "Correct key point: Roles and role collections."}], "scr": "BTP cockpit, role collections", "qs": [32]}, {"id": "5.4", "wk": "Week 5: Cloud, platform and operations", "title": "HANA database security", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you secure an SAP HANA database, and how is database security different from application authorization?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know HANA has its own users and privileges, separate from SAP roles.<br><b>Hiring manager:</b> That you close the back door: if people can reach the database directly, application controls can be bypassed.<br><b>Supervisor:</b> Detail: technical and named DB users, system, object and analytic privileges, SYSTEM user handling, audit policies, encryption."}, {"h": "The best answer", "p": "<b>The difference:</b> Application authorizations control what users do inside SAP. HANA privileges control what users can do directly in the database, bypassing the application.<br><b>Users:</b> I keep the SYSTEM user locked and unused, use named administrators and limit technical users to what they need.<br><b>Privileges:</b> I review system, object and analytic privileges and the role catalog, and avoid broad grants such as DATA ADMIN.<br><b>Audit:</b> I enable HANA audit policies for privileged actions and review them.<br><b>Protection:</b> I check encryption of data at rest and in transit and the password and connection policies."}], "why": "That you close the back door: if people can reach the database directly, application controls can be bypassed.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: HANA database security?", "t": "mcq", "o": ["Checkpoints", "DB privileges bypass the application", "SUIM reports for review"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: HANA database security?", "t": "mcq", "o": ["KRIs", "Names ACTVT and organizational levels", "SYSTEM user locked"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "HANA database security", "prompt": "How do you secure an SAP HANA database, and how is database security different from application authorization?", "model": "Application authorizations control what users do inside SAP. HANA privileges control what users can do directly in the database, bypassing the application. I keep the SYSTEM user locked and unused, use named administrators and limit technical users to what they need. I review system, object and analytic privileges and the role catalog, and avoid broad grants such as DATA ADMIN. I enable HANA audit policies for privileged actions and review them. I check encryption of data at rest and in transit and the password and connection policies.", "pts": ["DB privileges bypass the application", "SYSTEM user locked", "Named admins, least privilege", "Audit policies", "Encryption"]}], "quiz": [{"q": "Which is a key point for: HANA database security?", "o": ["DB privileges bypass the application", "Tune the ruleset", "Data source and rule"], "a": 0, "e": "Correct key point: DB privileges bypass the application."}, {"q": "Which is a key point for: HANA database security?", "o": ["Simplification list review", "No permanent SAP_ALL in production", "SYSTEM user locked"], "a": 2, "e": "Correct key point: SYSTEM user locked."}, {"q": "Which is a key point for: HANA database security?", "o": ["Named admins, least privilege", "Quick wins", "Fiori replaces many transactions"], "a": 0, "e": "Correct key point: Named admins, least privilege."}], "scr": "HANA cockpit privileges", "qs": [31]}, {"id": "5.5", "wk": "Week 5: Cloud, platform and operations", "title": "SuccessFactors and HCM security", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What are the main security considerations in SAP SuccessFactors or HCM?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know HR data is sensitive.<br><b>Hiring manager:</b> That you protect personal data by design and meet privacy laws, while enabling HR to work.<br><b>Supervisor:</b> Detail: role-based permissions, permission groups, target populations, structural authorizations, audit."}, {"h": "The best answer", "p": "<b>Sensitivity:</b> HR data includes pay, health and personal data, so access must be tightly limited and logged.<br><b>SuccessFactors:</b> Access is controlled by role-based permissions: who the user is (permission group) and which population they can access (target group).<br><b>HCM on-premise:</b> Personnel authorizations and structural authorizations limit access by organizational unit.<br><b>Privacy:</b> I check masking, retention and consent against GDPR or local rules.<br><b>Review:</b> Regular access reviews and audit of sensitive field access, especially for administrators."}], "why": "That you protect personal data by design and meet privacy laws, while enabling HR to work.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SuccessFactors and HCM security?", "t": "mcq", "o": ["Single = building block; composite = job bundle", "Fix root cause", "Sensitive data"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SuccessFactors and HCM security?", "t": "mcq", "o": ["Permission groups and target populations", "/IWFND/ERROR_LOG and trace", "Least privilege for vendors"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SuccessFactors and HCM security", "prompt": "What are the main security considerations in SAP SuccessFactors or HCM?", "model": "HR data includes pay, health and personal data, so access must be tightly limited and logged. Access is controlled by role-based permissions: who the user is (permission group) and which population they can access (target group). Personnel authorizations and structural authorizations limit access by organizational unit. I check masking, retention and consent against GDPR or local rules. Regular access reviews and audit of sensitive field access, especially for administrators.", "pts": ["Sensitive data", "Permission groups and target populations", "Structural authorizations", "Privacy compliance", "Admin review"]}], "quiz": [{"q": "Which is a key point for: SuccessFactors and HCM security?", "o": ["Pick suitable controls", "Sensitive data", "Automatic provisioning by connector"], "a": 1, "e": "Correct key point: Sensitive data."}, {"q": "Which is a key point for: SuccessFactors and HCM security?", "o": ["Risks linked to controls", "Permission groups and target populations", "Design rules"], "a": 1, "e": "Correct key point: Permission groups and target populations."}, {"q": "Which is a key point for: SuccessFactors and HCM security?", "o": ["Structural authorizations", "Early assessment and SoD check", "Fix root cause"], "a": 0, "e": "Correct key point: Structural authorizations."}], "scr": "Permission role, target group", "qs": [38]}, {"id": "5.6", "wk": "Week 5: Cloud, platform and operations", "title": "Security notes, patching and the audit log", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you keep an SAP landscape secure over time: patches, notes, configuration and logging?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That security is ongoing, not a one-time project.<br><b>Hiring manager:</b> That you have a regular rhythm and report on exposure, working with Basis.<br><b>Supervisor:</b> Detail: Security Patch Day notes, Early Watch or Security Optimization checks, system parameters, audit log, RFC and gateway settings."}, {"h": "The best answer", "p": "<b>Patching:</b> I follow the monthly Security Patch Day, assess the notes, and plan implementation with Basis.<br><b>Configuration:</b> I check critical parameters, RFC trust and gateway settings, using the standard checks and tools.<br><b>Logging:</b> I switch on the security audit log with a defined filter and review key events.<br><b>Vulnerabilities:</b> I track open items by severity and age, and report to management.<br><b>Collaboration:</b> I work closely with Basis, since many controls are shared."}], "why": "That you have a regular rhythm and report on exposure, working with Basis.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Security notes, patching and the security audit log?", "t": "mcq", "o": ["Monthly patch rhythm", "Approval and time limits", "Names the user types"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Security notes, patching and the security audit log?", "t": "mcq", "o": ["Maintain the mapping", "Parameters and RFC checks", "Validate before reacting"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Security notes, patching and the security audit log", "prompt": "How do you keep an SAP landscape secure over time: patches, notes, configuration and logging?", "model": "I follow the monthly Security Patch Day, assess the notes, and plan implementation with Basis. I check critical parameters, RFC trust and gateway settings, using the standard checks and tools. I switch on the security audit log with a defined filter and review key events. I track open items by severity and age, and report to management. I work closely with Basis, since many controls are shared.", "pts": ["Monthly patch rhythm", "Parameters and RFC checks", "Audit log", "Track and report", "Work with Basis"]}], "quiz": [{"q": "Which is a key point for: Security notes, patching and the security audit log?", "o": ["Same control principles", "Monthly patch rhythm", "Review release notes"], "a": 1, "e": "Correct key point: Monthly patch rhythm."}, {"q": "Which is a key point for: Security notes, patching and the security audit log?", "o": ["Parameters and RFC checks", "Sensitive data", "Business Partner changes"], "a": 0, "e": "Correct key point: Parameters and RFC checks."}, {"q": "Which is a key point for: Security notes, patching and the security audit log?", "o": ["DB privileges bypass the application", "SAML or OIDC trust", "Audit log"], "a": 2, "e": "Correct key point: Audit log."}], "scr": "SM19/SM20, notes list", "qs": [40]}, {"id": "6.1", "wk": "Week 6: Audit, Process Control and Risk", "title": "SOX access evidence", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Which access controls do SOX auditors test in SAP, and what evidence do you prepare for them?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you speak the auditor's language and know what they ask for.<br><b>Hiring manager:</b> That you understand the link to financial reporting, and can provide complete and accurate evidence without drama.<br><b>Supervisor:</b> Specific evidence: user lists, role assignments, approvals, review sign-offs, firefighter logs, change documents, and the system-generated reports."}, {"h": "The best answer", "p": "<b>What they test:</b> Provisioning approvals, removal of leavers, periodic access review, privileged and emergency access, and SoD.<br><b>Evidence:</b> System-generated lists of users and roles with dates, the request and approval records, review sign-offs, the firefighter logs, and the SoD reports with the mitigations.<br><b>Completeness:</b> I show how each population was pulled, from the system and not from a spreadsheet, and who ran it.<br><b>Samples:</b> For each sample I trace the request to the approval to the assignment in the system.<br><b>Exceptions:</b> I explain exceptions early with the cause and the fix. Surprises cost credibility."}], "why": "That you understand the link to financial reporting, and can provide complete and accurate evidence without drama.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SOX and ITGC access controls and audit evidence?", "t": "mcq", "o": ["Checkpoints", "Provisioning, removal, review, privileged, SoD", "Verify every request"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SOX and ITGC access controls and audit evidence?", "t": "mcq", "o": ["Reviewer summaries", "Baseline and findings", "System-generated evidence"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SOX and ITGC access controls and audit evidence", "prompt": "Which access controls do SOX auditors test in SAP, and what evidence do you prepare for them?", "model": "Provisioning approvals, removal of leavers, periodic access review, privileged and emergency access, and SoD. System-generated lists of users and roles with dates, the request and approval records, review sign-offs, the firefighter logs, and the SoD reports with the mitigations. I show how each population was pulled, from the system and not from a spreadsheet, and who ran it. For each sample I trace the request to the approval to the assignment in the system. I explain exceptions early with the cause and the fix. Surprises cost credibility.", "pts": ["Provisioning, removal, review, privileged, SoD", "System-generated evidence", "Population completeness", "Sample traced end to end", "Disclose exceptions early"]}], "quiz": [{"q": "Which is a key point for: SOX and ITGC access controls and audit evidence?", "o": ["Provisioning, removal, review, privileged, SoD", "12–24 month roadmap", "Keys and logs in region"], "a": 0, "e": "Correct key point: Provisioning, removal, review, privileged, SoD."}, {"q": "Which is a key point for: SOX and ITGC access controls and audit evidence?", "o": ["System-generated evidence", "Connector groups", "Offshore restrictions"], "a": 0, "e": "Correct key point: System-generated evidence."}, {"q": "Which is a key point for: SOX and ITGC access controls and audit evidence?", "o": ["Failed controls raise risk", "SU24 and Fiori content", "Population completeness"], "a": 2, "e": "Correct key point: Population completeness."}], "scr": "Evidence pack, user list", "qs": [18]}, {"id": "6.2", "wk": "Week 6: Audit, Process Control and Risk", "title": "Responding to an auditor finding", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>An external auditor raises a finding that several users have access conflicts that were not mitigated. How do you respond?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A professional, calm answer.<br><b>Hiring manager:</b> That you confirm the facts, assess impact, correct quickly and fix the cause, while keeping the auditor informed.<br><b>Supervisor:</b> Actions: validate in GRC, check usage of the conflicting access, remove or mitigate, and show the evidence."}, {"h": "The best answer", "p": "<b>Facts:</b> I validate the finding with a fresh risk analysis and check which users and when the conflict existed.<br><b>Impact:</b> I check whether the conflicting access was used, from the transaction logs, to judge whether any actual issue occurred.<br><b>Fix now:</b> I remove the access or assign mitigating controls with owners, and evidence the change.<br><b>Fix the cause:</b> I find why it happened, such as a role change without a risk check or a movers gap, and correct the process.<br><b>Communicate:</b> I share the response, evidence and timeline with the auditor and management, and record the remediation."}], "why": "That you confirm the facts, assess impact, correct quickly and fix the cause, while keeping the auditor informed.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Responding to an auditor finding?", "t": "mcq", "o": ["Validate before reacting", "UAT with real users", "Clear split of work"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Responding to an auditor finding?", "t": "mcq", "o": ["Executive reporting", "Choose by landscape", "Check actual use"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Responding to an auditor finding", "prompt": "An external auditor raises a finding that several users have access conflicts that were not mitigated. How do you respond?", "model": "I validate the finding with a fresh risk analysis and check which users and when the conflict existed. I check whether the conflicting access was used, from the transaction logs, to judge whether any actual issue occurred. I remove the access or assign mitigating controls with owners, and evidence the change. I find why it happened, such as a role change without a risk check or a movers gap, and correct the process. I share the response, evidence and timeline with the auditor and management, and record the remediation.", "pts": ["Validate before reacting", "Check actual use", "Remove or mitigate with evidence", "Fix root cause", "Keep the auditor informed"]}], "quiz": [{"q": "Which is a key point for: Responding to an auditor finding?", "o": ["Reconcile and monitor", "Validate before reacting", "Scope and complete population"], "a": 1, "e": "Correct key point: Validate before reacting."}, {"q": "Which is a key point for: Responding to an auditor finding?", "o": ["Check actual use", "Leavers removed promptly across systems", "Review change logs"], "a": 0, "e": "Correct key point: Check actual use."}, {"q": "Which is a key point for: Responding to an auditor finding?", "o": ["Inherent versus residual", "Quantified and explained risk", "Remove or mitigate with evidence"], "a": 2, "e": "Correct key point: Remove or mitigate with evidence."}], "scr": "Finding letter, ARA rerun", "qs": [19]}, {"id": "6.3", "wk": "Week 6: Audit, Process Control and Risk", "title": "Security transports and change control", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you control security changes, such as role changes, so they move safely from development to production?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That roles are changed through a controlled process.<br><b>Hiring manager:</b> That there is approval, testing, separation of duties between builder and approver, and no direct production changes.<br><b>Supervisor:</b> Mechanics: PFCG role transport, STMS import, SU24 and profile generation, emergency change handling, and checking for direct changes."}, {"h": "The best answer", "p": "<b>Process:</b> A change request is approved and the role is built in development. Roles are transported using the transport request, tested in quality and imported to production.<br><b>Separation:</b> The builder does not approve or import their own change. Approval comes from the role owner and the import is done by a separate team.<br><b>Testing:</b> Testing includes a functional check by a user and a risk analysis for new conflicts.<br><b>Production changes:</b> Direct changes in production are blocked. Emergency changes are recorded and approved after the fact.<br><b>Monitoring:</b> I review change documents for roles and check for production edits, as part of the ITGC evidence."}], "why": "That there is approval, testing, separation of duties between builder and approver, and no direct production changes.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Security transports and change control?", "t": "mcq", "o": ["Verify every request", "Roles move by transport", "SU53 first, trace second"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Security transports and change control?", "t": "mcq", "o": ["Builder is not approver or importer", "HANA privileges", "Trace and usage data"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Security transports and change control", "prompt": "How do you control security changes, such as role changes, so they move safely from development to production?", "model": "A change request is approved and the role is built in development. Roles are transported using the transport request, tested in quality and imported to production. The builder does not approve or import their own change. Approval comes from the role owner and the import is done by a separate team. Testing includes a functional check by a user and a risk analysis for new conflicts. Direct changes in production are blocked. Emergency changes are recorded and approved after the fact. I review change documents for roles and check for production edits, as part of the ITGC evidence.", "pts": ["Roles move by transport", "Builder is not approver or importer", "Test plus risk analysis", "Block direct production changes", "Review change logs"]}], "quiz": [{"q": "Which is a key point for: Security transports and change control?", "o": ["Tested", "Roles move by transport", "Add to functions and permissions"], "a": 1, "e": "Correct key point: Roles move by transport."}, {"q": "Which is a key point for: Security transports and change control?", "o": ["Builder is not approver or importer", "Named admins, least privilege", "Trace and usage data"], "a": 0, "e": "Correct key point: Builder is not approver or importer."}, {"q": "Which is a key point for: Security transports and change control?", "o": ["Clear split of work", "Audit log", "Test plus risk analysis"], "a": 2, "e": "Correct key point: Test plus risk analysis."}], "scr": "STMS, change documents", "qs": [20]}, {"id": "6.4", "wk": "Week 6: Audit, Process Control and Risk", "title": "Process Control: controls and assessments", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What is SAP Process Control, and how does it support control assessment and testing?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A short, clear definition: it is the tool that manages controls, tests and sign-offs.<br><b>Hiring manager:</b> That you see it as the system of record for the control framework that feeds SOX and internal audit, not just another tool.<br><b>Supervisor:</b> Detail: control library, organizations and processes, manual and automated controls, self-assessments, test plans, issues and sign-off."}, {"h": "The best answer", "p": "<b>What it is:</b> SAP Process Control is the GRC component that holds the control framework: processes, risks, controls, owners and the testing and sign-off workflow.<br><b>Control types:</b> Manual controls are performed by people and evidenced. Automated controls are system settings or reports. Monitored controls use automated data checks (continuous control monitoring).<br><b>Assessments:</b> Control owners complete self-assessments. Testers run test plans on a sample, record results and raise issues.<br><b>Issues:</b> A failed test creates an issue with an owner and remediation plan, and the status flows to management reports.<br><b>Sign-off:</b> Management signs off by organization and period, giving the evidence base for the SOX assertion."}], "why": "That you see it as the system of record for the control framework that feeds SOX and internal audit, not just another tool.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Process Control: purpose, control types, assessments?", "t": "mcq", "o": ["Test before and after", "Approval and time limits", "Control framework system of record"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Process Control: purpose, control types, assessments?", "t": "mcq", "o": ["Governed change", "Manual, automated, monitored controls", "Gap register"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Process Control: purpose, control types, assessments", "prompt": "What is SAP Process Control, and how does it support control assessment and testing?", "model": "SAP Process Control is the GRC component that holds the control framework: processes, risks, controls, owners and the testing and sign-off workflow. Manual controls are performed by people and evidenced. Automated controls are system settings or reports. Monitored controls use automated data checks (continuous control monitoring). Control owners complete self-assessments. Testers run test plans on a sample, record results and raise issues. A failed test creates an issue with an owner and remediation plan, and the status flows to management reports. Management signs off by organization and period, giving the evidence base for the SOX assertion.", "pts": ["Control framework system of record", "Manual, automated, monitored controls", "Self-assessment and test plans", "Issues and remediation", "Sign-off for SOX"]}], "quiz": [{"q": "Which is a key point for: Process Control: purpose, control types, assessments?", "o": ["Control framework system of record", "Map to roles, log, authentication", "Secure the service accounts"], "a": 0, "e": "Correct key point: Control framework system of record."}, {"q": "Which is a key point for: Process Control: purpose, control types, assessments?", "o": ["Manual, automated, monitored controls", "MSMP routing", "Approval and time limits"], "a": 0, "e": "Correct key point: Manual, automated, monitored controls."}, {"q": "Which is a key point for: Process Control: purpose, control types, assessments?", "o": ["Choose control families", "Compares missing values with the role", "Self-assessment and test plans"], "a": 2, "e": "Correct key point: Self-assessment and test plans."}], "scr": "PC control library", "qs": [21]}, {"id": "6.5", "wk": "Week 6: Audit, Process Control and Risk", "title": "Process Control: monitoring and certification", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you set up automated control monitoring in SAP Process Control?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know it can test controls automatically.<br><b>Hiring manager:</b> That automation reduces manual testing effort and gives earlier warning of control failures.<br><b>Supervisor:</b> Detail: data sources, business rules, rule schedules, thresholds, deficiencies and exceptions workflow."}, {"h": "The best answer", "p": "<b>Choose controls:</b> I select controls suited to automation, such as configuration checks and transaction rules with clear logic.<br><b>Data source:</b> I define the data source in the backend system, such as a table query or a standard report.<br><b>Business rule:</b> I define the rule and the thresholds that decide pass or fail, and link it to the control.<br><b>Schedule and results:</b> The rule runs on a schedule. Failures create deficiencies for the owner to investigate and resolve.<br><b>Maintain:</b> I review the rules after system changes, since a changed table or process can break a rule silently."}, {"h": "The interview question", "p": "<i>How do you run a control assessment and certification cycle in Process Control?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A clear cycle: plan, assess, test, report.<br><b>Hiring manager:</b> That the cycle produces evidence management can rely on for sign-off, with issues closed on time.<br><b>Supervisor:</b> Detail: planner, subprocess assignments, self-assessment surveys, test plans, issues and remediation, sign-off."}, {"h": "The best answer", "p": "<b>Plan:</b> I define scope, timing and assignments in the planner for each organization and process.<br><b>Assess:</b> Control owners complete self-assessments and testers perform test plans on samples, attaching evidence.<br><b>Issues:</b> Failures create issues with own
