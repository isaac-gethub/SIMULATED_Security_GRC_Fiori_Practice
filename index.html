DP('5.2',{cards:[['Worked example: six high cloud risks','The IAG dashboard shows 14 open requests, six high risks and three overdue reviews. You open a risk: a user holds a cloud finance role and a procurement approval role, which breaches a rule for vendor creation and approval. Options: remove one role, or mitigate with a control. You choose removal, record the decision and the evidence. IAG then shows five high risks.'],['Common mistakes','Treating cloud applications as outside SoD. Ignoring overdue reviews. Mitigating without a real control. Having separate analysis for cloud and on-premise and no combined view.']],
 say:{1:'The dashboard counts open requests, high risks and overdue reviews. Click the high risks.',2:'IAG analyses roles in cloud and on-premise systems together. For each risk you decide: remove, or mitigate with a control and an owner, and record the evidence.'},
 outro:'<b>Interview takeaway:</b> "IAG is cloud access governance: analysis, requests and reviews across cloud and on premise, with the same remove-or-mitigate logic as ARA." Click Next.',
 tasks:[mq('IAG covers:',['Cloud and on-premise','Only cloud','Only HR'],0,'One view across landscapes.'),mq('A high risk is handled by:',['Remove or mitigate','Ignore','Delete'],0,'Same logic as ARA.'),mq('Overdue reviews are:',['A control gap','Fine','Required'],0,'Chase them.'),mq('Which is IAG\'s main benefit?',['A single view of access risk across systems','Faster printing','Cheaper licences only'],0,'Auditors expect cloud and on-premise covered.'),mq('A mitigated risk needs:',['A control, owner and evidence','A note','Nothing'],0,'Same standards as on premise.')],

DP('5.3',{cards:[['Worked example: role collections','In the BTP cockpit, role template "Subaccount Admin" becomes a role, which sits in the role collection "Subaccount Administrator", which is mapped to the IdP group SEC_BTP_ADMINS. Anyone in that corporate group becomes an admin. Nine people are in it, but the team needs three. You reduce the group, add an owner and a quarterly review, and ensure leavers drop automatically.'],['Common mistakes','Assigning role collections to individual users instead of groups. Leaving the first administrator as a personal account. Unlimited admins. Not reviewing mapped groups.']],
 say:{1:'Role collections bundle roles. Click the administrator collection.',2:'Nine admins is too many. Limit it to the few who need it, map collections to IdP groups, and review regularly.'},
 outro:'<b>Interview takeaway:</b> "Role template, role, role collection, IdP group, user. I keep admin collections small, map groups from the corporate directory and review them." Click Next.',
 tasks:[mq('Admin collections should be:',['Few and reviewed','Many','Shared'],0,'Least privilege.'),mq('Collections map to:',['IdP groups','Printers','Jobs'],0,'Group membership drives access.'),mq('Local users should be:',['Avoided','Preferred','Required'],0,'Use the corporate directory.'),mq('Who owns the admin group?',['A named business owner','Nobody','Everybody'],0,'Ownership enables reviews.'),mq('A leaver is removed from the group. Result?',['They lose BTP access','Nothing','They keep it'],0,'That is the point of group mapping.')],
 quiz:[qz('A role collection bundles:',['Roles','Users','Jobs'],0,'Roles.'),qz('Admin access should be:',['Minimal','Wide','Shared'],0,'Few.'),qz('Mapping uses:',['IdP groups','Tables','Logs'],0,'Groups.'),qz('Review:',['Regularly','Never','Once'],0,'Periodic.'),qz('A role template is defined by:',['The application','The user','The printer'],0,'App level.'),qz('A subaccount is:',['A BTP space for apps','A user','A job'],0,'A tenant area.')]});
DP('5.4',{cards:[['Worked example: DBA_TEMP','The HANA cockpit lists DBA_TEMP with SYSTEM and DATA ADMIN privileges, never used. Nobody knows who created it. You find the creator, confirm no application depends on it, drop the user, and check for similar accounts. You enable audit policies for privilege and user changes, and agree that the SYSTEM user is only used in a documented emergency.'],['Common mistakes','Using SYSTEM for daily work. Technical users with passwords known to many. No audit policy. Treating the database as outside SoD and review.']],
 say:{1:'The cockpit shows users, privileges and last use. Click the powerful unused user.',2:'Admin privileges and never used: remove it, and switch on audit policies so privilege use leaves a trail.'},
 outro:'<b>Interview takeaway:</b> "Least privilege, no daily SYSTEM, controlled technical users, audit policies on and reviewed." Click Next.',

DP('5.5',{cards:[['Worked example: HR Admin','HR Admin has target group Everyone and can view salary. Nine users hold it. You review who needs it: two real HR administrators. For the others you create roles with a region target group and no salary access. Salary visibility becomes a separate permission, granted only to payroll. Evidence: before and after holder lists, and the owner approval.'],['Common mistakes','Giving Everyone as a target group for convenience. Forgetting field-level access. Administrators with no review. Not considering privacy law for HR data.']],
 say:{1:'Permission roles and target groups are listed together. Click the broad role.',2:'Target group Everyone plus salary access is too wide. Narrow the target group, restrict fields and review the holders.'},
 outro:'<b>Interview takeaway:</b> "Permission roles say what, target groups say about whom, field permissions protect sensitive data. HR data is personal, so I scope tightly and review." Click Next.',
 tasks:[mq('Target group Everyone:',['Too wide for most roles','Safest','Required'],0,'Scope to the people the user supports.'),mq('Salary fields need:',['Field control','Nothing','Open access'],0,'Separate permission for sensitive fields.'),mq('Review who holds admin:',['Regularly','Never','Once'],0,'Admin roles are powerful.'),mq('Why is HR data sensitive?',['Personal and regulated','It is large','It is old'],0,'Privacy law applies.'),mq('A regional HR partner needs:',['Their own region only','Everyone','Nothing'],0,'Least privilege by target group.')],

DP('5.6',{cards:[['Worked example: audit log and notes','SM19 is configured to record logons, failed logons, transaction starts and critical changes, with retention of 12 months. In SM20 you find FF_FIN01 changed a vendor bank account at 02:20. For patching, the notes list shows note 3300002 missing and critical. You assess the systems affected, test in quality, transport under change control, and keep the evidence. Result: logging proved, patching proved.'],['Common mistakes','Audit log off or kept for days. Nobody reads it. Patching straight in production. A notes list that nobody owns. Missing evidence of the testing.']],
 say:{1:'<b>SM20 reads the Security Audit Log</b> that was configured in SM19. Type SM20 and press Enter.',2:'Each row is an event. Click the event of interest.',3:'The log is evidence of what happened and who did it. The notes list shows missing security notes, which are patched on a controlled schedule.'},
 outro:'<b>Interview takeaway:</b> "The audit log is on, retained and reviewed. Security notes are tracked, assessed, tested and transported with evidence." Click Next.',

DP('6.1',{cards:[['Worked example: the user access evidence pack','The auditor asks for user access evidence for the year. You supply: (1) the active user list from SUIM, system P01, run on 15.01.2027, parameters shown; (2) the privileged users list, rerun with the date visible after the first version was only a screenshot; (3) the GRC access review log with reviewers, decisions and removal tickets; (4) approvals for a sample of 25 new access requests. Each item names system, report, parameters and date, and a reviewer signed it.'],['Common mistakes','Screenshots with no date. A report from a different system or client. Parameters that exclude locked users without saying so. Evidence made after the auditor asked. No sign-off. Samples that are not random.']],
 say:{1:'The pack lists each item, its source and status. The privileged-users item is a screenshot with no run date. Click it.',2:'Evidence must show the system, report, parameters and run date, and be <b>complete and accurate</b>. Rerun it with the date visible and keep the output.'},
 outro:'<b>Interview takeaway:</b> "Traceable, complete and accurate evidence: system, report, parameters, run date, and proof the review happened. Anything I produce I can rerun in front of the auditor." Click Next.',
 tasks:[mq('A screenshot with no run date is:',['Weak evidence','Perfect','Required'],0,'The auditor cannot tell what it covers or when.'),mq('Evidence must be:',['Complete and accurate','Short','Verbal'],0,'This is the IPE test, information produced by the entity.'),mq('Review proof is:',['A sign-off log','A memo','Nothing'],0,'Evidence of operation, not only existence.'),mq('A report excludes locked users without saying so. Problem?',['It may not be complete','No problem','It is faster'],0,'Parameters change the population. State them.'),mq('Who produces the evidence?',['The control owner or process owner, reviewed by security','The auditor','Anyone later'],0,'Auditors test what the entity produces.')],
 quiz:[qz('Evidence shows:',['System, report, date','Opinions','Nothing'],0,'Traceable.'),qz('IPE means:',['Information produced by the entity','Internal policy','Index'],0,'Completeness and accuracy.'),qz('Reports are rerun:',['When weak','Never','Yearly only'],0,'Fix gaps.'),qz('Sign-offs are:',['Kept','Deleted','Hidden'],0,'Evidence.'),qz('Evidence is made:',['At the time of the control','After the auditor asks','Never'],0,'Contemporaneous.'),qz('Parameters should be:',['Shown','Hidden','Random'],0,'They define the population.')]});
DP('6.2',{cards:[['Worked example: the SAP_ALL finding','The auditor lists three users with SAP_ALL. In SUIM you confirm: BATCH_ADM (locked system user), FF_BASIS01 (locked firefighter ID) and DEVELOPER2 (active dialog). Two are lower risk but need owner confirmation; DEVELOPER2 is real. Remediation: remove SAP_ALL from DEVELOPER2 and give a developer role, document the other two, rerun SUIM and send the output with the date. Root cause fixed: a request check blocks SAP_ALL in future.'],['Common mistakes','Arguing before checking facts. Removing access without a change record. Closing with a promise and no evidence. Not finding the root cause, so the same finding returns next year. Treating the auditor as an opponent.']],
 say:{1:'The finding is broken into steps with owners. The open remediation step is the one to action. Click it.',2:'Remove or move the need to emergency access, rerun the analysis to prove it, and agree dates with the audit lead. Then fix the cause so it does not return.'},
 outro:'<b>Interview takeaway:</b> "Confirm the facts, remediate, prove it with a rerun, fix the root cause and agree dates. I treat the auditor as a partner." Click Next.',
 tasks:[mq('First reaction to a finding:',['Confirm the facts','Argue','Ignore'],0,'The finding may be wrong or partly right.'),mq('Prove the fix by:',['Rerunning the analysis','Telling them','Nothing'],0,'Evidence closes findings, not statements.'),mq('Remediation dates are:',['Agreed with audit','Secret','Avoided'],0,'Realistic dates keep credibility.'),mq('Why find the root cause?',['To stop the finding returning','To blame someone','To delay'],0,'A process fix beats a one-off clean-up.'),mq('Tone with auditors should be:',['Professional and open','Defensive','Silent'],0,'You share the aim of strong controls.')],

DP('6.3',{cards:[['Worked example: two transports','Transport DEVK900101 changes Z_FI_AP_CLERK, approved as change CR-221, tested, imported. Transport DEVK900117 is "Role change urgent" with no approval record. You hold it in the import queue, ask the requester for the approval, test evidence and business reason, and escalate to the change manager. Approved retrospectively under the emergency route, it is imported and reviewed the next day. All of it is recorded.'],['Common mistakes','Importing first and asking later without an emergency route. Approval in a chat message. Test evidence missing. Roles changed directly in production. Emergency changes never reviewed.']],
 say:{1:'<b>STMS is the transport management system.</b> The import queue shows what is about to enter production. Type STMS and press Enter.',2:'Each transport should match an approved change. Click the one with no approval record.',3:'A change with no approval record is a finding. Hold the import, get approval and test evidence, and treat true emergencies through the emergency route with after-the-fact review.'},
 outro:'<b>Interview takeaway:</b> "No change without approval and evidence. Development, test, approve, transport. Emergencies follow a defined route and are reviewed afterwards." Click Next.',
 tasks:[mq('No approval record. You:',['Hold the import','Import it','Delete it'],0,'Hold until approved.'),mq('Emergency change needs:',['Approval after and review','Nothing','Silence'],0,'An emergency route with review.'),mq('Roles are changed:',['In dev, via transport','In PRD','By users'],0,'Controlled.'),mq('Why match transports to change records?',['It proves who approved what','It is faster','It is optional'],0,'Traceability is what auditors test.'),mq('A direct production change is detected. Action?',['Investigate and restore properly','Ignore','Delete the log'],0,'Treat as a control failure.')],

DP('6.4',{cards:[['Worked example: C-AP-02','Control C-AP-02: three-way match in payables. Risk: paying invoices for goods not received. Type: automated. Owner: IT application owner. Objective: pay only what was ordered and received. Assessment: annual design and operating test plus continuous monitoring. Evidence: configuration screenshots with date, test of five invoices, monitoring results. The library shows all this in one place, linked to the risk.'],['Common mistakes','Controls with no risk link. No owner. Calling everything a key control. Design assessed but operation never tested. Manual and automated controls tested the same way.']],
 say:{1:'<b>Process Control is reached through the GRC work centre.</b> Type NWBC and press Enter.',2:'The library lists each control with process, type and owner. Click the automated control.',3:'It has an objective, an assessment plan and an owner. A control always links to a risk, an owner and a test.'},
 outro:'<b>Interview takeaway:</b> "A control library with risk, owner, type and test. Design and operating assessments with evidence, and issues tracked to closure." Click Next.',

DP('6.5',{cards:[['Worked example: payments above limit','The rule "payment above limit" runs nightly and finds four exceptions. Each becomes an issue for the AP manager with a due date in five days. Two are approved exceptions with documentation, one is an error that is reversed, one needs investigation and is escalated. At quarter end owners certify: "controls operated and issues handled". The certification record is evidence.'],['Common mistakes','Rules that create thousands of exceptions nobody reads. Issues with no owner. Auto-closing issues. Certifying without looking. Monitoring rules that no one maintains.']],
 say:{1:'Each monitoring rule shows its result and open issues. Click the rule with exceptions.',2:'Four exceptions are assigned to owners with due dates. Continuous monitoring finds problems as they happen, feeding the periodic sign-off.'},
 outro:'<b>Interview takeaway:</b> "Rules scan for exceptions, issues go to owners with due dates, overdue items are escalated and owners certify each period." Click Next.',

DP('6.6',{cards:[['Worked example: cloud outage risk','Risk: cloud outage, impact High, likelihood Low, so it sits in the upper-left of the heat map. Linked controls: none. You propose a control (tested failover, owner: IT operations, tested twice a year) and a KRI: downtime minutes per month with a threshold of 60. In month four it reaches 75, a breach, and is escalated to the risk committee, which approves extra investment.'],['Common mistakes','A heat map that nobody updates. Risks with no linked control. KRIs with no threshold. Rating everything high. Treating risk and control libraries as separate lists.']],

 outro:'<b>Interview takeaway:</b> "Rate impact and likelihood, link controls, measure with KRIs and thresholds, and escalate breaches." Click Next.',

DOCS.guide.h=`<p><strong>TIB Systems LLC</strong></p><h2>SAP Security, GRC and Fiori Practice: trainee user guide</h2><p>Version 1.0. Date: 26 November 2026.</p>
<h3>1. What this is</h3><p>A self-guided practice course that prepares Senior and Lead SAP Security, GRC and Fiori candidates for interviews and the first months in the role. It follows the 60-question TIB interview bank, in ${n} units across Weeks 0 to 8. You work alone, at your own pace, on any device.</p>
<h3>2. Signing in</h3><p>Use the email and password you were given. Your account must be enrolled by TIB. If you see "Not enrolled", contact TIB with the email you used. Your progress is saved to your account, so you can continue on another device.</p>
<h3>3. The five stages of a unit</h3><ol><li><b>Learn:</b> a short story, a flowchart, an animation, the model answer, and recall points. Where a unit has simulated screens there is also a See it in SAP page.</li><li><b>Simulate:</b> guided clicks on a simulated SAP screen. Follow the orange outline. The Show me button helps if you are stuck.</li><li><b>Analyse:</b> three short tasks on small data tables or choices.</li><li><b>Teach back:</b> explain the topic in your own words, then compare with the model answer and tick the points you covered.</li><li><b>Quiz:</b> four questions. You pass with all but one correct.</li></ol>
<p>Finish a unit to unlock the next one. Colours on the menu show whether a unit has simulated screens: blue none, green with screens.</p>
<h3>4. Senior and Lead</h3><p>Weeks 0 to 7 serve both Senior and Lead candidates. Week 8 is Lead only. Senior candidates may stop after Week 7.</p>
<h3>5. The Thornfield case</h3><p>Every unit uses the fictional company Thornfield Manufacturing, production client 300. The people are Aisha Hughes (AP clerk), Tara Olsen (IT administrator) and Priya Raman (risk manager). The SAP screens are a training simulation, not a live SAP system. The data is fictional.</p>
<h3>6. Telling your own stories</h3><p>The behavioural units (2.6, 4.7 and 8.9) contain illustrative stories. Replace them with your own real experience. Interviewers test real experience.</p>
<h3>7. Tips</h3><ul><li>Say your answers aloud in Teach back. Reading is not the same as saying.</li><li>Do one week at a time, then repeat the weak units.</li><li>The model answers serve three listeners: the recruiter, the hiring manager and the supervisor. Practise all three.</li><li>On a phone, turn the device sideways for the simulated screens.</li></ul>`;
DOCS.mgmt.t='Management report: design, strategy, methodology';
DOCS.mgmt.h=`<p><strong>TIB Systems LLC</strong></p><h2>Management report: SAP Security, GRC and Fiori Practice</h2><p>Version 1.0. Date: 26 November 2026. For instructors and administrators.</p>
<h3>1. Purpose</h3><p>Prepare Senior and Lead SAP Security, GRC and Fiori candidates in the USA, Canada, UK and Europe for interviews and early delivery. The app repeats the proven SAP Controls practice format with new content.</p>
<h3>2. How it was built</h3><ol><li>Market scan of about 55 postings (Senior and Lead roles) on major job sites, including Process Control, Risk Management and government roles.</li><li>A 60-question interview bank (about 60% Senior, 40% Lead), each with recruiter, hiring manager and supervisor variants, approved in six batches.</li><li>A 54-unit design covering all 60 questions exactly once, across nine weeks (0 to 8).</li><li>The app, built in seven batches, each reviewed before the next.</li></ol>
<h3>3. Current content</h3><table><tr><th>Item</th><th>Count</th></tr><tr><td>Units</td><td>${n}</td></tr><tr><td>Units with graphics (story, flowchart, animation)</td><td>${vz}</td></tr><tr><td>Units with simulated SAP screens</td><td>${sims.length} (${steps} guided clicks)</td></tr><tr><td>Analyse tasks</td><td>${labs}</td></tr><tr><td>Quiz questions</td><td>${qzs}</td></tr></table>
<h3>4. Design decisions</h3><ul><li>One bank and one app serve Senior and Lead. Week 8 is Lead only.</li><li>Fictional case company: Thornfield Manufacturing.</li><li>Simulated screens only. No live SAP access is needed.</li><li>Sign-in and enrolment use the TIB account pattern. Progress is stored in separate tables so it does not mix with other apps.</li></ul>
<h3>5. Known limits</h3><ul><li>Weeks 4 to 8 units have shorter simulations and analyse tasks than Weeks 1 to 3.</li><li>Simulated screens are teaching mock-ups, not exact SAP layouts. Government units are generic, not tied to one agency.</li><li>Behavioural stories are illustrations.</li><li>Quizzes are short (four questions per unit).</li></ul>
<h3>6. Suggested next steps</h3><ul><li>Pilot with a small group and review the stage completion data.</li><li>Deepen the units trainees find hardest.</li><li>Add a mock interview round using the bank.</li></ul>`;
})();
// ===== SIGN-IN AND PROGRESS (shared TIB Supabase login) =====
const SB_URL='https://blfgwysgekfqhcafofhe.supabase.co',SB_KEY='sb_publishable_ThLetpd4hj49fjce-kXoFA_v4ghwIqV';
let SES=null,ME=null,STAFF=false,PT=null;
function setSes(s){SES=s;try{if(s)localStorage.setItem('tibsec:auth',JSON.stringify(s));else localStorage.removeItem('tibsec:auth')}catch(e){}}
async function authReq(path,body){
  const r=await fetch(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  if(!r.ok)throw new Error(j.error_description||j.msg||j.message||'Sign-in failed');
  return j;
}
function mkSes(j){return {access_token:j.access_token,refresh_token:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000-60000,user:{id:j.user.id,email:String(j.user.email||'').toLowerCase()}}}
async function token(){
  if(!SES)throw new Error('Not signed in');
  if(Date.now()>SES.exp){const j=await authReq('token?grant_type=refresh_token',{refresh_token:SES.refresh_token});setSes(mkSes(j))}
  return SES.access_token;
}
async function rest(path,opt){
  const t=await token();
  const r=await fetch(SB_URL+'/rest/v1/'+path,Object.assign({},opt,{headers:Object.assign({apikey:SB_KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},(opt&&opt.headers)||{})}));
  if(!r.ok)throw new Error('Request failed ('+r.status+')');
  const x=await r.text();return x?JSON.parse(x):null;
}
function mergeState(a,b){
  const r={};
  new Set([...Object.keys(a),...Object.keys(b)]).forEach(id=>{
    const x=a[id],y=b[id];
    if(!x)r[id]=y;else if(!y)r[id]=x;
    else r[id]={sim:(x.sim||y.sim)?1:0,lab:Object.assign({},y.lab,x.lab),tb:Object.assign({},y.tb,x.tb),quiz:Math.max(x.quiz,y.quiz)};
  });
  return r;
}
function queuePush(){if(!SES||!ME)return;clearTimeout(PT);PT=setTimeout(push,1500)}
async function push(){
  if(!SES||!ME)return;const s=$('#sync');
  try{
    await rest('sapsec_progress?on_conflict=user_id',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify({user_id:SES.user.id,email:SES.user.email,state:P,units_done:UNITS.filter(done).length,updated_at:new Date().toISOString()})});
    if(s)s.textContent='Saved';
  }catch(e){if(s)s.textContent='Not saved (will retry)'}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&PT){clearTimeout(PT);push()}});
function hdr(on){['outBtn','syncW'].forEach(i=>{const e=document.getElementById(i);if(e)e.style.display=on?'':'none'});const d=document.getElementById('dashBtn');if(d)d.style.display=on&&STAFF?'':'none';const h=document.getElementById('homeBtn');if(h)h.style.display=on?'':'none';const k=document.getElementById('docBtn');if(k)k.style.display=on?'':'none'}
function loginScreen(msg){
  hdr(false);$('#crumb').textContent='Sign in';
  const st='width:100%;padding:10px;font-size:16px;border:1px solid #aab4c1;border-radius:6px;margin:4px 0 10px;box-sizing:border-box';
  app.innerHTML=`<h1>Sign in</h1><div class="card"><p>Use your TIB account: the same email and password as in the other TIB apps.</p><label>Email</label><input id="lgE" type="email" autocomplete="username" style="${st}"><label>Password</label><input id="lgP" type="password" autocomplete="current-password" style="${st}"><div class="row"><button class="btn" id="lgB">Sign in</button></div><p id="lgM" class="small" style="color:#b3261e;margin-top:8px">${esc(msg||'')}</p></div>`;
  const go_=async()=>{
    const e=$('#lgE').value.trim().toLowerCase(),p=$('#lgP').value;
    if(!e||!p){$('#lgM').textContent='Enter your email and password.';return}
    $('#lgB').disabled=true;$('#lgM').textContent='Signing in...';
    try{const j=await authReq('token?grant_type=password',{email:e,password:p});setSes(mkSes(j));await afterLogin()}
    catch(x){$('#lgB').disabled=false;$('#lgM').textContent=(/invalid/i.test(x.message)?'Email or password not correct.':x.message)}
  };
  $('#lgB').onclick=go_;$('#lgP').onkeydown=ev=>{if(ev.key==='Enter')go_()};
}
function notEnrolled(){
  hdr(false);const o=document.getElementById('outBtn');if(o)o.style.display='';
  $('#crumb').textContent='Not enrolled';
  app.innerHTML=`<h1>Not enrolled</h1><div class="card"><p>You are signed in as <b>${esc(SES.user.email)}</b>, but this account is not enrolled in the SAP Security, GRC and Fiori Practice course. Ask your TIB administrator to enrol this email address.</p><div class="row"><button class="btn" onclick="signOut()">Sign out</button></div></div>`;
}
async function afterLogin(){
  try{
    const en=await rest('sapsec_enrollments?select=role&email=eq.'+encodeURIComponent(SES.user.email));
    if(!en||!en.length){notEnrolled();return}
    ME=en[0];STAFF=(ME.role==='admin'||ME.role==='instructor');
    PKEY='tibsec:v1:'+SES.user.id;
    let L={};try{L=JSON.parse(localStorage.getItem(PKEY)||'{}')}catch(e){}
    P=L;
    const rm=await rest('sapsec_progress?select=state&user_id=eq.'+SES.user.id);
    if(rm&&rm[0]&&rm[0].state)P=mergeState(L,rm[0].state);
    try{localStorage.setItem(PKEY,JSON.stringify(P))}catch(e){}
    hdr(true);push();home();
  }catch(e){setSes(null);loginScreen('Could not load your account: '+e.message)}
}
function signOut(){clearTimeout(PT);if(SES&&ME&&PT===null){}setSes(null);ME=null;STAFF=false;P={};PKEY='tibsec:v1';loginScreen()}
async function dash(){
  if(!STAFF)return;
  $('#crumb').textContent='Instructor view';
  app.innerHTML='<h1>Trainee progress</h1><p class="mut">Loading...</p>';
  try{
    const [en,pr]=await Promise.all([rest('sapsec_enrollments?select=email,full_name,role&order=email'),rest('sapsec_progress?select=email,units_done,updated_at,state')]);
    const m={};pr.forEach(p=>m[p.email]=p);
    const cur=st=>{let k='-';UNITS.forEach(u=>{const s=st&&st[u.id];if(s&&(s.sim||Object.keys(s.lab||{}).length||Object.keys(s.tb||{}).length||s.quiz>=0))k=u.id});return k};
    const rows=en.map(e=>{const p=m[e.email];return `<tr><td>${esc(e.email)}</td><td>${esc(e.full_name||'')}</td><td>${esc(e.role)}</td><td>${p?p.units_done:0} / ${UNITS.length}</td><td>${p?cur(p.state):'-'}</td><td>${p?new Date(p.updated_at).toLocaleDateString():'Never'}</td></tr>`}).join('');
    app.innerHTML=`<h1>Trainee progress</h1><div class="card" style="overflow-x:auto"><table><tr><th>Email</th><th>Name</th><th>Role</th><th>Units complete</th><th>Furthest unit</th><th>Last active</th></tr>${rows}</table><p class="small mut">Instructors and admins see every unit unlocked. To enrol someone, add their email to the enrolment list; they sign in with their TIB account.</p></div><div class="row"><button class="btn sec" onclick="go()">Back to units</button></div>`;
  }catch(e){app.innerHTML='<h1>Trainee progress</h1><p>Could not load: '+esc(e.message)+'</p>'}
}
async function boot(){
  hdr(false);
  let s=null;try{s=JSON.parse(localStorage.getItem('tibsec:auth')||'null')}catch(e){}
  if(!s){loginScreen();return}
  SES=s;
  try{await token();await afterLogin()}catch(e){setSes(null);loginScreen()}
}
boot();

</script></body></html>
