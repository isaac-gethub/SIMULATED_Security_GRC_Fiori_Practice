<style>

<script>
const ANS={},FILES={},SIM={},QS={};
// ===== simulated SAP screens (training simulation, not a real SAP system) =====
const B=(id,l)=>`<button class="sb" data-id="${id}">${l}</button>`;
const F=(id,l,v='',ro=false)=>`<div class="f"><label>${l}</label><input data-id="${id}" value="${v}" ${ro?'readonly':''} autocomplete="off" spellcheck="false"></div>`;
const S=(title,body,status='')=>`<div class="stitle">${title}</div><div class="body">${body}</div><div class="sbar">${status||'&nbsp;'}</div>`;
const TB=(tabs,on)=>`<div class="tabs">${tabs.map(([id,l,k])=>`<span data-id="${id}" class="${on===k?'on':''}">${l}</span>`).join('')}</div>`;
const NOTE=t=>`<p class="note">${t}</p>`;
const TBL=(h,rows,cls)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join('')}</tr>${rows.map(r=>`<tr ${r.id?`data-id="${r.id}"`:''} class="${r.red?'red':''}">${r.c.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table>`;
const USERS={
 AHUGHES:{n:'Aisha Hughes',typ:'Dialog',from:'12.03.2023',to:'31.12.9999',roles:['Z_FI_AP_CLERK'],prof:['Z_FI_AP_CLERK'],last:'30.10.2026'},
 TOLSEN:{n:'Tara Olsen',typ:'Dialog',from:'02.05.2022',to:'31.12.9999',roles:['Z_BC_ADMIN_SUPPORT'],prof:['SAP_ALL','SAP_NEW','Z_BC_ADMIN_SUPPORT'],last:'02.04.2026'}
};
const ROLES={
 Z_FI_AP_CLERK:{d:'AP clerk: enter and display vendor invoices',menu:['FB60 Enter Incoming Invoice','FBL1N Vendor Line Items'],obj:[['S_TCODE','TCD: FB60, FBL1N'],['F_BKPF_BUK','ACTVT: 01, 02, 03 | BUKRS: 1000'],['F_LFA1_BUK','ACTVT: 03 | BUKRS: 1000']]},
 Z_FI_AP_COMPOSITE:{d:'AP clerk job (composite)',single:['Z_FI_AP_CLERK','Z_FI_AP_DISPLAY','Z_FI_REPORTING']},
 Z_FI_AP_CLERK_2000:{d:'AP clerk, company code 2000 (derived)',parent:'Z_FI_AP_CLERK',org:'BUKRS 2000'}
};
const SCR={
 logon:()=>S('SAP',`<p><b>Thornfield Manufacturing: Production system</b></p>${F('x1','Client','300',1)}${F('x2','User','SEC_REVIEW',1)}${F('x3','Password','********',1)}${F('x4','Language','EN',1)}${B('logon','Log On')}<p class="note">Training simulation. This is not a real SAP system.</p>`,'Client 300 = production'),
 easy:()=>S('SAP Easy Access',`<ul class="tree"><li>▸ Favorites</li><li>▾ SAP menu<ul class="tree"><li>▸ Accounting</li><li>▸ Tools</li><li>▸ Human Resources</li></ul></li></ul>${NOTE('Experts type a transaction code in the command field above.')}`,'SEC_REVIEW'),
 su01i:()=>S('User Maintenance: Initial Screen',`${F('fUser','User','')}${B('bDisp','👁 Display')}<button class="sb" disabled>Change</button>`),
 su01d:(u,tab)=>{const x=USERS[u],T=[['tAddr','Address','addr'],['tLogon','Logon data','logon'],['tRoles','Roles','roles'],['tProf','Profiles','prof']];
  const body=tab==='addr'?`${F('a1','Name',x.n,1)}${NOTE('Click the Logon data tab.')}`:tab==='logon'?`${F('l1','User type',x.typ,1)}${F('l2','Valid from',x.from,1)}${F('l3','Valid through',x.to,1)}${F('l4','Last logon',x.last,1)}`:tab==='roles'?TBL(['Role','From','To'],x.roles.map(r=>({c:[r,x.from,'31.12.9999']}))):TBL(['Profile','Type'],x.prof.map(p=>({red:p==='SAP_ALL',c:[p,p.startsWith('SAP')?'Composite (SAP)':'Generated from role']})))+(x.prof.includes('SAP_ALL')?NOTE('<b>SAP_ALL</b> gives every authorization in the system.'):'');
  return S('Display User '+u,F('fu','User',u,1)+TB(T,tab)+body)},
 su53:()=>S('Authorization Check: Last Failed Check (SU53)',`${F('u1','User','AHUGHES',1)}${F('u2','Transaction','FB60',1)}<p><b>Failed check</b></p>${TBL(['Object','Field','Required','User has'],[{id:'rBukrs',red:1,c:['F_BKPF_BUK','BUKRS','2000','1000']},{c:['F_BKPF_BUK','ACTVT','01','01, 02, 03']}])}${NOTE('The user may post in company code 1000 but tried company code 2000.')}`,'Authorization check failed'),
 pfcgI:()=>S('Role Maintenance: Initial Screen',`${F('fRole','Role','')}${B('bDisp','👁 Display')}<button class="sb" disabled>Change</button>`),

  if(x.single)return S('Display Role '+r,F('fr','Role',r,1)+TB([['tDesc','Description','d'],['tRoles','Roles','r']],tab||'r')+TBL(['Single role'],x.single.map(s=>({c:[s]})))+NOTE('A composite role holds no authorizations of its own. It bundles single roles.'));

const UNITS=[{"id": "0.1", "wk": "Week 0: Foundations", "title": "The SAP security map and vocabulary", "time": "about 1 hour", "learn": [{"h": "The SAP security map and vocabulary", "p": "Orientation content for this unit is added in a later build batch."}], "why": "A confident start makes every later answer easier.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Placeholder: this unit is completed in a later batch. Choose Continue.", "t": "mcq", "o": ["Continue", "Stop"], "a": 0, "why": "Placeholder."}]}, "tb": [{"title": "Explain it simply", "prompt": "In your own words, why does a security professional need this foundation?", "model": "Placeholder model answer added in a later batch.", "pts": ["Placeholder point one", "Placeholder point two"]}], "quiz": [{"q": "Placeholder question 1: choose Continue.", "o": ["Continue", "Stop"], "a": 0, "e": "Placeholder."}, {"q": "Placeholder question 2: choose Continue.", "o": ["Continue", "Stop"], "a": 0, "e": "Placeholder."}], "scr": "Landscape diagram, SU01 overview", "qs": []}, {"id": "0.2", "wk": "Week 0: Foundations", "title": "Users, user types and SUIM reports", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you manage SAP users day to day? Cover user types, parameters, and the reports you use to review them.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can speak confidently about the basics and use the right vocabulary.<br><b>Hiring manager:</b> That you control accounts that cannot be reviewed by people: system, service and generic IDs, which are high-risk.<br><b>Supervisor:</b> Specific items: SU01, user types, SU10 mass change, SUIM reports, and parameters like login/min_password_lng."}, {"h": "The best answer", "p": "<b>User types:</b> I use dialog for named people, system and service for technical use, communication for RFC connections, and reference for shared role sets. Generic dialog IDs are avoided.<br><b>Daily tasks:</b> In SU01 I create, lock and delete users, set validity dates and assign roles. For many users I use SU10 or the central user administration.<br><b>Reports:</b> In SUIM I review users by role, by authorization, by critical object and by last logon. I check for locked, expired and unused users.<br><b>Parameters:</b> I check password and logon parameters in RZ10 or RSPFPAR, for example minimum length, lock after failures and multiple logon.<br><b>Evidence:</b> I keep reports with dates as audit evidence and link them to the review process."}], "why": "That you control accounts that cannot be reviewed by people: system, service and generic IDs, which are high-risk.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: User administration, types and SUIM reports?", "t": "mcq", "o": ["Business users, roles, catalogs", "Business Partner changes", "Names the user types"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: User administration, types and SUIM reports?", "t": "mcq", "o": ["Worked example", "Blame-free learning", "SU01 and SU10"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "User administration, types and SUIM reports", "prompt": "How do you manage SAP users day to day? Cover user types, parameters, and the reports you use to review them.", "model": "I use dialog for named people, system and service for technical use, communication for RFC connections, and reference for shared role sets. Generic dialog IDs are avoided. In SU01 I create, lock and delete users, set validity dates and assign roles. For many users I use SU10 or the central user administration. In SUIM I review users by role, by authorization, by critical object and by last logon. I check for locked, expired and unused users. I check password and logon parameters in RZ10 or RSPFPAR, for example minimum length, lock after failures and multiple logon. I keep reports with dates as audit evidence and link them to the review process.", "pts": ["Names the user types", "SU01 and SU10", "SUIM reports for review", "Profile parameters", "Generic IDs treated as high risk"]}], "quiz": [{"q": "Which is a key point for: User administration, types and SUIM reports?", "o": ["Names the user types", "Validate before reacting", "Business Partner changes"], "a": 0, "e": "Correct key point: Names the user types."}, {"q": "Which is a key point for: User administration, types and SUIM reports?", "o": ["Listen first", "SU01 and SU10", "Proxy to corporate IdP"], "a": 1, "e": "Correct key point: SU01 and SU10."}, {"q": "Which is a key point for: User administration, types and SUIM reports?", "o": ["Completion and aging reports", "Options with trade-offs", "SUIM reports for review"], "a": 2, "e": "Correct key point: SUIM reports for review."}], "scr": "SU01, SUIM", "qs": [5]}, {"id": "0.3", "wk": "Week 0: Foundations", "title": "Reading a failed authorization check", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>A user says they cannot post a journal entry and gets a 'no authorization' message. Walk me through how you diagnose and fix it.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A calm, step-by-step approach with the key tools named. They want to hear that you fix it safely and do not just hand out more access.<br><b>Hiring manager:</b> That you do not simply add access. You check whether the request is legitimate and whether the fix creates a segregation of duties conflict.<br><b>Supervisor:</b> Specific tools and the order you use them: SU53, STAUTHTRACE or ST01, SUIM, then PFCG, then a retest."}, {"h": "The best answer", "p": "<b>Reproduce:</b> I ask the user to run SU53 straight after the failure, or I read the failed check from their session. SU53 shows the object and the values that were missing.<br><b>Trace if needed:</b> If SU53 is unclear, I run the system authorization trace (STAUTHTRACE, or ST01 on older releases) while the user repeats the action. This shows every check, including ones that passed.<br><b>Find the gap:</b> I compare the missing object and values with the user's roles in SUIM or PFCG. The cause is usually a missing role, a wrong organizational value, or an SU24 proposal that was never maintained.<br><b>Check the risk first:</b> Before changing anything I check that the request is approved and run a risk analysis in GRC to see whether the new access creates a conflict. If it does, I escalate or propose a mitigating control.<br><b>Fix and prove:</b> I change the role in development, test, and move it by transport. I never edit in production. Then I confirm with the user and record the evidence."}], "why": "That you do not simply add access. You check whether the request is legitimate and whether the fix creates a segregation of duties conflict.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Diagnosing a missing authorization?", "t": "mcq", "o": ["Verify every request", "Service levels and dashboard", "SU53 first, trace second"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Diagnosing a missing authorization?", "t": "mcq", "o": ["Compares missing values with the role", "Map to roles, log, authentication", "Tile is not security"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Diagnosing a missing authorization", "prompt": "A user says they cannot post a journal entry and gets a 'no authorization' message. Walk me through how you diagnose and fix it.", "model": "I ask the user to run SU53 straight after the failure, or I read the failed check from their session. SU53 shows the object and the values that were missing. If SU53 is unclear, I run the system authorization trace (STAUTHTRACE, or ST01 on older releases) while the user repeats the action. This shows every check, including ones that passed. I compare the missing object and values with the user's roles in SUIM or PFCG. The cause is usually a missing role, a wrong organizational value, or an SU24 proposal that was never maintained. Before changing anything I check that the request is approved and run a risk analysis in GRC to see whether the new access creates a conflict. If it does, I escalate or propose a mitigating control. I change the role in development, test, and move it by transport. I never edit in production. Then I confirm with the user and record the evidence.", "pts": ["SU53 first, trace second", "Compares missing values with the role", "Checks approval and SoD before fixing", "Changes through transport, not in production", "Retests and records evidence"]}], "quiz": [{"q": "Which is a key point for: Diagnosing a missing authorization?", "o": ["Specific situation", "Fast fix with approval", "SU53 first, trace second"], "a": 2, "e": "Correct key point: SU53 first, trace second."}, {"q": "Which is a key point for: Diagnosing a missing authorization?", "o": ["Restrictions by value", "Work with Basis", "Compares missing values with the role"], "a": 2, "e": "Correct key point: Compares missing values with the role."}, {"q": "Which is a key point for: Diagnosing a missing authorization?", "o": ["Risk analysis before generation", "Checks approval and SoD before fixing", "Three events handled separately"], "a": 1, "e": "Correct key point: Checks approval and SoD before fixing."}], "scr": "SU53, STAUTHTRACE", "qs": [2]}, {"id": "0.4", "wk": "Week 0: Foundations", "title": "The three interviewers and answer method", "time": "about 1 hour", "learn": [{"h": "The three interviewers and answer method", "p": "Orientation content for this unit is added in a later build batch."}], "why": "A confident start makes every later answer easier.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Placeholder: this unit is completed in a later batch. Choose Continue.", "t": "mcq", "o": ["Continue", "Stop"], "a": 0, "why": "Placeholder."}]}, "tb": [{"title": "Explain it simply", "prompt": "In your own words, why does a security professional need this foundation?", "model": "Placeholder model answer added in a later batch.", "pts": ["Placeholder point one", "Placeholder point two"]}], "quiz": [{"q": "Placeholder question 1: choose Continue.", "o": ["Continue", "Stop"], "a": 0, "e": "Placeholder."}, {"q": "Placeholder question 2: choose Continue.", "o": ["Continue", "Stop"], "a": 0, "e": "Placeholder."}], "scr": "None (method)", "qs": []}, {"id": "1.1", "wk": "Week 1: Authorizations and roles", "title": "Authorization objects, fields and org levels", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain how the SAP authorization concept works. What is an authorization object, and how do fields, activities and organizational levels control what a user can do?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can explain the concept in plain words with the right vocabulary, in a short, structured answer, without drifting into jargon.<br><b>Hiring manager:</b> That you connect authorizations to business risk: who can do what, in which company code or plant, and how the design supports least privilege and audit.<br><b>Supervisor:</b> That you know the objects you will touch daily (S_TCODE, F_BKPF_BUK, S_TABU_DIS, S_DEVELOP) and how to read them in a role without help."}, {"h": "The best answer", "p": "<b>Overview:</b> SAP checks authorization at runtime, after the user has logged on. The check is built from authorization objects, which are templates that a role fills with values.<br><b>Object, fields, activity:</b> An authorization object groups up to ten fields. Typical fields are ACTVT (the activity: create, change, display, delete) and organizational fields such as BUKRS (company code) or WERKS (plant). A role holds an instance of the object with specific values.<br><b>The check:</b> The system compares the values the program asks for with the values in the user's profile. All fields of an object must pass, and the user needs at least one passing instance. One failed field means the check fails.<br><b>Layers:</b> Transaction start is checked by S_TCODE. Then the program checks business objects such as F_BKPF_BUK for posting by company code. Organizational levels let one role design serve many entities.<br><b>Why it matters:</b> This is where least privilege is enforced. A tight design limits activity and org values, and a loose one uses wildcards or full authorizations that create risk."}], "why": "That you connect authorizations to business risk: who can do what, in which company code or plant, and how the design supports least privilege and audit.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Authorization objects, fields and org levels?", "t": "mcq", "o": ["Maintain the mapping", "Executive reporting", "Object = template, field = value, role = instance"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Authorization objects, fields and org levels?", "t": "mcq", "o": ["Privacy compliance", "Names ACTVT and organizational levels", "Permission-level rules"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Authorization objects, fields and org levels", "prompt": "Explain how the SAP authorization concept works. What is an authorization object, and how do fields, activities and organizational levels control what a user can do?", "model": "SAP checks authorization at runtime, after the user has logged on. The check is built from authorization objects, which are templates that a role fills with values. An authorization object groups up to ten fields. Typical fields are ACTVT (the activity: create, change, display, delete) and organizational fields such as BUKRS (company code) or WERKS (plant). A role holds an instance of the object with specific values. The system compares the values the program asks for with the values in the user's profile. All fields of an object must pass, and the user needs at least one passing instance. One failed field means the check fails. Transaction start is checked by S_TCODE. Then the program checks business objects such as F_BKPF_BUK for posting by company code. Organizational levels let one role design serve many entities. This is where least privilege is enforced. A tight design limits activity and org values, and a loose one uses wildcards or full authorizations that create risk.", "pts": ["Object = template, field = value, role = instance", "Names ACTVT and organizational levels", "Explains that all fields must pass", "Gives real objects: S_TCODE, F_BKPF_BUK", "Links to least privilege"]}], "quiz": [{"q": "Which is a key point for: Authorization objects, fields and org levels?", "o": ["Object = template, field = value, role = instance", "Confirm the legal rule", "SU53 first, trace second"], "a": 0, "e": "Correct key point: Object = template, field = value, role = instance."}, {"q": "Which is a key point for: Authorization objects, fields and org levels?", "o": ["Cloud access governance service", "Reason and recorded session", "Names ACTVT and organizational levels"], "a": 2, "e": "Correct key point: Names ACTVT and organizational levels."}, {"q": "Which is a key point for: Authorization objects, fields and org levels?", "o": ["Process improvement", "Explains that all fields must pass", "Task-based design, small roles"], "a": 1, "e": "Correct key point: Explains that all fields must pass."}], "scr": "PFCG authorization tab", "qs": [1]}, {"id": "1.2", "wk": "Week 1: Authorizations and roles", "title": "Single, composite and derived roles", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain single, composite and derived roles. When would you use each one, and what role design would you recommend for a new S/4HANA program?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know the three role types and can give a simple recommendation.<br><b>Hiring manager:</b> That you design for maintainability and control: fewer roles, clear ownership, and a design that keeps segregation of duties manageable.<br><b>Supervisor:</b> Practical detail: how derivation inherits menu and authorizations, how org values are maintained, and how you test."}, {"h": "The best answer", "p": "<b>Single role:</b> A single role holds the transactions or apps and authorization data for one task or job function. It is the building block.<br><b>Composite role:</b> A composite role bundles single roles for a job position. It holds no authorization data of its own, so users get one assignment that maps to a job.<br><b>Derived role:</b> A derived role inherits the menu and authorizations of a parent role. Only the organizational values are different. This lets one master design serve many company codes or plants.<br><b>My recommendation:</b> I design task-based single roles as the base. I keep organizational values separate by derivation, and bundle by job in composites. I avoid very large roles.<br><b>Controls:</b> Each role has an owner and a defined purpose. I check each design against the SoD ruleset before release."}], "why": "That you design for maintainability and control: fewer roles, clear ownership, and a design that keeps segregation of duties manageable.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Single, composite and derived roles?", "t": "mcq", "o": ["Tune the ruleset", "Single = building block; composite = job bundle", "IAM apps replace PFCG/SU01"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Single, composite and derived roles?", "t": "mcq", "o": ["Destinations and APIs", "Skills map", "Derived inherits and changes org values only"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Single, composite and derived roles", "prompt": "Explain single, composite and derived roles. When would you use each one, and what role design would you recommend for a new S/4HANA program?", "model": "A single role holds the transactions or apps and authorization data for one task or job function. It is the building block. A composite role bundles single roles for a job position. It holds no authorization data of its own, so users get one assignment that maps to a job. A derived role inherits the menu and authorizations of a parent role. Only the organizational values are different. This lets one master design serve many company codes or plants. I design task-based single roles as the base. I keep organizational values separate by derivation, and bundle by job in composites. I avoid very large roles. Each role has an owner and a defined purpose. I check each design against the SoD ruleset before release.", "pts": ["Single = building block; composite = job bundle", "Derived inherits and changes org values only", "Task-based design, small roles", "Role owner and SoD check before release", "Avoids one huge role"]}], "quiz": [{"q": "Which is a key point for: Single, composite and derived roles?", "o": ["Single = building block; composite = job bundle", "SU01 and SU10", "Separate for divestiture"], "a": 0, "e": "Correct key point: Single = building block; composite = job bundle."}, {"q": "Which is a key point for: Single, composite and derived roles?", "o": ["Test every path", "Identify, assess, respond, monitor", "Derived inherits and changes org values only"], "a": 2, "e": "Correct key point: Derived inherits and changes org values only."}, {"q": "Which is a key point for: Single, composite and derived roles?", "o": ["Single control library", "Outcome and lesson", "Task-based design, small roles"], "a": 2, "e": "Correct key point: Task-based design, small roles."}], "scr": "PFCG role tree", "qs": [3]}, {"id": "1.3", "wk": "Week 1: Authorizations and roles", "title": "SU24, SU25 and authorization defaults", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What are SU24 and SU25, and why do they matter when you build roles?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know these are the foundation of the role-building process and that you can explain it simply.<br><b>Hiring manager:</b> That you understand they keep role building consistent and reduce risk from missing or excessive authorizations.<br><b>Supervisor:</b> Detail: SU24 check indicators and proposals, the SU25 steps after upgrade, and the PFCG merge of proposals."}, {"h": "The best answer", "p": "<b>What SU24 is:</b> SU24 holds the proposals that link each transaction or app to authorization objects, with the default values and a check indicator. PFCG reads these when you add a transaction to a role.<br><b>Why it matters:</b> If SU24 is wrong, the role gets too many or too few authorizations. Maintaining SU24 first gives accurate, repeatable roles.<br><b>What SU25 is:</b> SU25 is the upgrade tool. After an upgrade or support package it compares the delivered defaults with the customer's SU24 and lets you adjust the differences.<br><b>In practice:</b> I maintain SU24 for custom transactions and for any standard changes, run SU25 after upgrades, and then merge into PFCG.<br><b>Control angle:</b> Well-maintained SU24 shrinks the clean-up work in PFCG and makes audit evidence easier."}], "why": "That you understand they keep role building consistent and reduce risk from missing or excessive authorizations.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SU24, SU25 and authorization defaults?", "t": "mcq", "o": ["Reconcile HR list with SAP users", "SU24 links transactions to objects", "Reminders and escalation"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SU24, SU25 and authorization defaults?", "t": "mcq", "o": ["Audit evidence kept", "Parameters and RFC checks", "Check indicators and defaults"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SU24, SU25 and authorization defaults", "prompt": "What are SU24 and SU25, and why do they matter when you build roles?", "model": "SU24 holds the proposals that link each transaction or app to authorization objects, with the default values and a check indicator. PFCG reads these when you add a transaction to a role. If SU24 is wrong, the role gets too many or too few authorizations. Maintaining SU24 first gives accurate, repeatable roles. SU25 is the upgrade tool. After an upgrade or support package it compares the delivered defaults with the customer's SU24 and lets you adjust the differences. I maintain SU24 for custom transactions and for any standard changes, run SU25 after upgrades, and then merge into PFCG. Well-maintained SU24 shrinks the clean-up work in PFCG and makes audit evidence easier.", "pts": ["SU24 links transactions to objects", "Check indicators and defaults", "SU25 after upgrade", "Maintain for custom Z transactions", "Reduces role clean-up"]}], "quiz": [{"q": "Which is a key point for: SU24, SU25 and authorization defaults?", "o": ["Automatic provisioning by connector", "SU24 links transactions to objects", "KRIs"], "a": 1, "e": "Correct key point: SU24 links transactions to objects."}, {"q": "Which is a key point for: SU24, SU25 and authorization defaults?", "o": ["Compares missing values with the role", "Check indicators and defaults", "Design rules"], "a": 1, "e": "Correct key point: Check indicators and defaults."}, {"q": "Which is a key point for: SU24, SU25 and authorization defaults?", "o": ["SU25 after upgrade", "KRIs", "Audit log monitoring"], "a": 0, "e": "Correct key point: SU25 after upgrade."}], "scr": "SU24", "qs": [4]}, {"id": "1.4", "wk": "Week 1: Authorizations and roles", "title": "SAP_ALL and critical access", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you control powerful access such as SAP_ALL, debug-and-replace, and critical basis authorizations?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you understand there are a small number of very high-risk powers and that you treat them seriously.<br><b>Hiring manager:</b> That you control them by process: restricted assignment, approval, time limits, logging and monitoring, not just by a policy document.<br><b>Supervisor:</b> Specific objects and tools: S_DEVELOP debug with activity 02, S_TABU_DIS, S_USER_GRP, SM19/SM20 or the audit log."}, {"h": "The best answer", "p": "<b>Principle:</b> In production nobody should hold SAP_ALL or SAP_NEW permanently. Where emergency use is needed it goes through firefighter access.<br><b>What I check:</b> I search for users with SAP_ALL, for debug with replace (S_DEVELOP activity 02), for user administration (S_USER_GRP, S_USER_AGR) and for broad table access (S_TABU_DIS, S_TABU_NAM).<br><b>How I control:</b> Critical access is not given in roles to normal users. It is requested, approved by the owner, time-boxed, and logged.<br><b>Monitoring:</b> I turn on the security audit log and review events and the firefighter log. I report exceptions.<br><b>Result:</b> Few users, clear reasons, logged use, and a regular review."}], "why": "That you control them by process: restricted assignment, approval, time limits, logging and monitoring, not just by a policy document.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Controlling SAP_ALL and critical access?", "t": "mcq", "o": ["No permanent SAP_ALL in production", "Measured result", "Checks approval and SoD before fixing"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Controlling SAP_ALL and critical access?", "t": "mcq", "o": ["Automatic provisioning by connector", "Central identity and MFA", "Names debug-replace and S_TABU_DIS"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Controlling SAP_ALL and critical access", "prompt": "How do you control powerful access such as SAP_ALL, debug-and-replace, and critical basis authorizations?", "model": "In production nobody should hold SAP_ALL or SAP_NEW permanently. Where emergency use is needed it goes through firefighter access. I search for users with SAP_ALL, for debug with replace (S_DEVELOP activity 02), for user administration (S_USER_GRP, S_USER_AGR) and for broad table access (S_TABU_DIS, S_TABU_NAM). Critical access is not given in roles to normal users. It is requested, approved by the owner, time-boxed, and logged. I turn on the security audit log and review events and the firefighter log. I report exceptions. Few users, clear reasons, logged use, and a regular review.", "pts": ["No permanent SAP_ALL in production", "Names debug-replace and S_TABU_DIS", "Approval and time limits", "Audit log monitoring", "Periodic review"]}], "quiz": [{"q": "Which is a key point for: Controlling SAP_ALL and critical access?", "o": ["Maintain for custom Z transactions", "Choose control families", "No permanent SAP_ALL in production"], "a": 2, "e": "Correct key point: No permanent SAP_ALL in production."}, {"q": "Which is a key point for: Controlling SAP_ALL and critical access?", "o": ["Names debug-replace and S_TABU_DIS", "SU53 first, trace second", "Risk = functions = actions and permissions"], "a": 0, "e": "Correct key point: Names debug-replace and S_TABU_DIS."}, {"q": "Which is a key point for: Controlling SAP_ALL and critical access?", "o": ["Audit findings aging", "Approval and time limits", "Enterprise risk versus access risk"], "a": 1, "e": "Correct key point: Approval and time limits."}], "scr": "SUIM critical access", "qs": [6]}, {"id": "1.5", "wk": "Week 1: Authorizations and roles", "title": "Oversized roles and authorization trace", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Users have roles that are very large and logon and role generation are slow. How do you investigate and fix it?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can handle technical problems, not only policy.<br><b>Hiring manager:</b> That you keep the design simple, because oversized roles slow the system and hide risk.<br><b>Supervisor:</b> Detail: profile size limits, number of authorization objects, wildcards, derived roles, trace to find real usage, split roles."}, {"h": "The best answer", "p": "<b>Find the problem:</b> I look at the role size, the number of profiles per user and any roles near the profile limits, and check for wide wildcards.<br><b>Use data:</b> I use authorization trace and transaction usage statistics to see what the users really need.<br><b>Fix:</b> I split large roles by task, use derivation for organizational variants, and remove unused transactions and objects.<br><b>Test:</b> I test with representative users before and after, and compare the results.<br><b>Prevent:</b> I set design rules for maximum role size and review new roles against them."}], "why": "That you keep the design simple, because oversized roles slow the system and hide risk.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Authorization trace, performance and oversized roles?", "t": "mcq", "o": ["Process, path, stage, agent", "Role size and profile limits", "Reduces role clean-up"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Authorization trace, performance and oversized roles?", "t": "mcq", "o": ["Maintain for custom Z transactions", "IAS authenticates; IPS provisions", "Trace and usage data"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Authorization trace, performance and oversized roles", "prompt": "Users have roles that are very large and logon and role generation are slow. How do you investigate and fix it?", "model": "I look at the role size, the number of profiles per user and any roles near the profile limits, and check for wide wildcards. I use authorization trace and transaction usage statistics to see what the users really need. I split large roles by task, use derivation for organizational variants, and remove unused transactions and objects. I test with representative users before and after, and compare the results. I set design rules for maximum role size and review new roles against them.", "pts": ["Role size and profile limits", "Trace and usage data", "Split by task, derive for org values", "Test before and after", "Design rules"]}], "quiz": [{"q": "Which is a key point for: Authorization trace, performance and oversized roles?", "o": ["DB privileges bypass the application", "S_SERVICE and active service", "Role size and profile limits"], "a": 2, "e": "Correct key point: Role size and profile limits."}, {"q": "Which is a key point for: Authorization trace, performance and oversized roles?", "o": ["RFC and logical systems", "Trace and usage data", "KRIs"], "a": 1, "e": "Correct key point: Trace and usage data."}, {"q": "Which is a key point for: Authorization trace, performance and oversized roles?", "o": ["Scheduled run, deficiencies", "Sensitive data", "Split by task, derive for org values"], "a": 2, "e": "Correct key point: Split by task, derive for org values."}], "scr": "STAUTHTRACE, PFCG profile size", "qs": [41]}, {"id": "1.6", "wk": "Week 1: Authorizations and roles", "title": "Role mining and role clean-up", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What is Business Role Management, and how do you use role mining to design better roles?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can describe BRM's purpose clearly.<br><b>Hiring manager:</b> That role design uses evidence and business input, not just copies of what exists.<br><b>Supervisor:</b> Detail: role definition, methodology, risk analysis at design stage, role mining from usage, and approval workflow."}, {"h": "The best answer", "p": "<b>BRM:</b> Business Role Management defines roles in a controlled way: role definition, methodology, risk analysis before generation, and approval before the role is created.<br><b>Role mining:</b> I analyze users' actual usage and existing assignments to find common patterns, which suggest the right task-based roles.<br><b>Design:</b> I build roles from the pattern, with the owner, then run risk analysis on the design before it goes to production.<br><b>Governance:</b> Role creation and changes follow a workflow with owner approval and documentation.<br><b>Benefit:</b> Fewer roles, clear ownership and conflicts found at design time."}, {"h": "The interview question", "p": "<i>You inherit a landscape with thousands of roles, many conflicts and a lot of unused access. How do you approach a clean-up?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A phased approach with clear results.<br><b>Hiring manager:</b> That you prioritize by risk, protect the business during the change, and show measurable improvement.<br><b>Supervisor:</b> Detailed steps: baseline, usage data, quick wins, role redesign by job, testing, rollout in waves."}, {"h": "The best answer", "p": "<b>Baseline:</b> I measure the starting point: number of roles, users with conflicts, users with critical access, and unused access.<br><b>Quick wins:</b> Remove unused access using usage data, and users with critical access who do not need it.<br><b>Design:</b> Redesign roles by job and task with owners, using role mining, and reduce overlap.<br><b>Rollout:</b> I move users in waves with testing and a rollback plan, starting with low-risk groups.<br><b>Prove:</b> I report the before and after numbers, and set controls to prevent drift: risk check at request time and periodic review."}], "why": "That role design uses evidence and business input, not just copies of what exists.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: BRM and role mining?", "t": "mcq", "o": ["Take ownership", "BRM = controlled role definition", "Retest"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: BRM and role mining?", "t": "mcq", "o": ["Cleared named administrators", "Role mining from usage", "Leavers removed promptly across systems"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Role redesign and clean-up project?", "t": "mcq", "o": ["Baseline metrics", "Audit log", "Avoids one huge role"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Role redesign and clean-up project?", "t": "mcq", "o": ["Usage-based quick wins", "Prioritize quick wins", "Blame-free learning"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "BRM and role mining", "prompt": "What is Business Role Management, and how do you use role mining to design better roles?", "model": "Business Role Management defines roles in a controlled way: role definition, methodology, risk analysis before generation, and approval before the role is created. I analyze users' actual usage and existing assignments to find common patterns, which suggest the right task-based roles. I build roles from the pattern, with the owner, then run risk analysis on the design before it goes to production. Role creation and changes follow a workflow with owner approval and documentation. Fewer roles, clear ownership and conflicts found at design time.", "pts": ["BRM = controlled role definition", "Role mining from usage", "Risk analysis before generation", "Owner approval", "Fewer, clearer roles"]}, {"title": "Role redesign and clean-up project", "prompt": "You inherit a landscape with thousands of roles, many conflicts and a lot of unused access. How do you approach a clean-up?", "model": "I measure the starting point: number of roles, users with conflicts, users with critical access, and unused access. Remove unused access using usage data, and users with critical access who do not need it. Redesign roles by job and task with owners, using role mining, and reduce overlap. I move users in waves with testing and a rollback plan, starting with low-risk groups. I report the before and after numbers, and set controls to prevent drift: risk check at request time and periodic review.", "pts": ["Baseline metrics", "Usage-based quick wins", "Design by job with owners", "Waves with rollback", "Prevent drift"]}], "quiz": [{"q": "Which is a key point for: BRM and role mining?", "o": ["Three events handled separately", "Review process for new code", "BRM = controlled role definition"], "a": 2, "e": "Correct key point: BRM = controlled role definition."}, {"q": "Which is a key point for: BRM and role mining?", "o": ["Current pain and exposure", "Verify every request", "Role mining from usage"], "a": 2, "e": "Correct key point: Role mining from usage."}, {"q": "Which is a key point for: BRM and role mining?", "o": ["Split by task, derive for org values", "Risk analysis before go-live", "Risk analysis before generation"], "a": 2, "e": "Correct key point: Risk analysis before generation."}, {"q": "Which is a key point for: Role redesign and clean-up project?", "o": ["Completion and aging reports", "PFCG menu and SU24", "Baseline metrics"], "a": 2, "e": "Correct key point: Baseline metrics."}, {"q": "Which is a key point for: Role redesign and clean-up project?", "o": ["Usage-based quick wins", "Roles move by transport", "Privacy compliance"], "a": 0, "e": "Correct key point: Usage-based quick wins."}, {"q": "Which is a key point for: Role redesign and clean-up project?", "o": ["Explains that all fields must pass", "Design by job with owners", "Feature comparison"], "a": 1, "e": "Correct key point: Design by job with owners."}], "scr": "GRC BRM, role usage report", "qs": [28, 29]}, {"id": "2.1", "wk": "Week 2: Segregation of duties", "title": "SoD concepts and the ruleset", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Explain segregation of duties and how an access risk ruleset in SAP GRC works.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A simple definition with one example, such as one person creating a vendor and paying it.<br><b>Hiring manager:</b> That you see SoD as fraud and error prevention, tied to business processes, and that the ruleset is tuned to the business, not left as delivered.<br><b>Supervisor:</b> The mechanics: risks, functions, actions and permissions, rule sets, and how the analysis runs in ARA."}, {"h": "The best answer", "p": "<b>Definition:</b> SoD means no single person can complete a risky end-to-end transaction alone, for example create a vendor and also approve the payment.<br><b>Ruleset structure:</b> In GRC Access Control a risk is built from two or more functions. A function is a business activity made of actions (transactions or apps) and permissions (authorization objects with values).<br><b>Analysis:</b> Access Risk Analysis compares user and role access with the ruleset and reports conflicts at action level and at permission level. Permission-level analysis reduces false positives.<br><b>Tuning:</b> I start with the delivered ruleset, then remove irrelevant risks, add custom transactions, and adjust to the company's processes.<br><b>Outcome:</b> Remediate by changing access, or mitigate with a control, with an owner and monitoring."}], "why": "That you see SoD as fraud and error prevention, tied to business processes, and that the ruleset is tuned to the business, not left as delivered.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SoD concepts and how the ruleset works?", "t": "mcq", "o": ["Plain definition with an example", "Landscape direction", "PFCG menu and SU24"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SoD concepts and how the ruleset works?", "t": "mcq", "o": ["Remove temporary access", "S_SERVICE and active service", "Risk = functions = actions and permissions"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SoD concepts and how the ruleset works", "prompt": "Explain segregation of duties and how an access risk ruleset in SAP GRC works.", "model": "SoD means no single person can complete a risky end-to-end transaction alone, for example create a vendor and also approve the payment. In GRC Access Control a risk is built from two or more functions. A function is a business activity made of actions (transactions or apps) and permissions (authorization objects with values). Access Risk Analysis compares user and role access with the ruleset and reports conflicts at action level and at permission level. Permission-level analysis reduces false positives. I start with the delivered ruleset, then remove irrelevant risks, add custom transactions, and adjust to the company's processes. Remediate by changing access, or mitigate with a control, with an owner and monitoring.", "pts": ["Plain definition with an example", "Risk = functions = actions and permissions", "Action and permission level analysis", "Tune the ruleset", "Remediate or mitigate"]}], "quiz": [{"q": "Which is a key point for: SoD concepts and how the ruleset works?", "o": ["Plain definition with an example", "Gap register", "Mentoring and rotation"], "a": 0, "e": "Correct key point: Plain definition with an example."}, {"q": "Which is a key point for: SoD concepts and how the ruleset works?", "o": ["Add custom transactions", "Risk = functions = actions and permissions", "Single = building block; composite = job bundle"], "a": 1, "e": "Correct key point: Risk = functions = actions and permissions."}, {"q": "Which is a key point for: SoD concepts and how the ruleset works?", "o": ["Action and permission level analysis", "Reviews and risk analysis still apply", "Blame-free learning"], "a": 0, "e": "Correct key point: Action and permission level analysis."}], "scr": "GRC ARA risk analysis", "qs": [7]}, {"id": "2.2", "wk": "Week 2: Segregation of duties", "title": "Remediate or mitigate", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>A SoD conflict is found for a user. How do you decide whether to remove the access or apply a mitigating control?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A clear decision approach, not a vague answer.<br><b>Hiring manager:</b> That you balance risk and business need, escalate properly, and never mitigate without a real control.<br><b>Supervisor:</b> How you work it: confirm the conflict, check usage, redesign roles, then the mitigation process."}, {"h": "The best answer", "p": "<b>Confirm:</b> First I confirm the conflict is real at permission level and see if the user actually uses both sides.<br><b>Try to remove:</b> If the access is unused or can be split across people or roles, I remove it. This is the preferred outcome.<br><b>If the business needs it:</b> If it is genuinely needed, for example in a small team, I propose a mitigating control such as a manager review of a report. The control owner agrees to perform it.<br><b>Governance:</b> The control is documented, assigned in GRC to the user and risk, has an expiry, and is tested.<br><b>Escalate:</b> If the risk is high and no control is realistic, I escalate to the process owner and compliance for a decision."}], "why": "That you balance risk and business need, escalate properly, and never mitigate without a real control.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SoD conflict: remediate or mitigate??", "t": "mcq", "o": ["Regenerate and test", "Confirm at permission level", "Root cause"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SoD conflict: remediate or mitigate??", "t": "mcq", "o": ["Single = building block; composite = job bundle", "Generic IDs treated as high risk", "Remove first"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SoD conflict: remediate or mitigate?", "prompt": "A SoD conflict is found for a user. How do you decide whether to remove the access or apply a mitigating control?", "model": "First I confirm the conflict is real at permission level and see if the user actually uses both sides. If the access is unused or can be split across people or roles, I remove it. This is the preferred outcome. If it is genuinely needed, for example in a small team, I propose a mitigating control such as a manager review of a report. The control owner agrees to perform it. The control is documented, assigned in GRC to the user and risk, has an expiry, and is tested. If the risk is high and no control is realistic, I escalate to the process owner and compliance for a decision.", "pts": ["Confirm at permission level", "Remove first", "Mitigate only with a real control", "Owner, expiry and testing", "Escalate high risk"]}], "quiz": [{"q": "Which is a key point for: SoD conflict: remediate or mitigate??", "o": ["Confirm at permission level", "Reporting on use and overdue reviews", "Tested"], "a": 0, "e": "Correct key point: Confirm at permission level."}, {"q": "Which is a key point for: SoD conflict: remediate or mitigate??", "o": ["Service levels and dashboard", "Remove first", "Request, risk check, approval"], "a": 1, "e": "Correct key point: Remove first."}, {"q": "Which is a key point for: SoD conflict: remediate or mitigate??", "o": ["Mitigate only with a real control", "Use delivered roles", "Independent, specific, periodic, evidenced"], "a": 0, "e": "Correct key point: Mitigate only with a real control."}], "scr": "ARA result, user detail", "qs": [8]}, {"id": "2.3", "wk": "Week 2: Segregation of duties", "title": "Mitigating controls", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>What makes a good mitigating control for a SoD risk, and how do you monitor that it works?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you can describe a concrete example in plain words.<br><b>Hiring manager:</b> That the control actually addresses the risk, is performed by someone independent, and is evidenced.<br><b>Supervisor:</b> How the control is set up in GRC, which reports are reviewed, and how often."}, {"h": "The best answer", "p": "<b>What makes it good:</b> It addresses the specific risk, is performed by someone independent of the conflicting duties, has a defined frequency and leaves evidence.<br><b>Example:</b> For a user who can create vendors and process payments, a manager reviews the vendor change report and payment run weekly and signs off.<br><b>In GRC:</b> I create the mitigating control with an owner and approver, link it to the risk and user, and set a validity period.<br><b>Monitoring:</b> I use the mitigation reports and review whether the control was performed. Controls that are not performed are removed and the access is revisited.<br><b>Testing:</b> Internal audit or the control tester samples the evidence of the review."}], "why": "That the control actually addresses the risk, is performed by someone independent, and is evidenced.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Designing and monitoring mitigating controls?", "t": "mcq", "o": ["Independent, specific, periodic, evidenced", "Cloud access governance service", "Parameters and RFC checks"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Designing and monitoring mitigating controls?", "t": "mcq", "o": ["Single control library", "KRIs", "Worked example"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Designing and monitoring mitigating controls", "prompt": "What makes a good mitigating control for a SoD risk, and how do you monitor that it works?", "model": "It addresses the specific risk, is performed by someone independent of the conflicting duties, has a defined frequency and leaves evidence. For a user who can create vendors and process payments, a manager reviews the vendor change report and payment run weekly and signs off. I create the mitigating control with an owner and approver, link it to the risk and user, and set a validity period. I use the mitigation reports and review whether the control was performed. Controls that are not performed are removed and the access is revisited. Internal audit or the control tester samples the evidence of the review.", "pts": ["Independent, specific, periodic, evidenced", "Worked example", "Assigned in GRC with owner and expiry", "Monitoring reports", "Tested"]}], "quiz": [{"q": "Which is a key point for: Designing and monitoring mitigating controls?", "o": ["Self-assessment and test plans", "Mitigation option at approval", "Independent, specific, periodic, evidenced"], "a": 2, "e": "Correct key point: Independent, specific, periodic, evidenced."}, {"q": "Which is a key point for: Designing and monitoring mitigating controls?", "o": ["Global account and subaccounts", "Worked example", "Role rework, not copy"], "a": 1, "e": "Correct key point: Worked example."}, {"q": "Which is a key point for: Designing and monitoring mitigating controls?", "o": ["Assigned in GRC with owner and expiry", "SU53 first, trace second", "Integration with IPS"], "a": 0, "e": "Correct key point: Assigned in GRC with owner and expiry."}], "scr": "GRC mitigation screen", "qs": [9]}, {"id": "2.4", "wk": "Week 2: Segregation of duties", "title": "Customizing the ruleset", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How would you customize the Access Risk Analysis ruleset for a company, and how do you control changes to it?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you do not just use the default and that you know the ruleset must fit the business.<br><b>Hiring manager:</b> That the ruleset is governed, since it defines what counts as a risk, and changes are approved and documented.<br><b>Supervisor:</b> Detail: logical systems and actions, function and risk maintenance, custom transactions, permission-level rules, generating rules and testing."}, {"h": "The best answer", "p": "<b>Start:</b> I start from the delivered rule set and review it with process owners to remove risks that do not apply and add missing ones.<br><b>Custom content:</b> I add custom transactions and Z objects to the functions, and where needed create company-specific risks.<br><b>Permission level:</b> I maintain the permission-level rules with the right authorization objects, to reduce false positives.<br><b>Generate and test:</b> After changes I regenerate the rules and test with known users, comparing before and after results.<br><b>Governance:</b> Rule changes go through approval with business and audit input, with a change log, and the version is retained."}], "why": "That the ruleset is governed, since it defines what counts as a risk, and changes are approved and documented.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Customizing GRC rulesets?", "t": "mcq", "o": ["Start from standard, tailor to business", "Explains that all fields must pass", "Trust to IAS"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Customizing GRC rulesets?", "t": "mcq", "o": ["Monitoring", "Owner, expiry and testing", "Add custom transactions"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Customizing GRC rulesets", "prompt": "How would you customize the Access Risk Analysis ruleset for a company, and how do you control changes to it?", "model": "I start from the delivered rule set and review it with process owners to remove risks that do not apply and add missing ones. I add custom transactions and Z objects to the functions, and where needed create company-specific risks. I maintain the permission-level rules with the right authorization objects, to reduce false positives. After changes I regenerate the rules and test with known users, comparing before and after results. Rule changes go through approval with business and audit input, with a change log, and the version is retained.", "pts": ["Start from standard, tailor to business", "Add custom transactions", "Permission-level rules", "Regenerate and test", "Governed change"]}], "quiz": [{"q": "Which is a key point for: Customizing GRC rulesets?", "o": ["Quantified savings", "Start from standard, tailor to business", "Population completeness"], "a": 1, "e": "Correct key point: Start from standard, tailor to business."}, {"q": "Which is a key point for: Customizing GRC rulesets?", "o": ["Check for authorization checks in code", "Scope and complete population", "Add custom transactions"], "a": 2, "e": "Correct key point: Add custom transactions."}, {"q": "Which is a key point for: Customizing GRC rulesets?", "o": ["Permission-level rules", "Outcome and lesson", "DB privileges bypass the application"], "a": 0, "e": "Correct key point: Permission-level rules."}], "scr": "GRC rule set maintenance", "qs": [25]}, {"id": "2.5", "wk": "Week 2: Segregation of duties", "title": "Custom Z transactions in the SoD analysis", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>The company has many custom transactions. How do you make sure they are covered by the SoD analysis?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know custom code can hide risk.<br><b>Hiring manager:</b> That custom code is inventoried and included in the rules, so the risk analysis is complete.<br><b>Supervisor:</b> Detail: Z transactions, TSTC and TSTCT lists, authorization objects checked in the code, adding actions to functions."}, {"h": "The best answer", "p": "<b>Inventory:</b> I list custom transactions from the transaction tables and the usage statistics, and meet developers and process owners to understand what each does.<br><b>Authorization checks:</b> I confirm each program checks an authorization object. If not, I raise it as a finding for development to fix.<br><b>Rules:</b> I add the actions to the right functions in the ruleset and map the authorization objects for permission-level analysis.<br><b>Test:</b> I run the analysis again and compare, then test a known user.<br><b>Process:</b> New custom transactions require a security and risk review before they go to production."}], "why": "That custom code is inventoried and included in the rules, so the risk analysis is complete.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: SoD for custom Z transactions and objects?", "t": "mcq", "o": ["Day-one minimum access", "Inherent versus residual", "Inventory custom transactions"], "a": 2, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: SoD for custom Z transactions and objects?", "t": "mcq", "o": ["Inherent versus residual", "Check for authorization checks in code", "Monthly patch rhythm"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "SoD for custom Z transactions and objects", "prompt": "The company has many custom transactions. How do you make sure they are covered by the SoD analysis?", "model": "I list custom transactions from the transaction tables and the usage statistics, and meet developers and process owners to understand what each does. I confirm each program checks an authorization object. If not, I raise it as a finding for development to fix. I add the actions to the right functions in the ruleset and map the authorization objects for permission-level analysis. I run the analysis again and compare, then test a known user. New custom transactions require a security and risk review before they go to production.", "pts": ["Inventory custom transactions", "Check for authorization checks in code", "Add to functions and permissions", "Retest", "Review process for new code"]}], "quiz": [{"q": "Which is a key point for: SoD for custom Z transactions and objects?", "o": ["Inventory custom transactions", "Approval and time limits", "Document for regulators"], "a": 0, "e": "Correct key point: Inventory custom transactions."}, {"q": "Which is a key point for: SoD for custom Z transactions and objects?", "o": ["Check for authorization checks in code", "Baseline metrics", "Scheduled synchronization jobs"], "a": 0, "e": "Correct key point: Check for authorization checks in code."}, {"q": "Which is a key point for: SoD for custom Z transactions and objects?", "o": ["Add to functions and permissions", "Baseline metrics", "Central identity and MFA"], "a": 0, "e": "Correct key point: Add to functions and permissions."}], "scr": "TSTC list, function editor", "qs": [42]}, {"id": "2.6", "wk": "Week 2: Segregation of duties", "title": "Behavioural: a business owner pushing for access", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Tell me about a time a business owner pressed you to give access that you believed was risky. What did you do?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A short story with a clear outcome and a professional tone.<br><b>Hiring manager:</b> Judgement and backbone: you listened, quantified the risk, offered an alternative and escalated when needed.<br><b>Supervisor:</b> That you can work with people without being a roadblock, and still hold the line."}, {"h": "The best answer", "p": "<b>Situation:</b> A finance director wanted one analyst to both create vendors and release payments to meet a deadline.<br><b>Action:</b> I explained the fraud risk in plain terms, showed the conflict from the risk analysis, and offered options: split the tasks, a temporary firefighter ID, or a mitigating control with a weekly review.<br><b>Escalation:</b> When the director still wanted permanent access, I escalated to the process owner and compliance with the facts and a recommendation.<br><b>Result:</b> They agreed to a split of tasks plus a reviewed report. The deadline was met and the audit had no finding.<br><b>Lesson:</b> Bring options, not just a no, and document the decision."}], "why": "Judgement and backbone: you listened, quantified the risk, offered an alternative and escalated when needed.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: A business owner pushing for risky access?", "t": "mcq", "o": ["Specific situation", "Review change logs", "SU24 links transactions to objects"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: A business owner pushing for risky access?", "t": "mcq", "o": ["Quantified and explained risk", "Conflicts and critical access", "One page, decisions needed"], "a": 0, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "A business owner pushing for risky access", "prompt": "Tell me about a time a business owner pressed you to give access that you believed was risky. What did you do?", "model": "A finance director wanted one analyst to both create vendors and release payments to meet a deadline. I explained the fraud risk in plain terms, showed the conflict from the risk analysis, and offered options: split the tasks, a temporary firefighter ID, or a mitigating control with a weekly review. When the director still wanted permanent access, I escalated to the process owner and compliance with the facts and a recommendation. They agreed to a split of tasks plus a reviewed report. The deadline was met and the audit had no finding. Bring options, not just a no, and document the decision.", "pts": ["Specific situation", "Quantified and explained risk", "Offered alternatives", "Escalated properly", "Outcome and lesson"]}], "quiz": [{"q": "Which is a key point for: A business owner pushing for risky access?", "o": ["Same control principles", "Own the error", "Specific situation"], "a": 2, "e": "Correct key point: Specific situation."}, {"q": "Which is a key point for: A business owner pushing for risky access?", "o": ["Admin review", "Quantified and explained risk", "Three lines of defence"], "a": 1, "e": "Correct key point: Quantified and explained risk."}, {"q": "Which is a key point for: A business owner pushing for risky access?", "o": ["Offered alternatives", "Proxy to corporate IdP", "Trace and usage data"], "a": 0, "e": "Correct key point: Offered alternatives."}], "scr": "None (story practice)", "qs": [23]}, {"id": "3.1", "wk": "Week 3: Access lifecycle", "title": "Access request, end to end", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>Walk me through an access request in SAP GRC Access Request Management, from request to provisioning.</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A clear start-to-finish story.<br><b>Hiring manager:</b> That the workflow includes proper approvals, a risk check before approval and an audit trail.<br><b>Supervisor:</b> The configuration pieces: request types, MSMP paths, risk analysis step, provisioning to the backend."}, {"h": "The best answer", "p": "<b>Request:</b> The requester or manager submits a request in ARM, choosing the user, systems and roles. Roles come from the role catalog.<br><b>Risk analysis:</b> The system runs access risk analysis on the request, and shows conflicts and the SoD results to approvers.<br><b>Approval:</b> The MSMP workflow routes to the line manager, role owner and, for conflicts, a risk owner or compliance.<br><b>Mitigation or reject:</b> The approver can reject, change the roles, or approve with a mitigating control.<br><b>Provisioning:</b> After the final approval, the system provisions to the backend by the connector, and records it for audit.<br><b>Closure:</b> The user is notified and the request keeps a full audit trail."}], "why": "That the workflow includes proper approvals, a risk check before approval and an audit trail.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: ARM access request workflow, end to end?", "t": "mcq", "o": ["Audit log", "Request, risk check, approval", "SYSTEM user locked"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: ARM access request workflow, end to end?", "t": "mcq", "o": ["SU24 links transactions to objects", "MSMP routing", "Cycle time and review completion"], "a": 1, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "ARM access request workflow, end to end", "prompt": "Walk me through an access request in SAP GRC Access Request Management, from request to provisioning.", "model": "The requester or manager submits a request in ARM, choosing the user, systems and roles. Roles come from the role catalog. The system runs access risk analysis on the request, and shows conflicts and the SoD results to approvers. The MSMP workflow routes to the line manager, role owner and, for conflicts, a risk owner or compliance. The approver can reject, change the roles, or approve with a mitigating control. After the final approval, the system provisions to the backend by the connector, and records it for audit. The user is notified and the request keeps a full audit trail.", "pts": ["Request, risk check, approval", "MSMP routing", "Mitigation option at approval", "Automatic provisioning by connector", "Audit trail"]}], "quiz": [{"q": "Which is a key point for: ARM access request workflow, end to end?", "o": ["Request, risk check, approval", "Governed change", "Runbooks and rhythm"], "a": 0, "e": "Correct key point: Request, risk check, approval."}, {"q": "Which is a key point for: ARM access request workflow, end to end?", "o": ["12–24 month roadmap", "Remove temporary access", "MSMP routing"], "a": 2, "e": "Correct key point: MSMP routing."}, {"q": "Which is a key point for: ARM access request workflow, end to end?", "o": ["Monitoring", "KRIs", "Mitigation option at approval"], "a": 2, "e": "Correct key point: Mitigation option at approval."}], "scr": "ARM request form, approval inbox", "qs": [10]}, {"id": "3.2", "wk": "Week 3: Access lifecycle", "title": "Joiner, mover, leaver", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you design the joiner, mover and leaver process so access stays correct as people start, change jobs and leave?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> A simple story with the three events named, and a confident sense that you have done it before.<br><b>Hiring manager:</b> That movers are handled as carefully as joiners, because old access piling up is the classic cause of SoD conflicts, and that leavers are removed promptly.<br><b>Supervisor:</b> Mechanics: HR trigger, role assignment by job, mover access removal, lock and delete, and the report you use to catch misses."}, {"h": "The best answer", "p": "<b>Joiner:</b> The HR event starts a request. The user gets a job-based composite role through ARM, or through identity management, with manager approval and a risk check.<br><b>Mover:</b> When someone changes position, the new roles are requested and the old roles are removed, not added to. Many SoD conflicts come from movers who kept old access.<br><b>Leaver:</b> The HR termination triggers locking and then removal of the user in every system, and removal of the open requests and firefighter access.<br><b>Safety net:</b> I run a monthly report of users who are terminated in HR but still active in SAP (SUIM last logon plus the HR list) and of users with assignments that do not match their position.<br><b>Evidence:</b> Timestamps from the request, the approval and the removal are kept for audit, and exceptions are explained."}], "why": "That movers are handled as carefully as joiners, because old access piling up is the classic cause of SoD conflicts, and that leavers are removed promptly.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Joiner, mover, leaver?", "t": "mcq", "o": ["Three events handled separately", "Disclose exceptions early", "Root cause"], "a": 0, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Joiner, mover, leaver?", "t": "mcq", "o": ["Data source and rule", "Risks linked to controls", "Movers lose old roles"], "a": 2, "why": "This is one of the key points the panel listens for."}]}, "tb": [{"title": "Joiner, mover, leaver", "prompt": "How do you design the joiner, mover and leaver process so access stays correct as people start, change jobs and leave?", "model": "The HR event starts a request. The user gets a job-based composite role through ARM, or through identity management, with manager approval and a risk check. When someone changes position, the new roles are requested and the old roles are removed, not added to. Many SoD conflicts come from movers who kept old access. The HR termination triggers locking and then removal of the user in every system, and removal of the open requests and firefighter access. I run a monthly report of users who are terminated in HR but still active in SAP (SUIM last logon plus the HR list) and of users with assignments that do not match their position. Timestamps from the request, the approval and the removal are kept for audit, and exceptions are explained.", "pts": ["Three events handled separately", "Movers lose old roles", "Leavers removed promptly across systems", "Reconcile HR list with SAP users", "Audit evidence kept"]}], "quiz": [{"q": "Which is a key point for: Joiner, mover, leaver?", "o": ["Plain definition with an example", "Three events handled separately", "Impact and likelihood"], "a": 1, "e": "Correct key point: Three events handled separately."}, {"q": "Which is a key point for: Joiner, mover, leaver?", "o": ["Movers lose old roles", "Split by task, derive for org values", "Thresholds"], "a": 0, "e": "Correct key point: Movers lose old roles."}, {"q": "Which is a key point for: Joiner, mover, leaver?", "o": ["Leavers removed promptly across systems", "Links to controls", "Tune the ruleset"], "a": 0, "e": "Correct key point: Leavers removed promptly across systems."}], "scr": "HR list versus SUIM report", "qs": [11]}, {"id": "3.3", "wk": "Week 3: Access lifecycle", "title": "Emergency access (firefighter)", "time": "about 1 hour", "learn": [{"h": "The interview question", "p": "<i>How do you design and control emergency access in SAP, and how do you review what was done with it?</i>"}, {"h": "What each interviewer wants to hear", "p": "<b>Recruiter:</b> That you know emergency access exists for a good reason and is controlled, not banned.<br><b>Hiring manager:</b> That the design balances availability with control: few people, short windows, a reason for each use, and an independent review of the log.<br><b>Supervisor:</b> Detail: EAM firefighter IDs and controllers, the reason code, the log review, the SAP reports, and what you do with unusual activity."}, {"h": "The best answer", "p": "<b>Why:</b> Emergency access lets a trusted person fix a production problem with powerful access when no normal role allows it.<br><b>Design:</b> In GRC Emergency Access Management I create firefighter IDs for defined purposes, assign firefighters and an independent controller, and set a limited validity period.<br><b>Use:</b> The firefighter logs in with the ID and must enter a reason. The session is recorded, including the transactions, and the changes.<br><b>Review:</b> The controller receives the log, reviews it and signs off in the system. I check that the work matches the reason and the ticket, and I escalate anything unusual.<br><b>Controls:</b> Firefighter IDs are not used for regular work. I report on how often they are used, by whom, and on any that are not reviewed on time."}], "why": "That the design balances availability with control: few people, short windows, a reason for each use, and an independent review of the log.", "sim": [], "files": [], "lab": {"intro": "Check what you learned. Simulated SAP screens and data exercises for this unit arrive in a later build batch.", "tasks": [{"q": "Which of these is a key point in a strong answer to: Emergency access (firefighter) design and log review?", "t": "mcq", "o": ["Baseline and findings", "Controlled, not banned", "Three lines of defence"], "a": 1, "why": "This is one of the key points the panel listens for."}, {"q": "Which of these is a key point in a strong answer to: Emergency access (fire
