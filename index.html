// ===== TEACHING STORIES, round 1: Weeks 0 to 3 =====
const SC=(id,arr)=>{VIZ[id].scene=arr.map(([w,t])=>({w,t}))};
SC('0.1',[['int','Give me the map of SAP security. Start from the user and end at the data.'],
['you','Start with the <b>user</b>, created in SU01. A user has no power on its own. It gets <b>roles</b>, created in PFCG. A role is a package of what the person may start (the menu) and what they may do inside it (the authorizations).'],
['int','What is inside the authorizations?'],
['you','<b>Authorization objects</b>. An object is a template with fields, for example F_BKPF_BUK has the fields activity (ACTVT) and company code (BUKRS). The role fills the fields with values: activity 01 (create) and company code 1000. At runtime SAP compares what the program asks for with those values. <b>Every field must match</b>, or the user gets "no authorization".'],
['int','And where do GRC, Fiori and cloud identity fit?'],
['you','Roles decide access. <b>GRC Access Control</b> checks that access for conflicts, for example creating a vendor and paying it. <b>Fiori</b> is the browser screen where the user starts apps, and it still relies on the same backend authorizations. <b>Cloud identity</b> (IAS and IPS) decides who may log in and creates users automatically. In an interview, walk this chain: user, role, object, value, check, then the tools that control it.']]);
SC('0.2',[['int','You are given a user to review. What do you look at in SU01, and why?'],
['you','Four things. First the <b>user type</b>: a dialog user is a named person, a system or service user is for programs, and a communication user is for interfaces. Second <b>valid-through</b>: 31.12.9999 means the account never expires. Third <b>last logon</b>: a user who has not logged on for months is a clean-up candidate. Fourth the <b>roles and profiles</b>, because that is what the user can really do.'],
['int','What worries you most?'],
['you','A dialog user holding the profile <b>SAP_ALL</b>. SAP_ALL contains every authorization in the system, so that person can create vendors, change pay data and delete logs. Nobody should hold it permanently in production. Shared dialog IDs worry me too, because you cannot say who did what.'],
['int','How do you check many users at once?'],
['you','SU01 shows one user. For the whole system I use <b>SUIM</b> reports: users by profile, by role, by last logon, by critical authorization. Example: SUIM, users by profile SAP_ALL returns every holder in one list. I then compare type, lock status and last logon to decide who needs action.']]);
SC('0.3',[['int','A user says "I get no authorization". What do you do first?'],
['you','I ask them to run <b>SU53</b> right after the error, in the same session. SU53 shows the last failed authorization check: the object, the field, the value the program <b>required</b> and the values the user <b>holds</b>. For example F_BKPF_BUK, field BUKRS, required 2000, user has 1000. That points straight at the gap.'],
['int','So you add company code 2000 to the role?'],
['you','Not yet. First I ask: is this access legitimate and approved? Would it create a conflict with the user\'s other access? Only then do I change the role, <b>in development</b>, test it, and move it by transport. Adding access just because a user complained is how SoD conflicts and audit findings begin.'],
['int','What if SU53 shows nothing useful?'],
['you','Then I use the authorization trace, <b>STAUTHTRACE</b>. I start the trace for the user, the user repeats the action, I stop it and read every check, passed and failed. It also finds failures in background and Fiori calls that SU53 does not catch. The method is always: reproduce, read the failed value, check approval and risk, fix in development, transport.']]);
SC('0.4',[['int','Your answers sound too similar for a recruiter and a technical manager. Why do you adjust?'],
['you','Because three different people listen to me. The <b>recruiter</b> checks that I know the vocabulary and can explain it simply. The <b>hiring manager</b> wants judgement: do I understand the business risk and when to say no? The <b>supervisor</b> wants to know I can really do it: which transaction, which table, which step. A good answer serves all three.'],
['int','Give me the structure you use.'],
['you','Four parts. <b>Signpost</b>: "There are three steps." <b>Risk</b>: why it matters to the business, for example fraud or an audit finding. <b>Tools</b>: name the actual SAP tools, such as SU53, PFCG, ARA. <b>Decision</b>: end with what you would do and who owns it: remove, mitigate or escalate. The signpost keeps me organised, and the ending shows leadership.'],
['int','What about behavioural questions?'],
['you','Tell a short story: <b>situation, action, result, lesson</b>. Use your own real experience. The stories in this course are examples of the shape, not scripts to learn. Practise aloud, because saying an answer is a different skill from knowing it.']]);
SC('1.1',[['int','What is an authorization object, in one clear explanation?'],
['you','It is a template that SAP uses for a permission check. Think of it as a form with fields. The object <b>F_BKPF_BUK</b> controls accounting documents by company code and has two fields: <b>ACTVT</b> (activity) and <b>BUKRS</b> (company code). A role fills the form with values, for example ACTVT 01, 02, 03 and BUKRS 1000.'],
['int','How does SAP use it when a user posts an invoice?'],
['you','The FB60 program asks, in effect: "does this user have F_BKPF_BUK with activity 01 for company code 2000?" SAP looks through all the user\'s roles. <b>Every field must pass.</b> Activity passes but company code fails if the role only has 1000, and the whole check fails.'],
['int','What do the values 03 and * mean?'],
['you','Activity 03 is display, 01 create, 02 change, 06 delete. A <b>star</b> means all values. A star in company code means every company, which is broad and needs a reason. Reading roles means reading these values, so I always look at the objects that carry money or master data, and at any star.']]);
SC('1.2',[['int','What is the difference between single, composite and derived roles, and when do you use each?'],
['you','A <b>single role</b> is a building block, one task such as "enter vendor invoices". A <b>composite role</b> bundles single roles for a job, for example the AP clerk job. It has no authorizations of its own, it only groups. A <b>derived role</b> copies a parent role and changes only the <b>organizational values</b>, such as the company code.'],
['int','Why derive?'],
['you','Thornfield has company codes 1000 and 2000 with the same duties. I build the parent role once, then derive Z_FI_AP_CLERK_2000 and change only BUKRS to 2000. When the parent changes, the derived role inherits it, so the design stays consistent and I maintain one design instead of two.'],
['int','What makes a good role design?'],
['you','Small, task-based roles with an owner, a clear name and a description. Jobs are built by combining them. A huge role that does everything is hard to review, hides risk, and causes SoD conflicts when added to others. Small roles are easier to assign, test and remove.']]);
SC('1.3',[['int','What are SU24 and SU25, and why should I care?'],
['you','When you add a transaction to a role menu in PFCG, SAP proposes the authorization objects that transaction needs. Those proposals come from <b>SU24</b>. For FB60 it says which objects are checked and with which default values. If SU24 is wrong, every role built from it is wrong, too wide or too narrow.'],
['int','What does "check" and "proposal" mean in SU24?'],
['you','The <b>check indicator</b> says whether the program really checks that object. The <b>proposal</b> says whether PFCG should add it to the role. "Check = Yes, proposal = Yes" means the object is added with default values you must then maintain, for example the company code. "Do not check" means the program ignores it.'],
['int','And SU25?'],
['you','<b>SU25</b> is used after an upgrade or support package. It compares SAP\'s new defaults with your customised SU24 and lets you adjust, so roles stay correct. For custom Z transactions I always maintain SU24 myself, otherwise the role comes out incomplete and users get "no authorization".']]);
SC('1.4',[['int','How do you handle SAP_ALL and other critical access?'],
['you','First I find it. In <b>SUIM</b> I search users by profile SAP_ALL and by critical authorizations. I read the user type, lock status and last logon, because a locked system ID needs less urgency than an active dialog user. An active dialog user with SAP_ALL is a finding.'],
['int','Then what?'],
['you','Remove it, unless there is a real need. If a person must be able to do anything in an emergency, I use <b>emergency (firefighter) access</b>: a separate ID, requested with a reason, time limited, logged, and reviewed by an independent controller afterwards. That keeps the capability without the permanent risk.'],
['int','Is SAP_ALL the only dangerous access?'],
['you','No. Also debug with replace (S_DEVELOP with activity 02), table maintenance (S_TABU_DIS), user administration, and the ability to change roles in production. I include these in the review. The principle is the same: nobody holds it permanently, and use is controlled and visible.']]);
SC('1.5',[['int','Users say SAP is slow and a role has hundreds of transactions. What do you do?'],
['you','First I <b>measure</b>: how big is the role, how many users have it, and how much is actually used. The role usage report shows, for example, Z_FI_ALL_ACCESS gives 310 transactions, 40 users hold it, and only 9 transactions are used. That is about 3 percent. Unused access carries risk with no benefit.'],
['int','How do you find what users really need?'],
['you','With an <b>authorization trace</b> (STAUTHTRACE) and usage data. I trace a user doing their real job, read every authorization check that passed, and build the role from that, not from guesswork. Failed checks tell me what is missing.'],
['int','Then?'],
['you','I split the oversized role into small task roles, derive for organizational values, test with real users, and migrate them in waves with rollback. Then I set <b>design rules</b>, such as a maximum number of transactions per role and a required owner, so the problem does not return.']]);
SC('1.6',[['int','You inherit thousands of roles and many SoD conflicts. Where do you start?'],
['you','With a <b>baseline</b>: how many roles, users, conflicts, and how much access is unused. You cannot prove improvement without a starting number. Then I take the <b>quick wins</b>: remove access that is never used, lock inactive users, remove expired assignments. That cuts risk fast with little business impact.'],
['int','And the roles themselves?'],
['you','I use <b>role mining</b>: look at what groups of users really do and design a small set of task-based roles with owners. If the company has GRC Business Role Management, I use it to define and approve roles through a workflow. I roll out in <b>waves</b> by department, with a rollback plan.'],
['int','How do you prove it worked and keep it from coming back?'],
['you','Before and after numbers: conflicts down, unused access removed, roles reduced. To prevent drift I run the <b>risk check at request time</b> so new conflicts are caught, and I review roles and users periodically. The answer to an interviewer is: baseline, quick wins, redesign in waves, prove, prevent.']]);
SC('2.1',[['int','Explain segregation of duties and how a GRC ruleset works.'],
['you','Segregation of duties means <b>no single person can complete a risky transaction from start to finish alone</b>. Example: the same person creates a vendor and releases the payment to that vendor. That is a fraud route. Separating the two means a second person would have to take part.'],
['int','How does GRC know that?'],
['you','Through a <b>ruleset</b>. A <b>risk</b> is built from two or more <b>functions</b>, such as "vendor master maintenance" and "payment processing". Each function lists <b>actions</b> (transactions like XK01 and F110) and <b>permissions</b> (authorization objects and values). Access Risk Analysis, ARA, checks each user: do they hold both functions with real permissions? If yes, the risk is reported.'],
['int','Why do permissions matter?'],
['you','Without them, a user who can only display would be flagged as if they could change. Permissions make the result precise and cut false positives. The delivered ruleset is a starting point. A good consultant tunes it to the business, adds custom risks and documents each change.']]);
SC('2.2',[['int','ARA shows a conflict for a user. Do you remove the access or accept it?'],
['you','First I ask the business: <b>does this person really need both duties</b> for their job? Often the answer is no, the access came from an old role or a past job. Then the right fix is to <b>remove</b> it. That is cleanest, because the risk disappears.'],
['int','And if they really need both?'],
['you','Then <b>mitigate</b>: add a control that would catch misuse, with an owner, a frequency and evidence. Example: the controller reviews every vendor bank change against payments each week and signs the report. The risk remains, but it is covered, and the mitigation is recorded in GRC.'],
['int','Who decides?'],
['you','The <b>business risk owner</b> accepts the residual risk. I advise, document and implement. I never approve my own request, because that would break the very principle I am protecting. Decision order: remove first, mitigate when needed, record who accepted.']]);
SC('2.3',[['int','What makes a mitigating control real and not just paper?'],
['you','Four things. A named <b>owner</b> who is independent of the risky duties. A set <b>frequency</b>, for example weekly. A clear <b>procedure</b> that covers the exact risk, for example compare vendor bank changes with payments. And <b>evidence</b> each time: a signed report or a log. If any of these is missing, auditors treat it as no control.'],
['int','How is it recorded in GRC?'],
['you','In the mitigation screen I assign the control to the <b>user and risk</b>, set the monitor, such as the controller, and a valid-to date. The risk still shows in reports but is marked as mitigated. When the date expires the conflict reappears, which forces a review.'],
['int','What do you check before accepting a proposed control?'],
['you','Does it cover that specific risk? Is the person independent? Is it precise enough to catch the problem? Does evidence exist for the whole period? I test it. A control that only exists on paper is a finding, not a protection.']]);
SC('2.4',[['int','The delivered ruleset gives hundreds of false positives. What do you do?'],
['you','I <b>copy</b> the delivered rule set into a custom one rather than editing the original. The delivered rules are overwritten by upgrades, and I need a clean baseline for audit. In the copy I tune <b>permissions</b> so a risk is only reported when the access is really dangerous, which removes false alarms.'],
['int','What else do you change?'],
['you','I add <b>custom risks</b> for how this company really works. At Thornfield, for example, a risk for maintaining bank data and releasing payments, built from functions I define. I also review levels, so high means genuinely high for this business.'],
['int','How do you control the changes?'],
['you','Every change is requested, approved by the risk owner, documented and tested before I generate the rules. Then I rerun the analysis and compare results. A ruleset nobody can explain or change-trace is itself an audit finding.']]);
SC('2.5',[['int','Thornfield has custom Z transactions. Does the ruleset see them?'],
['you','No. The ruleset only knows what is listed. A custom transaction such as ZFI_PAYREL, which releases payments, is invisible to the analysis until I add it to a function with its permissions. That causes <b>false negatives</b>: real conflicts that are never reported.'],
['int','How do you find them?'],
['you','I read the transaction table <b>TSTC</b> for names starting with Z or Y, then use usage data to see which are used and by whom. For each important one I read what it does, decide which function it belongs to, and add it as an action with the authorization object it checks.'],
['int','Then?'],
['you','I regenerate the rules and rerun the analysis. If new conflicts appear, they are real and need handling. I repeat this for every new custom transaction, so adding Z-code review to the change process keeps the ruleset current.']]);
SC('2.6',[['int','Tell me about a time a business owner pushed you to give risky access.'],
['you','<b>Situation:</b> a finance director wanted one analyst to create vendors and release payments, to meet a deadline. <b>Action:</b> I did not just say no. I showed the conflict from the risk analysis in plain words, that one person could pay a fake vendor, and offered three options: split the tasks, a temporary firefighter ID with review, or a mitigating control with weekly review.'],
['int','What happened?'],
['you','<b>Result:</b> we chose the temporary ID for the deadline, reviewed by the controller, and removed it afterwards. The work was done on time and the risk was controlled and documented.'],
['int','What did you learn?'],
['you','<b>Lesson:</b> bring options, not only a refusal. If the director had insisted on permanent access, I would have escalated to the risk owner and recorded it. Remember to replace this with your own real story. The shape is: situation, action, result, lesson.']]);
SC('3.1',[['int','Walk me through an access request from start to finish.'],
['you','The user or manager raises a request in GRC Access Request Management with the role and a <b>business reason</b>. Straight away GRC runs <b>risk analysis</b> and attaches the result. Then the request goes through approvals: manager, role owner and, if a risk was found, the risk owner.'],
['int','What happens after approval?'],
['you','GRC <b>provisions</b> the roles to the backend system through the connector, and the user is notified. All steps, comments and dates are stored as an <b>audit trail</b>. That trail is what an auditor will ask for.'],
['int','Where does it usually go wrong?'],
['you','Approvers who cannot see the risk, or who click approve without reading. I make the risk result visible in the approval screen, block self-approval, and escalate delayed requests. The key points: request, risk analysis, approvals, provisioning, evidence.']]);
SC('3.2',[['int','How do you control joiners, movers and leavers?'],
['you','HR is the <b>source of truth</b>. <b>Joiners</b> get a standard role bundle for their job, requested and approved, not copied from a colleague. <b>Movers</b> get new access and must <b>lose the old access</b>, otherwise they collect roles over time, called access creep. <b>Leavers</b> are locked on the end date and their roles removed.'],
['int','How do you prove leavers are handled?'],
['you','I compare the HR leaver list with SAP users from SUIM, and check <b>last logon after the end date</b>. If a person who left on 30 September logged on in November, that is a serious finding: lock, remove roles and investigate.'],
['int','How do you prevent it?'],
['you','An <b>automated HR feed</b> into the identity or GRC system, so leaver events trigger locking, with a regular reconciliation as a backup. Manual emails are the weakest control.']]);
SC('3.3',[['int','How do you control emergency access?'],
['you','With <b>firefighter IDs</b>. A support person requests the ID with a specific reason and ticket, a controller approves, and it is valid for a short time only. While it is in use, <b>every action is logged</b>. Afterwards an independent controller reviews the log against the reason.'],
['int','What does a good review look like?'],
['you','The controller opens the session log and checks each action: does it match the stated reason? A session with reason "Urgent" that changed a vendor bank account and ran a payment at 2 a.m. should be challenged. The review is evidenced and done within a set time.'],
['int','What goes wrong?'],
['you','Weak reasons, long sessions, no real review, and reviewers who are the same people who used the ID. I set time limits, require specific reasons and tickets, and make the controller independent.']]);
SC('3.4',[['int','How do you run a periodic user access review?'],
['you','I define the scope, for example finance roles, and send each <b>role or data owner</b> a list of who has what. I add <b>last-use data</b> so they can see roles nobody has used. For each line the reviewer chooses keep or remove, and removals are <b>actioned and evidenced</b>.'],
['int','Why do reviews fail?'],
['you','Huge lists nobody reads, rubber-stamping everything in minutes, and no follow-up on removals. I keep lists small and focused, show usage, track completion, chase overdue reviews, and confirm the removals really happened.'],
['int','What do auditors want?'],
['you','Proof that the review covered the right population, was done by the right person, decisions were recorded, and removals were completed. In GRC the user access review workflow keeps all of that as evidence.']]);
SC('3.5',[['int','How is an MSMP workflow built, and what does each part do?'],
['you','MSMP is the workflow engine behind GRC access requests. I build a <b>process</b>, for example the standard access request. Inside it I define a <b>path</b>, which is the route a request takes. A path has <b>stages</b>, the approval steps, such as manager, role owner, risk owner and security. Each stage has an <b>agent</b>, the person or group who approves it.'],
['int','How does a request choose its route?'],
['you','Through <b>rules</b>, built in BRF+. A rule looks at the request and decides which path or stages apply. Example: the risk-owner stage only runs when risk analysis found a conflict. A clean request skips it, so approvals stay quick.'],
['int','What else do you configure?'],
['you','<b>Initiators</b> (what starts a process), <b>notifications</b>, and <b>escalation</b> if an approver is slow. Then I <b>test every route</b>: clean request, request with risk, firefighter request. The design principle: match the company\'s approval authority, add control where risk is real, avoid bottlenecks.']]);
SC('3.6',[['int','GRC shows old data. How do you find the cause?'],
['you','GRC does not hold the users and roles itself. It reads them from the backend systems through <b>connectors</b>, over RFC, and refreshes them with <b>synchronisation jobs</b>. If a job fails, GRC works on old data and risk analysis misses new conflicts. So I look at the connector and the job logs.'],
['int','What is the most common failure?'],
['you','A <b>locked or expired RFC user</b> on the connection, or a changed password. The job log says something like "RFC user locked". I unlock or replace the user, <b>test the connection</b>, and rerun the role import and user sync jobs.'],
['int','How do you stop it happening again?'],
['you','Monitor job logs and alert on failures, use a technical user with a non-expiring password under proper control, and document the connector design. The point to remember: stale data means unreliable analysis, so the sync is a security control, not just a technical job.']]);

SC('4.1',[['int','How is access to Fiori apps controlled?'],
['you','Fiori has two layers and you need both. The front-end layer decides what the user <b>sees</b>: <b>catalogs</b> hold the apps (tiles and target mappings), <b>spaces and pages</b> arrange them on the launchpad, and a role assigns the catalogs and spaces to the user. The back-end layer decides what the user may <b>do</b>: the OData service authorization (S_SERVICE) and the normal authorization objects of the business data.'],
['int','So if I hide a tile, the user is safe?'],
['you','No. Hiding a tile is not security. If the user is still allowed to call the OData service and the backend objects pass, they can open the app by its link. Real control is the small catalog <b>and</b> the backend authorization.'],
['int','What does good design look like?'],
['you','Small task-based catalogs, for example only the six payables apps a clerk needs, not a catalog of 184 apps. The Launchpad content tool (/UI2/FLPD_CUST) shows what a catalog contains, and I check each catalog against real use. Summary: catalog and space for what is visible, service and backend objects for what is allowed, both kept small.']]);
FN('4.1',['<b>Role:</b> the PFCG role carries the catalog and space assignment. It is the link between the user and everything below.','<b>Catalog:</b> a set of apps (tiles and target mappings). It decides which apps are available to a user. Keep it small and task based.','<b>Space and page:</b> the layout the user sees on the launchpad. It organises, but it does not protect.','<b>Backend authorization:</b> service authorization and business objects. This is the real control, because it is checked even if a link is opened directly.'],
['The clerk\'s role carries a catalog called Z_FI_BC_ALL_APPS. Opening it in the Launchpad content tool shows 184 apps.','The clerk only works with six payables apps. The other 178 are access with no business need, and each could bring risk.','Build a small catalog with just the six apps and assign it. Fewer apps means a smaller review and fewer SoD conflicts.','Assign the new catalog to the role, then test as the clerk. Also confirm the backend objects, because hiding a tile does not stop a direct call.']);
SC('4.2',[['int','A user says a Fiori app shows an error. How do you work out why?'],
['you','First decide: is it a <b>front-end</b> problem or a <b>back-end</b> problem? If the tile is missing, the catalog or space is not assigned. If the tile appears but the app fails with an error such as 403, the OData service or a backend authorization is missing. That one question halves the search.'],
['int','What tools do you use?'],
['you','On the gateway side, <b>/IWFND/ERROR_LOG</b> shows the failed service call: time, service, user and error. For example API_PAYMENT with 403 and a missing S_SERVICE check. On the backend side, <b>SU53</b> or a trace (STAUTHTRACE) shows the missing object and value.'],
['int','What is the fix?'],
['you','Add the service to the role or assign the missing catalog, <b>through the approved change route</b>: check the request, check it creates no SoD conflict, change in development, test, transport. Then ask the user to retry. I never solve it by giving a broad role.']]);
FN('4.2',['<b>User error:</b> get the exact app, the time, and what the user saw. A screenshot helps.','<b>Tile or service?</b> Missing tile points to catalog or space. A visible tile with an error points to service or backend authorization.','<b>Gateway log and SU53:</b> /IWFND/ERROR_LOG names the failing service. SU53 or a trace shows the missing backend object.','<b>Fix and retest:</b> change the role by the approved route, then confirm the user can now complete the task.'],
['The call returns 403, which means the server refused it because of authorization.','The error log names the service, for example API_PAYMENT, and the user. Now you know what was blocked.','The log shows the service authorization S_SERVICE is missing from the role, and the catalog is not assigned.','Add the missing service and catalog through approval and transport, then retest as the user.']);
SC('4.3',[['int','What changes for security when a company moves from ECC to S/4HANA?'],
['you','Several things. <b>Business Partner</b> replaces separate vendor and customer masters, so transactions such as XK01 and FD01 are replaced by BP and its authorization objects. Many other transactions are simplified or replaced. And Fiori apps become the main interface, so catalogs and spaces matter.'],
['int','How do you know exactly what changed?'],
['you','From the <b>simplification list</b> and the simplification item check, which show each changed area and its effect. For security I read the items that touch transactions and authorization objects used in our roles.'],
['int','What do you do about it?'],
['you','Rebuild affected roles, update the SoD ruleset with the new actions, such as BP in the vendor function, retest with real users, and clean up unused access while doing it. If the SoD rules are not updated, conflicts through the new transactions are invisible.']]);
FN('4.3',['<b>Simplification item:</b> a documented change in S/4HANA, for example vendors and customers becoming business partners.','<b>Changed objects:</b> the new transactions and authorization objects replacing old ones, found from the simplification list.','<b>Rebuild roles:</b> replace old transactions in the roles, regenerate profiles and test.','<b>Update SoD rules:</b> add the new actions to the risk functions and rerun the analysis so conflicts are still detected.'],
['An ECC role still contains XK01 to maintain vendors.','In S/4HANA vendors are business partners, maintained through BP.','Replace XK01 with BP in the role, check the authorization objects and regenerate.','Add BP to the vendor function in the ruleset and rerun the analysis. Without this step conflicts are invisible.']);
SC('4.4',[['int','How is security different in S/4HANA public cloud?'],
['you','You do not use PFCG or write roles from authorization objects. Access is built from <b>business catalogs</b> (sets of apps and services), grouped into <b>business roles</b> in the <b>IAM apps</b>, and assigned to business users. SAP delivers the catalogs, and you combine them.'],
['int','How do you limit what a user can see?'],
['you','With <b>restriction types</b> on the business role, for example company code or plant. A role with no restriction gives every company, which is broad. So I choose the smallest catalogs and add restrictions such as company code 1000.'],
['int','What remains your responsibility?'],
['you','Designing roles by job, reviewing them, running SoD analysis (for example with IAG), and managing users through the identity service. The tools differ, but the principles are the same: least privilege, owners, reviews, evidence.']]);
FN('4.4',['<b>Business user:</b> the person who logs in, managed through the identity service.','<b>Business role:</b> groups business catalogs for a job, for example Accounts Payable Accountant. It replaces the PFCG role.','<b>Business catalogs:</b> sets of apps and services delivered by SAP. You combine them rather than editing authorization objects.','<b>Restrictions:</b> limit values such as company code. No restriction means all values.'],
['BR_FIN_ALL grants all finance catalogs.','It also has no restriction, so the user reaches every company code.','Replace it with a narrower role and add a restriction to company 1000.','Test with a real test user and confirm the user can do the job but nothing more.']);
SC('4.5',[['int','How do you migrate roles from ECC to S/4HANA?'],
['you','I start with a <b>comparison</b>: which transactions in the old role no longer exist or were replaced in S/4HANA. The role comparison list shows, for example, XK01 replaced by BP, FB60 kept and a Fiori app added. That list is my work plan.'],
['int','Then?'],
['you','I replace the changed transactions, regenerate the profile, and <b>use the migration to clean up</b>: remove access nobody uses, split oversized roles and fix SU24. It is the best chance to improve, because every role is being touched anyway.'],
['int','How do you prove it works?'],
['you','Test with real users from each department, rerun the SoD analysis because new transactions can create new conflicts, and keep the results as evidence. Order: compare, replace, clean, test, rerun SoD.']]);
FN('4.5',['<b>Compare roles:</b> list every transaction in the ECC role and its S/4HANA status.','<b>Replace changed items:</b> swap removed transactions, such as XK01, for their replacements.','<b>Clean unused:</b> remove access that is never used and split oversized roles.','<b>Test and SoD:</b> real-user tests plus a new risk analysis, kept as evidence.'],
['The comparison finds XK01 in the role. It does not exist in S/4HANA for this purpose.','Business Partner (BP) replaces it. The role menu and authorization data must change.','Regenerate the profile. While there, remove any other unused transactions.','Test with a real user and rerun the risk analysis. Keep both as evidence.']);
SC('4.6',[['int','How do you handle security during testing, cutover and hypercare?'],
['you','In <b>user acceptance testing</b> I test roles by job with real testers and a test matrix: role, tester, result, defect. Failed tests, such as a treasury role missing a payment object, are fixed and retested before go-live.'],
['int','What about cutover?'],
['you','I <b>freeze role changes</b> before cutover so the tested design is the one that goes live, and I prepare emergency access and a support route for go-live day. All changes after the freeze need approval.'],
['int','And hypercare?'],
['you','The weeks after go-live. I log every authorization issue and look for <b>patterns</b>. One user with an error is a request. The same error for five users is a role design gap, so I fix the role once. I report the trend to management and close the issues with evidence.']]);
FN('4.6',['<b>UAT by role:</b> real users test their job with the role, using a matrix and recorded results.','<b>Role freeze:</b> no unapproved role changes before go-live, so the tested design is the live design.','<b>Cutover:</b> the move to production. Emergency access and support are ready.','<b>Hypercare trend:</b> log every issue, group them, and fix patterns in the role, not user by user.'],
['Day 1: a user gets no authorization for payment run F110 and the role is updated.','Day 2: a second user has the same problem.','Two cases with the same cause is a pattern, so the design is missing something.','Fix the role once, test it, and note it in the hypercare log. Do not patch each user.']);
SC('4.7',[['int','Tell me about a mistake you made in production.'],
['you','<b>Situation:</b> I changed a role directly in production to fix an urgent user problem, without a transport and without approval. It worked, but the change was untracked and the production role no longer matched development.'],
['int','What did you do?'],
['you','<b>Action:</b> I told my manager the same day, before anyone else found it. I restored the role from development, raised a proper change with approval, and tested it. I also checked that nothing else was affected.'],
['int','And the result and lesson?'],
['you','<b>Result:</b> no data impact, and the fix went through the correct route. <b>Lesson:</b> own it quickly, fix it properly, and prevent repeats: I added a control that alerts on direct role changes in production. Use your own real story, and always end with the prevention step.']]);
FN('4.7',['<b>Situation:</b> state the facts briefly, no excuses.','<b>Action:</b> own it, report it early, and restore the correct state.','<b>Result:</b> what was the actual impact, and how was it closed?','<b>Lesson:</b> what you changed so it cannot happen again.'],
['A role was changed directly in production.','You reported it to your manager the same day and restored it.','No data impact, and a proper approved change replaced the fix.','A new alert now flags direct role changes in production.']);
SC('5.1',[['int','Explain IAS, IPS and SSO.'],
['you','<b>IAS</b>, the Identity Authentication Service, is where users prove who they are. It trusts the company\'s identity provider, so people log in with their normal corporate account. That is <b>SSO</b>, single sign-on: one login, many applications. <b>MFA</b>, a second factor, is enforced there.'],
['int','What is IPS?'],
['you','The <b>Identity Provisioning Service</b>. It creates, changes and deletes users in the target systems automatically from a source such as the corporate directory. So when HR ends someone\'s employment, the user disappears from the connected systems.'],
['int','What do you check as a consultant?'],
['you','That every application trusts the corporate identity provider, MFA is on, there are no local passwords such as in the BTP cockpit, and provisioning is automatic, so leavers are removed without a manual step. Local passwords with no MFA is a finding.']]);
FN('5.1',['<b>Corporate IdP:</b> the company directory, the source of identity.','<b>IAS:</b> authenticates the user and applies MFA, trusting the IdP.','<b>IPS:</b> provisions and removes users in target systems automatically.','<b>Apps with SSO:</b> the applications users reach with one login.'],
['The BTP cockpit uses local passwords.','MFA is switched off for it, so a stolen password is enough.','Switch trust to the corporate identity provider so one account and one policy apply.','Enforce MFA, and use IPS so leavers lose access automatically.']);
SC('5.2',[['int','What is Identity Access Governance, IAG?'],
['you','IAG is SAP\'s cloud service for access governance. It does for cloud and hybrid landscapes what Access Control does on premise: <b>access analysis</b> for SoD and critical access, <b>access requests</b> with approvals, and <b>periodic reviews</b>. It can read roles and users from cloud systems and from on-premise systems together.'],
['int','What do you look at on its dashboard?'],
['you','Open requests, <b>high risks</b>, overdue reviews and role usage. If it shows six high risks in cloud applications, I open each one, see the user, the conflicting roles and the rule, and decide.'],
['int','What do you do about a risk?'],
['you','The same logic as in ARA: <b>remove</b> the access if it is not needed, or <b>mitigate</b> with a real control and an owner, and record the decision. IAG gives the one view across cloud and on premise that auditors increasingly ask for.']]);
FN('5.2',['<b>Collect access:</b> IAG reads users and roles from connected cloud and on-premise systems.','<b>Analyse risk:</b> it applies SoD and critical access rules.','<b>Request and approve:</b> new access goes through a workflow with the risk result visible.','<b>Review:</b> owners confirm or remove access on a schedule.'],
['The dashboard shows six high risks.','Open one and see the user, the roles and the rule that triggered it.','Decide: remove the access, or mitigate with an owned control.','Record the decision and evidence so the auditor can follow it.']);
SC('5.3',[['int','How do you secure SAP BTP?'],
['you','Access is built from <b>role templates</b> in each application, which become <b>roles</b>, which are grouped into <b>role collections</b>. A role collection is assigned to users, usually through <b>identity provider groups</b>, so group membership in the corporate directory decides access. That keeps the user list in one place.'],
['int','What do you review?'],
['you','The <b>administrator</b> collections first, such as Subaccount Administrator, because they control the account. If nine people hold it, I ask why. Admin access should be few, named, reviewed, and not shared.'],
['int','What else?'],
['you','Avoid local users, enforce MFA through the identity service, review role collections regularly, and keep evidence. The chain to remember: role template, role, role collection, identity provider group, user.']]);
FN('5.3',['<b>Role template:</b> defined by the application, listing what it allows.','<b>Role:</b> an instance of a template in your subaccount.','<b>Role collection:</b> a bundle of roles assigned to users.','<b>IdP group:</b> the corporate group that is mapped to the collection, so membership drives access.'],
['Nine people hold Subaccount Administrator.','That is broad control over the account for too many people.','Limit it to the few people who need it, and use named accounts only.','Review the collection regularly and keep the evidence.']);
SC('5.4',[['int','How do you secure a HANA database?'],
['you','Start with <b>privileges</b>. HANA uses system privileges, object privileges and roles. I apply least privilege: application users get only what the app needs, and the powerful <b>SYSTEM</b> user is not used for daily work.'],
['int','What do you look for in a review?'],
['you','Users with powerful privileges such as SYSTEM or DATA ADMIN, especially unused ones. A technical user such as DBA_TEMP that has never logged on but holds admin rights is a clear finding. I remove it or restrict it.'],
['int','How is activity tracked?'],
['you','With <b>audit policies</b> that record sensitive actions: privilege changes, logons, data access to sensitive tables. The audit trail is kept and reviewed. Summary: least privilege, no daily SYSTEM, controlled technical users, audit on.']]);
FN('5.4',['<b>Users:</b> named people and technical users, each with an owner.','<b>Privileges:</b> system and object privileges. The more powerful, the fewer holders.','<b>Audit policy:</b> records sensitive actions as evidence.','<b>Review:</b> check privileges and usage regularly and remove what is not needed.'],
['DBA_TEMP holds SYSTEM and DATA ADMIN privileges.','It has never been used, so the access carries risk with no purpose.','Remove or restrict the user and confirm no application depends on it.','Switch on audit policies so privilege use leaves a trail.']);
SC('5.5',[['int','How do you secure SuccessFactors?'],
['you','Access works through <b>permission roles</b>, which say what a user can do, and <b>target groups</b>, which say about whom. For example an HR business partner can view employees in their own region only, not everyone. Sensitive fields such as salary are controlled separately at field level.'],
['int','What do you check?'],
['you','Roles with a target group of <b>Everyone</b>, roles that expose salary or personal data, and administrator roles. An HR Admin role with Everyone and salary visible is too wide. I narrow the group, restrict the fields and review who holds it.'],
['int','Why is HR data special?'],
['you','It is personal and often regulated, so privacy law applies, and leaks cause real harm to people. I apply least privilege, review regularly, and log access to sensitive data.']]);
FN('5.5',['<b>Permission role:</b> the actions a user can perform in the system.','<b>Target group:</b> the population the user can act on, such as their own region.','<b>Field permissions:</b> control sensitive data such as salary.','<b>Review:</b> check who holds broad and admin roles on a schedule.'],
['HR Admin is assigned a target group of Everyone.','It also shows salary, so many holders can read pay data for the whole company.','Narrow the target group to what the job needs, and hide sensitive fields.','Review the holders regularly and keep the evidence.']);
SC('5.6',[['int','How do you manage security patches and audit logs?'],
['you','The <b>Security Audit Log</b> is switched on and configured in SM19, and read in SM20. It records logons, failed logons, transaction starts and critical changes. It has to be switched on, retained for the required time and protected, because it is the evidence when something goes wrong.'],
['int','And patching?'],
['you','SAP publishes <b>security notes</b>. I track which are implemented and which are missing, rank them by criticality, and patch on a <b>controlled schedule</b>: assess impact, test in a non-production system, then transport to production. A missing critical note is a finding.'],
['int','What do auditors want?'],
['you','Evidence that the log is on and retained, that notes are tracked and applied on time, and that changes followed the change process. So I keep a note list with status and the change record for each patch.']]);
FN('5.6',['<b>Notes list:</b> shows implemented and missing security notes with their priority.','<b>Assess:</b> check which systems and components the note affects.','<b>Test:</b> apply in a test system first and confirm nothing breaks.','<b>Transport and evidence:</b> move through change control and keep the record.'],
['A critical note is missing in the notes list.','Assess which systems it affects and how serious it is.','Test it in a non-production system.','Transport to production with an approval and keep the evidence.']);
// ===== TEACHING STORIES + deeper flowchart/animation: Weeks 6 to 8 =====
SC('6.1',[['int','What does an external auditor want as evidence of user access controls?'],
['you','Evidence that is <b>traceable, complete and accurate</b>. For each report I show the <b>system</b>, the <b>report or transaction</b>, the <b>parameters</b> used and the <b>run date</b>. A bare screenshot with no run date is weak, because the auditor cannot tell what it covers or when it was taken.'],
['int','What is the pack for user access?'],
['you','The <b>active user list</b> from SUIM with its run date, the <b>privileged users</b> list, the evidence of the <b>access reviews</b> (who reviewed, when, decisions, removals completed), and the approved <b>access requests</b> for a sample of new access. Together they answer: who has access, was it approved, was it reviewed?'],
['int','What if the auditor challenges a report?'],
['you','I can rerun it in front of them and get the same result. That is the test of information produced by the entity, IPE: the report is complete and accurate, and I can prove it. Weak evidence gets fixed by rerunning with the date visible and keeping the output.']]);
FN('6.1',['<b>Scope:</b> agree which systems, controls and period are covered.','<b>Run reports:</b> use standard reports, with parameters and run date visible.','<b>Review and sign-off:</b> the owner checks the output and signs, so the review is evidenced.','<b>Hand over:</b> deliver complete, labelled evidence and keep a copy.'],
['The privileged users evidence is a screenshot.','It shows no run date, so the auditor cannot tell what it covers.','Rerun the report and make the system, parameters and date visible.','Keep the output with the sign-off so it can be shown again.']);
SC('6.2',[['int','The auditor reports three users with SAP_ALL. How do you respond?'],
['you','First I <b>confirm the facts</b> in SUIM: who are the three, what type, are they locked, when did they last log on? Sometimes the finding is wrong, for example locked or expired accounts, and that changes the response. I never argue before checking.'],
['int','And if the finding is correct?'],
['you','Remediate. For each user: remove SAP_ALL if not needed, or move the need to <b>emergency access</b> that is logged and reviewed. If one must stay for a short time, document the reason, owner and end date. I agree remediation <b>dates</b> with the audit lead.'],
['int','How do you close it?'],
['you','I <b>rerun the analysis</b> to prove it is fixed and send the evidence with the list and date. Then I look at the root cause, why were three people given SAP_ALL, and fix the process, such as a request control. Facts, remediate, prove, prevent. And the tone is as a partner, not a defender.']]);
FN('6.2',['<b>Confirm facts:</b> check the finding against SUIM before replying.','<b>Remove or justify:</b> take the access away, or document a controlled exception.','<b>Rerun:</b> run the analysis again to show the result has changed.','<b>Close with evidence:</b> send proof and agree the closure date with audit.'],
['The auditor reports three users with SAP_ALL.','You check SUIM and confirm the three and their status.','Remove the access or use controlled emergency access.','Rerun the report and send the proof to the auditor.']);
SC('6.3',[['int','How do you control security changes?'],
['you','Every change follows one path: a <b>request</b>, an <b>approval</b>, build in <b>development</b>, <b>test</b>, then a <b>transport</b> to production. Each transport carries a reference to its approved change request, so it can be traced from the production import back to who approved it and why.'],
['int','How do you check it?'],
['you','In <b>STMS</b> I look at the production import queue and compare each transport with the change records. A transport with no approval, like a role change marked "urgent", is a finding. I hold the import until it is approved and evidenced.'],
['int','What about real emergencies?'],
['you','A defined emergency route: an authorised person approves quickly, the change is made, and it is <b>reviewed afterwards</b> with the approval and testing recorded. Direct changes in production are blocked or alerted. The principle: no change without approval and evidence.']]);
FN('6.3',['<b>Request and approval:</b> a recorded change with a business reason and an approver.','<b>Develop:</b> the role is changed in development, never directly in production.','<b>Test:</b> check the change works and creates no new conflict.','<b>Transport to production:</b> imported only with a matching approved record.'],
['Transport DEVK900117 is in the production queue.','No approval record exists for it.','Hold the import in STMS until it is approved.','Get the approval and the test evidence, then import and record it.']);
SC('6.4',[['int','What is in SAP Process Control and how do you use it?'],
['you','Process Control, PC, manages the <b>controls</b> of the company. The <b>control library</b> lists each control with its process, the risk it addresses, its type (manual or automated), its owner and how it is tested. For example C-AP-02 is an automated three-way match in payables, owned by IT.'],
['int','What is an assessment?'],
['you','A check that the control works. A <b>design assessment</b> asks whether the control would prevent or detect the risk. An <b>operating assessment</b> asks whether it really ran during the period, using test results and evidence. Owners complete self-assessments, and testers test.'],
['int','What do you deliver to the business?'],
['you','A clear control library, assessments with results, and issues with owners and due dates. Automated controls can be monitored continuously, which is the next topic. Remember: control, risk, owner, test, evidence.']]);
FN('6.4',['<b>Process and risk:</b> what the business does, and what could go wrong.','<b>Control and owner:</b> what is done to address the risk, and who is accountable.','<b>Assess:</b> design and operating tests, with results recorded.','<b>Report:</b> issues, status and sign-off for management.'],
['Open control C-AP-02, an automated three-way match.','Its objective is to pay only what was ordered and received.','IT owns it, because it is a system control.','It is tested annually and monitored continuously.']);
SC('6.5',[['int','How do continuous monitoring and certification work in Process Control?'],
['you','Monitoring uses <b>rules</b> that scan system data on a schedule for exceptions. For example one rule looks for duplicate invoices, another for payments above an approved limit. If a rule finds four payments above the limit, it creates four <b>exceptions</b>.'],
['int','What happens with the exceptions?'],
['you','Each becomes an <b>issue</b> assigned to an owner with a due date. The owner investigates, fixes or justifies it and records the result. Overdue issues are escalated. This finds problems as they happen, not once a year in an audit.'],
['int','And certification?'],
['you','At the end of a period, control and process owners <b>sign off</b> that their controls operated and issues were handled. It gives management and auditors assurance, with a record of who confirmed what and when.']]);
FN('6.5',['<b>Rule runs:</b> automatic checks of system data on a schedule.','<b>Exception:</b> a record that breaks the rule, such as a payment above the limit.','<b>Issue to owner:</b> assigned with a due date and tracked to closure.','<b>Sign-off:</b> owners certify each period that controls operated.'],
['The payment-above-limit rule finds four exceptions.','Each one is assigned to an owner with a due date.','The owner investigates and records the result and fix.','At period end owners sign off that controls worked and issues were handled.']);
SC('6.6',[['int','How do Risk Management and controls connect?'],
['you','In Risk Management each <b>risk</b> is rated for <b>impact</b> and <b>likelihood</b>, and shown on a <b>heat map</b>. Each should be linked to the <b>controls</b> that reduce it. For example payment fraud links to the vendor review and the three-way match. The link shows what protects each risk.'],
['int','What if a high risk has no control?'],
['you','That is a gap. On the heat map a cloud outage rated high impact with no linked control stands out. I discuss with the owner: build or link a control, accept it formally, or transfer it, for example insurance or a provider commitment.'],
['int','What is a KRI?'],
['you','A <b>key risk indicator</b> is a measure that warns early, such as downtime minutes per month with a threshold of 60. When it is breached, the risk is escalated for action. In short: rate, link to controls, measure with KRIs, escalate breaches.']]);
FN('6.6',['<b>Risk:</b> a described event that could harm the business.','<b>Rate:</b> impact and likelihood place it on the heat map.','<b>Link controls:</b> record which controls reduce the risk.','<b>KRI and escalate:</b> measure with a threshold and escalate when breached.'],
['The cloud outage risk is rated high impact.','No control is linked to it.','Link an existing control or create one with an owner.','Add a KRI such as downtime minutes with a threshold.']);
SC('7.1',[['int','How do you handle administrators in a clearance-restricted environment?'],
['you','Privileged access is only given to people with the <b>required clearance</b>. A request for production admin access first checks the clearance status. If clearance is pending, access is refused or limited to a non-production system until it is granted.'],
['int','How do you maintain it?'],
['you','With an <b>administrator register</b> listing every admin, their clearance, the access they hold and the date of the last review. A contractor with pending clearance and production admin access, never reviewed, is a clear finding: remove it.'],
['int','What about emergencies?'],
['you','Emergency access through controlled IDs that are time limited, logged and reviewed afterwards by an independent person. The admin team is also reviewed each quarter. Clearance first, least privilege, logging, regular review.']]);
FN('7.1',['<b>Clearance check:</b> confirm status before any privileged access.','<b>Approve:</b> the owner approves for a defined need.','<b>Time-limited access:</b> access expires, and emergency use is logged.','<b>Quarterly review:</b> re-confirm every administrator and their clearance.'],
['CONTRACT2 has production admin access.','Their clearance is still pending, so access should not exist.','Remove it or limit to a non-production system.','Add them to the quarterly register review and record it.']);
SC('7.2',[['int','How do you map NIST, NCSC or FedRAMP requirements to SAP?'],
['you','I build a <b>control mapping sheet</b>. In one column the framework requirement, for example NIST AC-2 account management. In the next, the SAP control that meets it, such as the joiner-mover-leaver process and SUIM reports. In the third, the <b>evidence</b> that shows it works.'],
['int','What do you do when there is no match?'],
['you','Record it as a <b>gap</b>. If NIST AU-2 needs audit events and the Security Audit Log is not configured, that is a gap with an owner and a date. I configure the log, collect the output as evidence and close the gap.'],
['int','Why one sheet?'],
['you','Frameworks overlap. One mapping lets me reuse the same evidence for several frameworks, saving effort and keeping answers consistent. I keep it current as frameworks and the SAP landscape change.']]);
FN('7.2',['<b>Framework control:</b> the requirement as the framework states it.','<b>SAP control:</b> the SAP setting or process that satisfies it.','<b>Evidence:</b> the output that shows the control operates.','<b>Gap and owner:</b> any requirement without a control gets an owner and a date.'],
['NIST AU-2 requires audit events to be recorded.','The SAP control is the Security Audit Log.','It is not configured, so a gap is raised.','Configure it, collect the output as evidence and close the gap.']);
SC('7.3',[['int','What matters for a sovereign cloud or data residency requirement?'],
['you','Three things. <b>Region:</b> data must stay in a defined location, such as the EU. <b>Keys:</b> encryption keys may need to be <b>customer managed</b>, so the provider cannot decrypt alone. <b>Administration:</b> who may administer, and from which country.'],
['int','How do you check?'],
['you','I read the settings. Data region EU, Frankfurt meets an EU-only rule. Provider-managed keys do not meet a customer-managed requirement, so I record a gap.'],
['int','And the fix and the proof?'],
['you','Move to customer-managed keys, restrict administration to allowed locations, and keep <b>evidence</b> of region, keys and access. Residency without proof is not compliance. Region, keys, admins, evidence.']]);
FN('7.3',['<b>Region:</b> where data and backups are stored.','<b>Keys:</b> who controls the encryption keys.','<b>Admin location:</b> which people and countries may administer.','<b>Evidence:</b> settings, logs and reports that prove all three.'],
['The data region is EU, Frankfurt, which meets the requirement.','The keys are provider managed, but the rules require customer managed keys.','Record the gap with an owner and a date.','Move to customer-managed keys, then collect evidence of the change.']);
SC('7.4',[['int','A regulator asks for evidence. How do you handle it?'],
['you','I start by <b>confirming the scope in writing</b>: which systems, which period, which format. Unclear scope causes late and wrong answers. I name <b>one point of contact</b> so answers are consistent.'],
['int','How do you collect and send it?'],
['you','I collect <b>complete and accurate</b> evidence from the source, review it internally, and send it with a cover note. I keep a <b>tracker</b> of every request: owner, due date, status, what was sent. If one is late, I say so and give a date.'],
['int','What if the evidence looks bad?'],
['you','I send it as it is. <b>Evidence is never altered or hidden</b>. I explain the context and the remediation plan. Trust with a regulator is built on accuracy, and altering evidence is far worse than the finding.']]);
FN('7.4',['<b>Confirm scope:</b> agree systems, period and format in writing.','<b>Collect:</b> pull evidence from the source system.','<b>Review and send:</b> check completeness and accuracy before delivery.','<b>Log and follow up:</b> record each request and answer in the tracker.'],
['The privileged activity log request is late.','The scope was unclear, so work was delayed.','Confirm the scope in writing with the regulator.','Send the evidence and record it in the tracker.']);
SC('8.1',[['int','What is your security and GRC strategy for a company like Thornfield?'],
['you','I start from <b>business risk</b>, not tools: where can we lose money, fail an audit, or breach a regulation? From that I build a <b>phased roadmap</b>, for example Year 1 role clean-up and IAG rollout, Year 2 Zero Trust and cloud identity, Year 3 AI-assisted reviews.'],
['int','What makes a roadmap credible?'],
['you','Every item has an <b>owner</b>, a <b>budget</b> and a <b>measure</b>. A Year 2 item with no budget will not happen, so I raise it early. I tie each item to a risk the sponsor cares about.'],
['int','How do you keep it alive?'],
['you','Quarterly review with the sponsor: progress against measures, changes in risk, and re-prioritisation. Architecture follows: GRC for access, IAG for cloud, identity service for login, Process Control for controls. Risk, roadmap, ownership, review.']]);
FN('8.1',['<b>Business risk:</b> the starting point of every priority.','<b>Roadmap:</b> phased initiatives, so change is manageable.','<b>Owners and budget:</b> without these an item will not deliver.','<b>Quarterly review:</b> check progress and re-prioritise with the sponsor.'],
['The Year 2 Zero Trust item has no budget.','It also has no owner or measure.','Assign an owner and secure the budget, or move it.','Review it again next quarter with the sponsor.']);
SC('8.2',[['int','You manage vendors and an offshore team. How do you keep control?'],
['you','Through clear <b>SLAs</b> in the contract, for example requests in two days and incidents in four hours, measured on a dashboard. I hold a <b>regular service review</b> with each vendor. When a service is at 81 percent against a target, I raise it with data, agree a recovery plan and use the contract remedies if it continues.'],
['int','And security of the offshore team?'],
['you','They get the <b>minimum access</b> for their tasks, the same SoD rules as anyone, no shared IDs, and their work is reviewed. I check their access in the regular reviews.'],
['int','How do you build the team?'],
['you','Define roles and responsibilities, mix experience levels, document procedures so work does not depend on one person, plan training and give people growth paths. A well-run team is the best control.']]);
FN('8.2',['<b>SLA:</b> measurable service targets in the contract.','<b>Monitor:</b> track results on a dashboard each period.','<b>Review:</b> meet the vendor regularly and agree actions.','<b>Remedy:</b> apply contract remedies if performance does not recover.'],
['The managed service is at 81 percent against its incident target.','Hold a service review and present the data.','Agree a recovery plan, and apply remedies if it continues.','Track recovery over the next periods and report the trend.']);
SC('8.3',[['int','How do you report to executives?'],
['you','With <b>few KPIs</b>, the trend, the business impact and <b>one clear ask</b>. For example: high risks open 12 against a target below 5, reviews on time 74 percent against 100 percent. I pick the one furthest from target and explain it in plain words.'],
['int','Give me the message.'],
['you','"Access reviews are 74 percent complete against a target of 100. Late reviews mean old access stays, which is an audit risk. I need you to ask the owners of the late reviews to finish by month end." That says what, why it matters and what I need.'],
['int','What do you avoid?'],
['you','Technical jargon, fifty KPIs, and bad news with no plan. Executives decide on risk and money, so I translate security into those terms and always bring a recommendation.']]);
FN('8.3',['<b>Few KPIs:</b> choose the measures that drive decisions.','<b>Trend:</b> show direction, not only today\'s number.','<b>Impact:</b> explain what the number means for the business.','<b>One ask:</b> finish with the decision you need.'],
['Reviews on time are 74 percent against a 100 percent target.','The cause is owners completing late.','The impact is old access remaining and audit risk.','The ask is for the sponsor to chase the owners.']);
SC('8.4',[['int','What would you do in your first 90 days as security lead?'],
['you','<b>Days 1 to 30: listen and map.</b> Meet the sponsor, audit, IT and business owners, read the last audit findings, and map systems, roles, tools and top risks. I deliver a findings list.'],
['int','Then?'],
['you','<b>Days 31 to 60: plan and quick wins.</b> Agree a short priority list with the sponsor and deliver one or two visible wins, for example removing unused SAP_ALL access. Quick wins build trust before large change.'],
['int','And the last phase?'],
['you','<b>Days 61 to 90: deliver and report.</b> Start the top priorities, show first results with numbers, and present the roadmap for the year. Listen first, win early, agree priorities, show results.']]);
FN('8.4',['<b>Days 1 to 30:</b> listen, learn the landscape, and list findings.','<b>Days 31 to 60:</b> agree priorities and deliver quick wins.','<b>Days 61 to 90:</b> start delivery and measure results.','<b>Report:</b> show the sponsor what changed, with numbers.'],
['At day 31 the findings list is ready.','Agree a short priority list with the sponsor.','Deliver one visible quick win.','The win builds trust for bigger changes later.']);
SC('8.5',[['int','How do you govern releases, and what is Zero Trust?'],
['you','For each release I read the <b>release notes</b> for security effects: new apps need catalogs, new APIs need restrictions, changed objects can break roles. A new API endpoint open to all users is flagged and restricted before go-live, and the roles are <b>tested</b> in a test system.'],
['int','And Zero Trust?'],
['you','A principle: <b>never trust, always verify</b>. Every request is authenticated and authorised whatever the network, access is <b>least privilege</b>, and you design assuming a breach is possible, so damage is limited and visible.'],
['int','How do the two connect?'],
['you','Release governance stops new risk entering, and Zero Trust shapes how access is designed: strong identity with MFA, small roles, logging and monitoring. Review, test, verify every request.']]);
FN('8.5',['<b>Release notes:</b> list new apps, APIs and changes.','<b>Security review:</b> find access effects of each change.','<b>Role test:</b> confirm roles work and nothing becomes too open.','<b>Go live:</b> only after the security gate is passed.'],
['A new API endpoint appears in the release.','By default it is open to all users.','Restrict it to the roles that need it.','Test it in a test system, then go live.']);
SC('8.6',[['int','Where does AI fit in access governance?'],
['you','AI can <b>spot unusual patterns</b>, such as a developer suddenly using HR data, and <b>speed up reviews</b> by ranking what needs attention. A report might give DEV2 a score of 91 for unusual access to HR data.'],
['int','Do you trust the score?'],
['you','As a <b>lead</b>, not a verdict. A person checks it, because there may be a good reason. The decision to remove or accept access stays with an accountable human, and the reason is logged.'],
['int','What do you govern?'],
['you','The model and its data: what it learns from, how it is changed, privacy and fairness, and that decisions can be explained to an auditor. AI helps people decide, it does not replace accountability.']]);
FN('8.6',['<b>Model scores:</b> the system ranks unusual access patterns.','<b>Person checks:</b> a reviewer investigates the high scores.','<b>Decision:</b> remove or accept, with a named decision-maker.','<b>Log and explain:</b> record the reason so it can be audited.'],
['DEV2 scores 91 for unusual access to HR data.','A person reviews the lead and asks the manager.','Decide to remove the access or accept it.','Log the decision and reason as evidence.']);
SC('8.7',[['int','How do you build a business case, and what are the three lines of defence?'],
['you','A business case sets <b>cost</b> against <b>quantified benefit</b> and <b>risk reduced</b>. For an access governance tool: cost 200,000, benefit audit hours saved (estimate them), high risks reduced from 12 to 4. A case with no estimated benefit will fail, so I put numbers on it.'],
['int','And the three lines?'],
['you','<b>First line:</b> business and IT owners who run the controls day to day. <b>Second line:</b> risk and compliance, who set the rules and oversee. <b>Third line:</b> internal audit, who give independent assurance to the board.'],
['int','Where does security sit?'],
['you','Mainly the first and second lines: operating security and setting the security policy. Audit sits independently, so I do not audit my own work. This clarity helps in asking for funding: show who owns which risk.']]);
FN('8.7',['<b>First line:</b> owners run controls and manage risk day to day.','<b>Second line:</b> risk and compliance oversee and challenge.','<b>Third line:</b> internal audit assures independently.','<b>Board:</b> receives the assurance and decides.'],
['The cost is 200,000.','The benefit of audit hours saved is missing.','Estimate the hours saved and their cost.','Present cost, benefit and risk reduced together.']);
SC('8.8',[['int','The company is acquiring another. What is your security approach?'],
['you','First <b>inventory</b> the acquired systems, users and roles. Then <b>map</b> their roles to our clean roles instead of copying. A role such as Finance Super with seven SoD conflicts must not be imported as it is.'],
['int','When do you connect the systems?'],
['you','Only after <b>SoD analysis</b> of the acquired users, so we do not import risk. For day one I plan controlled access: a small set of mapped roles, emergency access for integration staff, and the usual approvals.'],
['int','And for a divestiture?'],
['you','The reverse: identify what the departing business needs, give it a <b>clean separation</b>, remove access to our systems on the transfer date, and keep evidence. Inventory, map, analyse, connect for an acquisition. Separate cleanly for a sale.']]);
FN('8.8',['<b>Inventory:</b> list their systems, users and roles.','<b>Map roles:</b> match to clean roles, do not copy.','<b>SoD analysis:</b> find conflicts before connecting.','<b>Connect:</b> go live with a controlled day-one plan.'],
['The acquired Finance Super role has seven conflicts.','Do not copy it into our system.','Map users to clean roles that fit their jobs.','Run the SoD analysis before connecting anything.']);
SC('8.9',[['int','Tell me about a time you led through an audit failure.'],
['you','<b>Situation:</b> an audit finding showed access reviews had not been completed for two quarters. As the lead, I owned it. I told the CFO and the audit committee chair myself, before they heard it elsewhere.'],
['int','What did you do?'],
['you','<b>Action:</b> I found the cause: owners received huge lists with no usage data and nobody chased them. I reduced the lists, added last-use data, set due dates with escalation, and completed the backlog in six weeks, with evidence for audit.'],
['int','Result and lesson?'],
['you','<b>Result:</b> the finding closed at the next audit. <b>Lesson:</b> fix the process, not only the symptom, and tell leaders early. Use your own real story, and always show what you changed so it does not happen again.']]);
FN('8.9',['<b>Own it:</b> accept responsibility without blame.','<b>Tell early:</b> leaders hear bad news from you first.','<b>Fix the cause:</b> change the process, not only the symptom.','<b>Change the process:</b> add controls so it cannot repeat.'],
['An audit finding showed reviews were not completed.','You told leadership early and owned the issue.','You shortened lists, added usage data and set escalation.','The finding closed and the new process stayed.']);
// ===== deeper flowchart notes + animation steps: Weeks 0 to 3 =====
FN('0.1',['<b>Identity:</b> the login, usually single sign-on through the identity service. It proves who the person is.','<b>User:</b> the SAP account, created in SU01. It holds nothing until roles are assigned.','<b>Roles:</b> built in PFCG. They hold the menu and the authorizations the user receives.','<b>Objects:</b> templates with fields. The role fills them with values, such as activity and company code.','<b>Data:</b> the business data the user finally reaches, only if every field passes.','<b>GRC:</b> checks the access against a ruleset for conflicts, so risky combinations are found.'],
['The user logs in. In a cloud landscape this is through the identity service with single sign-on.','SAP looks up the roles assigned to this user. Everything the user can do comes from these roles.','When the user starts a transaction or app, SAP compares what it needs with the objects and values in the roles.','If every field matches the action is allowed. If one fails the user sees "no authorization", and SU53 shows which.']);
FN('0.2',['<b>Dialog:</b> a named person who logs on to the screen. This is the type to review most carefully.','<b>System:</b> used for background jobs and cannot log on interactively.','<b>Communication:</b> used for interfaces between systems, for example RFC.','<b>Service:</b> a shared technical use. Needs a clear owner and tight roles.','<b>Generic dialog IDs:</b> shared by several people. Avoid them, because actions cannot be traced to a person.'],
['The type tells you what the ID is for. A dialog user should be a named person, never a shared ID.','Valid through shows whether the account ever expires. 31.12.9999 means no end date, which is normal but should be checked for contractors.','Last logon shows whether the account is in use. Months of silence suggest it can be locked.','Roles show what the user can do. Read them against the person\'s job.','Profiles reveal SAP_ALL, which gives every authorization. On a dialog user this is a finding.']);
FN('0.3',['<b>User error:</b> note the exact action and time. The check must be read straight afterwards.','<b>SU53:</b> shows the last failed check: object, field, required and held values.','<b>STAUTHTRACE:</b> records all checks over a period, for cases SU53 does not explain.','<b>Fix in the role:</b> only after approval and a risk check, done in development and transported.'],
['SU53 names the object that failed, here F_BKPF_BUK, so you know which check refused the user.','It shows the field, here the company code BUKRS, so you know which value was wrong.','The program needed company code 2000. That is the required value.','The user only holds 1000. Before you add 2000, check the request is legitimate and creates no conflict.']);
FN('0.4',['<b>Your answer:</b> one answer must work for three listeners at once.','<b>Recruiter:</b> checks vocabulary and clarity. Use standard terms and a short structure.','<b>Hiring manager:</b> listens for judgement and business risk. Show why it matters.','<b>Supervisor:</b> listens for practical detail. Name the tools and the steps.','<b>Offer:</b> clear, risk-aware, practical answers are what lead to it.'],
['Signpost the answer: "There are three steps." This keeps you organised and helps the listener follow.','Link to the business risk, such as fraud or an audit finding. This is what the hiring manager listens for.','Name the real SAP tools, such as SU53, PFCG or ARA. This convinces the supervisor.','End with the decision: remove, mitigate or escalate, with who owns it. This shows leadership.']);
FN('1.1',['<b>The object:</b> a template for one type of check. F_BKPF_BUK checks accounting documents by company code.','<b>ACTVT:</b> the activity: 01 create, 02 change, 03 display, 06 delete.','<b>BUKRS:</b> the company code. The role lists the codes the user may work in.','<b>Other fields:</b> each object defines its own fields. All of them must pass.'],
['The program asks for activity 01, create, in company code 2000.','The activity field passes because the role contains 01.','The company code field fails because the role only holds 1000.','One failed field fails the whole check, and the user sees no authorization.']);
FN('1.2',['<b>Composite:</b> a bundle for one job. It holds no authorizations of its own, only a list of single roles.','<b>Single (enter invoices):</b> one task. Small and easy to review.','<b>Single (display reports):</b> another task, reusable in other jobs.','<b>Derived:</b> a copy of a parent role with different organizational values, such as company code 2000.'],
['Design the parent role once, with its menu and authorizations.','The derived role inherits the menu and authorizations, so any change to the parent flows down.','Only the organizational values are changed, for example BUKRS 2000. The duties stay identical.']);
FN('1.3',['<b>Transaction:</b> what you add to the role menu, such as FB60.','<b>SU24:</b> holds the proposals: which objects each transaction checks and with which defaults.','<b>PFCG:</b> reads SU24 and adds the proposed objects to the role.','<b>Role:</b> the result, with authorization data you then complete with values.'],
['You add FB60, Enter Incoming Invoice, to the role menu.','PFCG reads SU24 and proposes the objects the transaction checks.','Objects with check set to Yes and proposal set are added automatically to the role.','You maintain the values, such as company code and activity, so the role is narrow and correct.']);
FN('1.4',['<b>Find it:</b> use SUIM to list who holds SAP_ALL or other critical access.','<b>Decide:</b> is the access needed? Who is the owner?','<b>Remove:</b> the preferred result for unused or unneeded access.','<b>Emergency ID:</b> logged, time-limited access for rare real emergencies.','<b>Monitor:</b> review the list and the emergency logs regularly.'],
['A profile search in SUIM returns four users with SAP_ALL.','Two are locked or system IDs. They still need owner confirmation but are lower urgency.','Two are active dialog users. These are the findings.','Remove the access, or move the need to controlled emergency access with logging.']);
FN('1.5',['<b>Measure:</b> role size, number of users and what is actually used.','<b>Trace:</b> record the checks real users trigger, to learn real needs.','<b>Split:</b> divide the role into small task roles.','<b>Derive and test:</b> create derived roles for org values and test with users.'],
['Start the trace for the user.','The user repeats the real work. The trace records each check that passes or fails.','A failed check, here F_BKPF_KOA, shows what is missing from the role.','Add it through SU24 and the role, then test again.']);
FN('1.6',['<b>Baseline:</b> record roles, users, conflicts and unused access, so you can prove improvement.','<b>Unused access:</b> remove it first. It is the quickest risk reduction.','<b>Role mining:</b> analyse real usage to design a small set of task roles.','<b>Waves:</b> roll out by department with a rollback plan.','<b>Prove and prevent:</b> show before and after, and check risk at request time.'],
['Collect usage data: what users really use.','Find the patterns shared by groups of users with the same job.','Design small task-based roles with owners for those patterns.','Run risk analysis on the new roles before release so no new conflicts are created.']);
FN('2.1',['<b>Risk:</b> a dangerous combination, such as creating a vendor and paying it.','<b>Function 1:</b> vendor master maintenance, for example the actions XK01 and FK01.','<b>Function 2:</b> payment processing, for example F110 and F-53.','<b>Actions and permissions (1):</b> the transactions and objects that make up the first function.','<b>Actions and permissions (2):</b> the same for the second function.'],
['Read the roles assigned to the user.','Collect all the actions those roles allow.','Compare actions and permissions with the functions of each risk.','If the user holds both functions of a risk with the permissions, the risk is reported.']);
FN('2.2',['<b>Conflict found:</b> ARA reports a risk for a user.','<b>Both needed?:</b> ask the business whether the job really requires both duties.','<b>Remove access:</b> the cleanest fix when it is not needed.','<b>Mitigate with control:</b> when both are truly needed, add a control with an owner and evidence.','<b>Monitor:</b> check that the removal or the control continues to work.'],
['Ask the business owner why the user holds both duties.','Test the answer against the actual process and job.','If the need is not real, remove the access.','If the need is real, assign a mitigating control with an owner, frequency and evidence.']);
FN('2.3',['<b>Risk:</b> the specific conflict being covered, for example P010.','<b>Control:</b> a precise activity that would catch misuse, such as a weekly review of vendor bank changes.','<b>Owner:</b> a person independent of the risky duties.','<b>Evidence:</b> a signed report or log for every period.'],
['Pick a control that matches the exact risk.','Name the monitor and set valid-from and valid-to dates.','Assign the control to the user and the risk in GRC.','Test that it really runs and keep the evidence. A control on paper only is a finding.']);
